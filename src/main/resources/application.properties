spring.application.name=dev

# Load local database credentials from the project-root .env file.
# Real environment variables with the same names take precedence.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis connection
# Password/username can be supplied with Spring Boot standard environment
# variables such as SPRING_DATA_REDIS_PASSWORD when ACL authentication is used.
# In Docker Swarm, REDIS_HOST should be the Redis service name on the shared
# overlay network (for example, redis), not localhost.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Cross-instance realtime event module
# Disabled by default so local development does not require Redis.
# When multiple environments share one Redis, give each environment unique
# REDIS_MEETING_CHANNEL and REDIS_AUTH_CHANNEL values.
meetback.realtime.redis.enabled=${REDIS_REALTIME_ENABLED:false}
meetback.realtime.redis.meeting-channel=${REDIS_MEETING_CHANNEL:meetback:realtime:meeting:v1}
meetback.realtime.redis.auth-channel=${REDIS_AUTH_CHANNEL:meetback:realtime:auth:v1}
spring.data.redis.repositories.enabled=false

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.meetback.dev.domain
mybatis.configuration.map-underscore-to-camel-case=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}


# Kakao OAuth
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.redirect-uri=${KAKAO_REDIRECT_URI}
kakao.client-secret=${KAKAO_CLIENT_SECRET}

kakao.rest-api-key=${KAKAO_REST_API_KEY}

# Google Identity Services
google.client-id=${GOOGLE_CLIENT_ID:}

# odsay api
odsay.api-key=${ODSAY_API_KEY}
odsay.base-url=${ODSAY_BASE_URL}

# Social Signup Token
jwt.social-signup-token-expiration=${JWT_SOCIAL_SIGNUP_TOKEN_EXPIRATION:600000}

# Password Reset Token
jwt.password-reset-token-expiration=${JWT_PASSWORD_RESET_TOKEN_EXPIRATION:900000}

# Application URL
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# naver
naver.maps.client-id=${NAVER_MAPS_CLIENT_ID}
naver.maps.client-secret=${NAVER_MAPS_CLIENT_SECRET}

# Feed Image Upload
feed.image.upload-dir=${FEED_IMAGE_UPLOAD_DIR:uploads/feed}

# Multipart Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB