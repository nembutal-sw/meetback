<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>MeetBack 후기 상세</title>
</head>

<body th:attr="data-feed-id=${feedId}">

<div>

  <h1>
    후기 상세
  </h1>

  <div id="feedMessage">
    후기를 불러오고 있습니다.
  </div>

  <div
          id="feedContainer"
          style="display: none;">

    <div>
      작성자 ID :
      <span id="writerId">
            </span>
    </div>

    <br>

    <div>
      작성일 :
      <span id="createdAt">
            </span>
    </div>

    <br>

    <div>

      <label for="feedTitle">
        제목
      </label>

      <input
              type="text"
              id="feedTitle"
              maxlength="255"
              readonly>

    </div>

    <br>

    <div>

      <label for="feedContent">
        내용
      </label>

      <br>

      <textarea
              id="feedContent"
              rows="10"
              readonly></textarea>

    </div>

    <br>

    <div>

      <h3>
        이미지
      </h3>

      <div id="imageContainer">
      </div>

    </div>

    <br>

    <div>

      <a th:href="@{/feed}">
        목록
      </a>

      <button
              type="button"
              id="editButton"
              style="display: none;">
        수정
      </button>

      <button
              type="button"
              id="saveButton"
              style="display: none;">
        수정 완료
      </button>

      <button
              type="button"
              id="cancelEditButton"
              style="display: none;">
        수정 취소
      </button>

      <button
              type="button"
              id="deleteButton"
              style="display: none;">
        삭제
      </button>

    </div>

  </div>

</div>


<script>

  const feedMessage =
          document.getElementById(
                  "feedMessage"
          );

  const feedContainer =
          document.getElementById(
                  "feedContainer"
          );

  const writerId =
          document.getElementById(
                  "writerId"
          );

  const createdAt =
          document.getElementById(
                  "createdAt"
          );

  const feedTitle =
          document.getElementById(
                  "feedTitle"
          );

  const feedContent =
          document.getElementById(
                  "feedContent"
          );

  const imageContainer =
          document.getElementById(
                  "imageContainer"
          );

  const editButton =
          document.getElementById(
                  "editButton"
          );

  const saveButton =
          document.getElementById(
                  "saveButton"
          );

  const cancelEditButton =
          document.getElementById(
                  "cancelEditButton"
          );

  const deleteButton =
          document.getElementById(
                  "deleteButton"
          );


  const feedId =
          document.body.dataset.feedId;


  const accessToken =
          localStorage.getItem(
                  "accessToken"
          );


  const currentUserId =
          localStorage.getItem(
                  "userId"
          );


  let currentFeed = null;

  let originalTitle = "";
  let originalContent = "";


  function formatDate(
          dateString
  ) {

    if (!dateString) {
      return "";
    }


    const date =
            new Date(
                    dateString
            );


    if (
            Number.isNaN(
                    date.getTime()
            )
    ) {

      return dateString;
    }


    return date.toLocaleString(
            "ko-KR"
    );
  }


  function renderImages(
          images
  ) {

    imageContainer.innerHTML =
            "";


    if (
            !Array.isArray(
                    images
            )
            ||
            images.length === 0
    ) {

      imageContainer.textContent =
              "등록된 이미지가 없습니다.";

      return;
    }


    for (
            const feedImage
            of images
            ) {

      const wrapper =
              document.createElement(
                      "div"
              );


      const image =
              document.createElement(
                      "img"
              );


      image.src =
              feedImage.imageUrl;

      image.alt =
              feedImage.originalName
              || "후기 이미지";

      image.style.width =
              "300px";

      image.style.maxWidth =
              "100%";

      image.style.height =
              "auto";


      wrapper.appendChild(
              image
      );


      imageContainer.appendChild(
              wrapper
      );
    }
  }


  function isCurrentUserWriter() {

    if (
            !currentFeed
            ||
            currentUserId == null
    ) {

      return false;
    }


    return String(
            currentFeed.userId
    ) === String(
            currentUserId
    );
  }


  function renderFeed(
          feed
  ) {

    writerId.textContent =
            feed.userId;


    createdAt.textContent =
            formatDate(
                    feed.createdAt
            );


    feedTitle.value =
            feed.title
            || "";


    feedContent.value =
            feed.content
            || "";


    originalTitle =
            feedTitle.value;


    originalContent =
            feedContent.value;


    renderImages(
            feed.images
    );


    if (
            isCurrentUserWriter()
    ) {

      editButton.style.display =
              "inline-block";

      deleteButton.style.display =
              "inline-block";
    }
    else {

      editButton.style.display =
              "none";

      deleteButton.style.display =
              "none";
    }


    feedContainer.style.display =
            "block";


    feedMessage.textContent =
            "";
  }


  async function loadFeed() {

    if (!accessToken) {

      window.location.href =
              "/login";

      return;
    }


    if (!feedId) {

      feedMessage.textContent =
              "올바르지 않은 후기입니다.";

      return;
    }


    try {

      const response =
              await fetch(
                      "/api/feeds/"
                      + encodeURIComponent(
                              feedId
                      ),
                      {
                        method: "GET",

                        headers: {
                          "Authorization":
                                  "Bearer "
                                  + accessToken
                        }
                      }
              );


      if (
              response.status === 401
              ||
              response.status === 403
      ) {

        window.location.href =
                "/login";

        return;
      }


      if (!response.ok) {

        throw new Error(
                "후기를 불러오지 못했습니다."
        );
      }


      currentFeed =
              await response.json();


      renderFeed(
              currentFeed
      );

    }
    catch (error) {

      console.error(
              "[FEED DETAIL ERROR]",
              error
      );


      feedMessage.textContent =
              error.message
              || "후기 조회 중 오류가 발생했습니다.";
    }
  }


  function startEdit() {

    if (
            !isCurrentUserWriter()
    ) {

      return;
    }


    originalTitle =
            feedTitle.value;

    originalContent =
            feedContent.value;


    feedTitle.readOnly =
            false;

    feedContent.readOnly =
            false;


    editButton.style.display =
            "none";

    deleteButton.style.display =
            "none";

    saveButton.style.display =
            "inline-block";

    cancelEditButton.style.display =
            "inline-block";
  }


  function finishEditMode() {

    feedTitle.readOnly =
            true;

    feedContent.readOnly =
            true;


    saveButton.style.display =
            "none";

    cancelEditButton.style.display =
            "none";


    if (
            isCurrentUserWriter()
    ) {

      editButton.style.display =
              "inline-block";

      deleteButton.style.display =
              "inline-block";
    }
  }


  function cancelEdit() {

    feedTitle.value =
            originalTitle;

    feedContent.value =
            originalContent;


    finishEditMode();
  }


  async function updateFeed() {

    const title =
            feedTitle.value.trim();

    const content =
            feedContent.value.trim();


    if (!title) {

      feedMessage.textContent =
              "제목을 입력해주세요.";

      return;
    }


    if (!content) {

      feedMessage.textContent =
              "내용을 입력해주세요.";

      return;
    }


    try {

      const response =
              await fetch(
                      "/api/feeds/"
                      + encodeURIComponent(
                              feedId
                      ),
                      {
                        method: "PUT",

                        headers: {
                          "Authorization":
                                  "Bearer "
                                  + accessToken,

                          "Content-Type":
                                  "application/json"
                        },

                        body:
                                JSON.stringify(
                                        {
                                          title:
                                          title,

                                          content:
                                          content
                                        }
                                )
                      }
              );


      if (!response.ok) {

        const errorText =
                await response.text();


        throw new Error(
                errorText
                || "후기 수정에 실패했습니다."
        );
      }


      currentFeed =
              await response.json();


      renderFeed(
              currentFeed
      );


      finishEditMode();


      feedMessage.textContent =
              "후기가 수정되었습니다.";

    }
    catch (error) {

      console.error(
              "[FEED UPDATE ERROR]",
              error
      );


      feedMessage.textContent =
              error.message
              || "후기 수정 중 오류가 발생했습니다.";
    }
  }


  async function deleteFeed() {

    if (
            !window.confirm(
                    "정말 이 후기를 삭제하시겠습니까?"
            )
    ) {

      return;
    }


    try {

      const response =
              await fetch(
                      "/api/feeds/"
                      + encodeURIComponent(
                              feedId
                      ),
                      {
                        method:
                                "DELETE",

                        headers: {
                          "Authorization":
                                  "Bearer "
                                  + accessToken
                        }
                      }
              );


      if (!response.ok) {

        const errorText =
                await response.text();


        throw new Error(
                errorText
                || "후기 삭제에 실패했습니다."
        );
      }


      window.location.href =
              "/feed";

    }
    catch (error) {

      console.error(
              "[FEED DELETE ERROR]",
              error
      );


      feedMessage.textContent =
              error.message
              || "후기 삭제 중 오류가 발생했습니다.";
    }
  }


  editButton.addEventListener(
          "click",
          startEdit
  );


  saveButton.addEventListener(
          "click",
          updateFeed
  );


  cancelEditButton.addEventListener(
          "click",
          cancelEdit
  );


  deleteButton.addEventListener(
          "click",
          deleteFeed
  );


  loadFeed();

</script>

</body>
</html>
