<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>MeetBack 후기</title>

    <style>

        body {
            margin: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .feed-page {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 0;
        }

        .feed-page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 20px;
        }

        .feed-navigation {
            display: flex;
            gap: 12px;
        }

        .feed-navigation a {
            text-decoration: none;
        }

        .feed-message {
            margin-bottom: 15px;
        }

        .feed-card {
            background: white;

            border: 1px solid #dddddd;

            margin-bottom: 25px;
        }


        /* ========================================================
           작성자
           ======================================================== */

        .feed-header {
            display: flex;
            align-items: center;

            padding: 12px;
        }

        .profile-initial {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-right: 10px;

            background: #eeeeee;

            font-size: 18px;
            font-weight: bold;

            flex-shrink: 0;
        }

        .feed-nickname {
            flex: 1;

            font-weight: bold;
        }


        /* ========================================================
           ⋯ 메뉴
           ======================================================== */

        .feed-menu-area {
            position: relative;

            margin-left: auto;
        }

        .feed-menu-button {
            border: none;
            background: none;

            padding: 5px 10px;

            font-size: 26px;
            font-weight: bold;

            line-height: 1;

            cursor: pointer;
        }

        .feed-menu-popup {
            position: absolute;

            top: 35px;
            right: 0;

            display: none;

            min-width: 130px;

            background: white;

            border: 1px solid #cccccc;

            z-index: 100;
        }

        .feed-menu-popup button {
            display: block;

            width: 100%;

            border: none;
            background: white;

            padding: 11px;

            text-align: center;

            cursor: pointer;
        }

        .feed-menu-popup button:hover {
            background: #f5f5f5;
        }


        /* ========================================================
           이미지
           ======================================================== */

        .feed-image-area {
            position: relative;

            width: 100%;
            height: 500px;

            background: black;

            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .feed-image {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;
        }

        .feed-image-count {
            position: absolute;

            top: 12px;
            right: 12px;

            padding: 5px 9px;

            border-radius: 15px;

            background: rgba(0, 0, 0, 0.65);

            color: white;

            font-size: 13px;

            z-index: 5;
        }

        .feed-slide-button {
            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            width: 40px;
            height: 40px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.85);

            font-size: 25px;

            cursor: pointer;

            z-index: 5;
        }

        .feed-previous-button {
            left: 10px;
        }

        .feed-next-button {
            right: 10px;
        }


        /* ========================================================
           이미지 점
           ======================================================== */

        .feed-indicator-container {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 5px;

            padding: 9px;
        }

        .feed-indicator {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #cccccc;
        }

        .feed-indicator.active {
            background: #555555;
        }


        /* ========================================================
           후기 내용
           ======================================================== */

        .feed-body {
            padding: 12px;
        }

        .feed-title {
            margin-bottom: 8px;

            font-size: 18px;
            font-weight: bold;

            word-break: break-word;
        }

        .feed-content {
            margin-bottom: 12px;

            white-space: pre-wrap;
            word-break: break-word;
        }

        .feed-created-at {
            color: #888888;

            font-size: 12px;
        }


        /* ========================================================
           후기 수정
           ======================================================== */

        .feed-edit-title {
            width: 100%;

            box-sizing: border-box;

            margin-bottom: 10px;

            padding: 8px;
        }

        .feed-edit-content {
            width: 100%;
            min-height: 120px;

            box-sizing: border-box;

            padding: 8px;

            resize: vertical;
        }

        .feed-edit-buttons {
            display: flex;

            gap: 8px;

            margin-top: 10px;
        }

    </style>

</head>


<body>

<div class="feed-page">


    <!-- =========================================================
         상단
         ========================================================= -->

    <div class="feed-page-header">

        <h1>
            후기 게시판
        </h1>


        <div class="feed-navigation">

            <a th:href="@{/feed/write}">
                후기 작성
            </a>

            <a th:href="@{/home}">
                홈
            </a>

        </div>

    </div>


    <!-- =========================================================
         메시지
         ========================================================= -->

    <div
            id="feedMessage"
            class="feed-message">

        후기를 불러오고 있습니다.

    </div>


    <!-- =========================================================
         후기 목록
         ========================================================= -->

    <div id="feedContainer">
    </div>

</div>


<script>

    // ============================================================
    // DOM
    // ============================================================

    const feedContainer =
        document.getElementById(
            "feedContainer"
        );

    const feedMessage =
        document.getElementById(
            "feedMessage"
        );


    // ============================================================
    // Access Token
    // ============================================================

    const accessToken =
        localStorage.getItem(
            "accessToken"
        );


    // ============================================================
    // JWT payload 읽기
    // ============================================================

    function parseJwtPayload(
        token
    ) {

        if (!token) {

            return null;
        }


        try {

            const parts =
                token.split(
                    "."
                );


            if (
                parts.length !== 3
            ) {

                return null;
            }


            let payload =
                parts[1]
                    .replace(
                        /-/g,
                        "+"
                    )
                    .replace(
                        /_/g,
                        "/"
                    );


            while (
                payload.length % 4 !== 0
                ) {

                payload += "=";
            }


            return JSON.parse(
                atob(
                    payload
                )
            );

        }
        catch (error) {

            console.error(
                "[JWT PARSE ERROR]",
                error
            );


            return null;
        }
    }


    // ============================================================
    // 현재 로그인 사용자 ID
    //
    // 1. localStorage userId
    // 2. 없으면 JWT sub
    // ============================================================

    function getCurrentUserId()
    {

        const storedUserId =
            localStorage.getItem(
                "userId"
            );


        if (
            storedUserId != null
            &&
            storedUserId !== ""
        ) {

            return String(
                storedUserId
            );
        }


        const payload =
            parseJwtPayload(
                accessToken
            );


        if (
            payload == null
            ||
            payload.sub == null
        ) {

            return null;
        }


        return String(
            payload.sub
        );
    }


    const currentUserId =
        getCurrentUserId();


    console.log(
        "[CURRENT USER ID]",
        currentUserId
    );


    // ============================================================
    // 닉네임 -> 이니셜
    // ============================================================

    function getProfileInitial(
        nickname
    ) {

        if (
            nickname == null
            ||
            nickname.trim() === ""
            ||
            nickname === "알 수 없음"
        ) {

            return "?";
        }


        return nickname
            .trim()
            .charAt(0)
            .toUpperCase();
    }


    // ============================================================
    // 날짜
    // ============================================================

    function formatDate(
        dateString
    ) {

        if (!dateString) {

            return "";
        }


        const date =
            new Date(
                dateString
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return dateString;
        }


        return date.toLocaleString(
            "ko-KR"
        );
    }


    // ============================================================
    // 본인 후기 판별
    // ============================================================

    function isMyFeed(
        feed
    ) {

        if (
            currentUserId == null
            ||
            feed.userId == null
        ) {

            return false;
        }


        const result =
            String(
                currentUserId
            ) === String(
                feed.userId
            );


        console.log(
            "[FEED OWNER CHECK]",
            {
                currentUserId:
                currentUserId,

                feedUserId:
                feed.userId,

                nickname:
                feed.nickname,

                isMyFeed:
                result
            }
        );


        return result;
    }


    // ============================================================
    // 후기 카드
    // ============================================================

    function createFeedCard(
        feed
    ) {

        const card =
            document.createElement(
                "article"
            );


        card.className =
            "feed-card";


        card.dataset.feedId =
            feed.feedId;


        // ========================================================
        // HEADER
        // ========================================================

        const header =
            document.createElement(
                "div"
            );


        header.className =
            "feed-header";


        // --------------------------------------------------------
        // 이니셜
        // --------------------------------------------------------

        const profile =
            document.createElement(
                "div"
            );


        profile.className =
            "profile-initial";


        profile.textContent =
            getProfileInitial(
                feed.nickname
            );


        header.appendChild(
            profile
        );


        // --------------------------------------------------------
        // 닉네임
        // --------------------------------------------------------

        const nickname =
            document.createElement(
                "div"
            );


        nickname.className =
            "feed-nickname";


        nickname.textContent =
            feed.nickname
            || "알 수 없음";


        header.appendChild(
            nickname
        );


        // --------------------------------------------------------
        // 본인 후기면 ⋯
        // --------------------------------------------------------

        if (
            isMyFeed(
                feed
            )
        ) {

            const menuArea =
                createMenuArea(
                    feed,
                    card
                );


            header.appendChild(
                menuArea
            );
        }


        card.appendChild(
            header
        );


        // ========================================================
        // IMAGE
        // ========================================================

        createImageSlider(
            feed,
            card
        );


        // ========================================================
        // BODY
        // ========================================================

        const body =
            createFeedBody(
                feed
            );


        card.appendChild(
            body
        );


        return card;
    }


    // ============================================================
    // ⋯ 수정 / 삭제 메뉴
    // ============================================================

    function createMenuArea(
        feed,
        card
    ) {

        const menuArea =
            document.createElement(
                "div"
            );


        menuArea.className =
            "feed-menu-area";


        const menuButton =
            document.createElement(
                "button"
            );


        menuButton.type =
            "button";


        menuButton.className =
            "feed-menu-button";


        menuButton.textContent =
            "⋯";


        const menuPopup =
            document.createElement(
                "div"
            );


        menuPopup.className =
            "feed-menu-popup";


        // --------------------------------------------------------
        // 후기 수정
        // --------------------------------------------------------

        const editButton =
            document.createElement(
                "button"
            );


        editButton.type =
            "button";


        editButton.textContent =
            "후기 수정";


        // --------------------------------------------------------
        // 후기 삭제
        // --------------------------------------------------------

        const deleteButton =
            document.createElement(
                "button"
            );


        deleteButton.type =
            "button";


        deleteButton.textContent =
            "후기 삭제";


        menuPopup.appendChild(
            editButton
        );


        menuPopup.appendChild(
            deleteButton
        );


        menuArea.appendChild(
            menuButton
        );


        menuArea.appendChild(
            menuPopup
        );


        // --------------------------------------------------------
        // ⋯ 클릭
        // --------------------------------------------------------

        menuButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                const currentlyOpen =
                    menuPopup.style.display
                    === "block";


                closeAllMenus(
                    null
                );


                menuPopup.style.display =
                    currentlyOpen
                        ? "none"
                        : "block";
            }
        );


        // --------------------------------------------------------
        // 수정
        // --------------------------------------------------------

        editButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                menuPopup.style.display =
                    "none";


                startInlineEdit(
                    feed,
                    card
                );
            }
        );


        // --------------------------------------------------------
        // 삭제
        // --------------------------------------------------------

        deleteButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                menuPopup.style.display =
                    "none";


                deleteFeed(
                    feed.feedId
                );
            }
        );


        return menuArea;
    }


    // ============================================================
    // 메뉴 전체 닫기
    // ============================================================

    function closeAllMenus()
    {

        const menus =
            document.querySelectorAll(
                ".feed-menu-popup"
            );


        menus.forEach(
            function(menu) {

                menu.style.display =
                    "none";
            }
        );
    }


    // ============================================================
    // 이미지 슬라이더
    // ============================================================

    function createImageSlider(
        feed,
        card
    ) {

        const images =
            Array.isArray(
                feed.images
            )
                ? feed.images
                : [];


        if (
            images.length === 0
        ) {

            return;
        }


        let currentImageIndex =
            0;


        const imageArea =
            document.createElement(
                "div"
            );


        imageArea.className =
            "feed-image-area";


        // --------------------------------------------------------
        // 이미지
        // --------------------------------------------------------

        const image =
            document.createElement(
                "img"
            );


        image.className =
            "feed-image";


        imageArea.appendChild(
            image
        );


        // --------------------------------------------------------
        // 1 / N
        // --------------------------------------------------------

        const imageCount =
            document.createElement(
                "div"
            );


        imageCount.className =
            "feed-image-count";


        imageArea.appendChild(
            imageCount
        );


        // --------------------------------------------------------
        // 이전 버튼
        // --------------------------------------------------------

        const previousButton =
            document.createElement(
                "button"
            );


        previousButton.type =
            "button";


        previousButton.className =
            "feed-slide-button feed-previous-button";


        previousButton.textContent =
            "‹";


        imageArea.appendChild(
            previousButton
        );


        // --------------------------------------------------------
        // 다음 버튼
        // --------------------------------------------------------

        const nextButton =
            document.createElement(
                "button"
            );


        nextButton.type =
            "button";


        nextButton.className =
            "feed-slide-button feed-next-button";


        nextButton.textContent =
            "›";


        imageArea.appendChild(
            nextButton
        );


        card.appendChild(
            imageArea
        );


        // --------------------------------------------------------
        // 점 표시
        // --------------------------------------------------------

        const indicatorContainer =
            document.createElement(
                "div"
            );


        indicatorContainer.className =
            "feed-indicator-container";


        card.appendChild(
            indicatorContainer
        );


        // ========================================================
        // 현재 이미지 출력
        // ========================================================

        function renderCurrentImage()
        {

            const currentImage =
                images[
                    currentImageIndex
                    ];


            image.src =
                currentImage.imageUrl;


            image.alt =
                currentImage.originalName
                || "후기 이미지";


            imageCount.textContent =
                (currentImageIndex + 1)
                + " / "
                + images.length;


            indicatorContainer.innerHTML =
                "";


            images.forEach(
                function(
                    ignoredImage,
                    index
                ) {

                    const indicator =
                        document.createElement(
                            "div"
                        );


                    indicator.className =
                        "feed-indicator";


                    if (
                        index
                        === currentImageIndex
                    ) {

                        indicator.classList.add(
                            "active"
                        );
                    }


                    indicatorContainer.appendChild(
                        indicator
                    );
                }
            );


            // ----------------------------------------------------
            // 사진 한 장이면 버튼 숨김
            // ----------------------------------------------------

            if (
                images.length === 1
            ) {

                previousButton.style.display =
                    "none";


                nextButton.style.display =
                    "none";


                imageCount.style.display =
                    "none";


                indicatorContainer.style.display =
                    "none";
            }
            else {

                previousButton.style.display =
                    "block";


                nextButton.style.display =
                    "block";


                imageCount.style.display =
                    "block";


                indicatorContainer.style.display =
                    "flex";
            }
        }


        // ========================================================
        // 이전
        // ========================================================

        previousButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                currentImageIndex--;


                if (
                    currentImageIndex < 0
                ) {

                    currentImageIndex =
                        images.length - 1;
                }


                renderCurrentImage();
            }
        );


        // ========================================================
        // 다음
        // ========================================================

        nextButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                currentImageIndex++;


                if (
                    currentImageIndex
                    >= images.length
                ) {

                    currentImageIndex =
                        0;
                }


                renderCurrentImage();
            }
        );


        renderCurrentImage();
    }


    // ============================================================
    // 후기 본문
    // ============================================================

    function createFeedBody(
        feed
    ) {

        const body =
            document.createElement(
                "div"
            );


        body.className =
            "feed-body";


        // --------------------------------------------------------
        // 제목
        // --------------------------------------------------------

        const title =
            document.createElement(
                "div"
            );


        title.className =
            "feed-title";


        title.textContent =
            feed.title
            || "";


        // --------------------------------------------------------
        // 내용
        // --------------------------------------------------------

        const content =
            document.createElement(
                "div"
            );


        content.className =
            "feed-content";


        content.textContent =
            feed.content
            || "";


        // --------------------------------------------------------
        // 작성시간
        // --------------------------------------------------------

        const createdAt =
            document.createElement(
                "div"
            );


        createdAt.className =
            "feed-created-at";


        createdAt.textContent =
            formatDate(
                feed.createdAt
            );


        body.appendChild(
            title
        );


        body.appendChild(
            content
        );


        body.appendChild(
            createdAt
        );


        return body;
    }


    // ============================================================
    // 카드 내부 후기 수정
    // ============================================================

    function startInlineEdit(
        feed,
        card
    ) {

        if (
            !isMyFeed(
                feed
            )
        ) {

            alert(
                "본인이 작성한 후기만 수정할 수 있습니다."
            );


            return;
        }


        const body =
            card.querySelector(
                ".feed-body"
            );


        body.innerHTML =
            "";


        // --------------------------------------------------------
        // 제목 input
        // --------------------------------------------------------

        const titleInput =
            document.createElement(
                "input"
            );


        titleInput.type =
            "text";


        titleInput.className =
            "feed-edit-title";


        titleInput.maxLength =
            255;


        titleInput.value =
            feed.title
            || "";


        // --------------------------------------------------------
        // 내용 textarea
        // --------------------------------------------------------

        const contentInput =
            document.createElement(
                "textarea"
            );


        contentInput.className =
            "feed-edit-content";


        contentInput.value =
            feed.content
            || "";


        // --------------------------------------------------------
        // 버튼 영역
        // --------------------------------------------------------

        const buttonArea =
            document.createElement(
                "div"
            );


        buttonArea.className =
            "feed-edit-buttons";


        const saveButton =
            document.createElement(
                "button"
            );


        saveButton.type =
            "button";


        saveButton.textContent =
            "후기 수정 완료";


        const cancelButton =
            document.createElement(
                "button"
            );


        cancelButton.type =
            "button";


        cancelButton.textContent =
            "취소";


        buttonArea.appendChild(
            saveButton
        );


        buttonArea.appendChild(
            cancelButton
        );


        body.appendChild(
            titleInput
        );


        body.appendChild(
            contentInput
        );


        body.appendChild(
            buttonArea
        );


        // ========================================================
        // 수정 저장
        // ========================================================

        saveButton.addEventListener(
            "click",
            async function() {

                const title =
                    titleInput
                        .value
                        .trim();


                const content =
                    contentInput
                        .value
                        .trim();


                if (!title) {

                    alert(
                        "제목을 입력해주세요."
                    );


                    return;
                }


                if (!content) {

                    alert(
                        "후기 내용을 입력해주세요."
                    );


                    return;
                }


                saveButton.disabled =
                    true;


                try {

                    const response =
                        await fetch(
                            "/api/feeds/"
                            + encodeURIComponent(
                                feed.feedId
                            ),
                            {

                                method:
                                    "PUT",

                                headers: {

                                    "Authorization":
                                        "Bearer "
                                        + accessToken,

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify(
                                        {

                                            title:
                                            title,

                                            content:
                                            content

                                        }
                                    )
                            }
                        );


                    if (
                        response.status === 401
                        ||
                        response.status === 403
                    ) {

                        window.location.href =
                            "/login";


                        return;
                    }


                    if (
                        !response.ok
                    ) {

                        const errorText =
                            await response.text();


                        throw new Error(
                            errorText
                            || "후기 수정에 실패했습니다."
                        );
                    }


                    await loadFeeds();

                }
                catch (error) {

                    console.error(
                        "[FEED UPDATE ERROR]",
                        error
                    );


                    alert(
                        error.message
                        || "후기 수정 중 오류가 발생했습니다."
                    );
                }
                finally {

                    saveButton.disabled =
                        false;
                }
            }
        );


        // ========================================================
        // 수정 취소
        // ========================================================

        cancelButton.addEventListener(
            "click",
            function() {

                loadFeeds();
            }
        );
    }


    // ============================================================
    // 후기 삭제
    // ============================================================

    async function deleteFeed(
        feedId
    ) {

        const confirmed =
            window.confirm(
                "정말 이 후기를 삭제하시겠습니까?"
            );


        if (!confirmed) {

            return;
        }


        try {

            const response =
                await fetch(
                    "/api/feeds/"
                    + encodeURIComponent(
                        feedId
                    ),
                    {

                        method:
                            "DELETE",

                        headers: {

                            "Authorization":
                                "Bearer "
                                + accessToken

                        }

                    }
                );


            if (
                response.status === 401
                ||
                response.status === 403
            ) {

                window.location.href =
                    "/login";


                return;
            }


            if (
                !response.ok
            ) {

                const errorText =
                    await response.text();


                throw new Error(
                    errorText
                    || "후기 삭제에 실패했습니다."
                );
            }


            await loadFeeds();

        }
        catch (error) {

            console.error(
                "[FEED DELETE ERROR]",
                error
            );


            alert(
                error.message
                || "후기 삭제 중 오류가 발생했습니다."
            );
        }
    }


    // ============================================================
    // 후기 조회
    // ============================================================

    async function loadFeeds()
    {

        if (
            !accessToken
        ) {

            window.location.href =
                "/login";


            return;
        }


        try {

            const response =
                await fetch(
                    "/api/feeds",
                    {

                        method:
                            "GET",

                        headers: {

                            "Authorization":
                                "Bearer "
                                + accessToken

                        }

                    }
                );


            if (
                response.status === 401
                ||
                response.status === 403
            ) {

                window.location.href =
                    "/login";


                return;
            }


            if (
                !response.ok
            ) {

                throw new Error(
                    "후기 목록을 불러오지 못했습니다."
                );
            }


            const feeds =
                await response.json();


            console.log(
                "[FEEDS RESPONSE]",
                feeds
            );


            feedContainer.innerHTML =
                "";


            if (
                !Array.isArray(
                    feeds
                )
                ||
                feeds.length === 0
            ) {

                feedMessage.textContent =
                    "아직 작성된 후기가 없습니다.";


                return;
            }


            feedMessage.textContent =
                "";


            for (
                const feed
                of feeds
                ) {

                const feedCard =
                    createFeedCard(
                        feed
                    );


                feedContainer.appendChild(
                    feedCard
                );
            }

        }
        catch (error) {

            console.error(
                "[FEED LIST ERROR]",
                error
            );


            feedMessage.textContent =
                error.message
                || "후기 목록 조회 중 오류가 발생했습니다.";
        }
    }


    // ============================================================
    // 바깥 클릭 시 ⋯ 닫기
    // ============================================================

    document.addEventListener(
        "click",
        function() {

            closeAllMenus();
        }
    );


    // ============================================================
    // 실행
    // ============================================================

    loadFeeds();

</script>
