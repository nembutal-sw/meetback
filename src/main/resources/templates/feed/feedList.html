<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>MeetBack 후기</title>

    <style>

        body {
            margin: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .feed-page {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 0;
        }

        .feed-page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 20px;
        }

        .feed-navigation {
            display: flex;
            gap: 12px;
        }

        .feed-navigation a {
            text-decoration: none;
        }

        .feed-message {
            margin-bottom: 15px;
        }

        .feed-card {
            background: white;

            border: 1px solid #dddddd;

            margin-bottom: 25px;
        }


        /* ========================================================
           작성자
           ======================================================== */

        .feed-header {
            display: flex;
            align-items: center;

            padding: 12px;
        }

        .profile-initial {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-right: 10px;

            background: #eeeeee;

            font-size: 18px;
            font-weight: bold;

            flex-shrink: 0;
        }

        .feed-nickname {
            flex: 1;

            font-weight: bold;
        }


        /* ========================================================
           ⋯ 메뉴
           ======================================================== */

        .feed-menu-area {
            position: relative;

            margin-left: auto;
        }

        .feed-menu-button {
            border: none;
            background: none;

            padding: 5px 10px;

            font-size: 26px;
            font-weight: bold;

            line-height: 1;

            cursor: pointer;
        }

        .feed-menu-popup {
            position: absolute;

            top: 35px;
            right: 0;

            display: none;

            min-width: 130px;

            background: white;

            border: 1px solid #cccccc;

            z-index: 100;
        }

        .feed-menu-popup button {
            display: block;

            width: 100%;

            border: none;
            background: white;

            padding: 11px;

            text-align: center;

            cursor: pointer;
        }

        .feed-menu-popup button:hover {
            background: #f5f5f5;
        }


        /* ========================================================
           이미지
           ======================================================== */

        .feed-image-area {
            position: relative;

            width: 100%;
            height: 500px;

            background: black;

            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .feed-image {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;
        }

        .feed-image-count {
            position: absolute;

            top: 12px;
            right: 12px;

            padding: 5px 9px;

            border-radius: 15px;

            background: rgba(0, 0, 0, 0.65);

            color: white;

            font-size: 13px;

            z-index: 5;
        }

        .feed-slide-button {
            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            width: 40px;
            height: 40px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.85);

            font-size: 25px;

            cursor: pointer;

            z-index: 5;
        }

        .feed-previous-button {
            left: 10px;
        }

        .feed-next-button {
            right: 10px;
        }


        /* ========================================================
           이미지 점
           ======================================================== */

        .feed-indicator-container {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 5px;

            padding: 9px;
        }

        .feed-indicator {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #cccccc;
        }

        .feed-indicator.active {
            background: #555555;
        }


        /* ========================================================
           좋아요
           ======================================================== */

        .feed-like-area {
            display: flex;
            align-items: center;

            gap: 8px;

            padding: 10px 12px 0 12px;
        }

        .feed-like-button {
            border: none;
            background: none;

            padding: 0;

            font-size: 30px;
            line-height: 1;

            cursor: pointer;
        }

        .feed-like-button:disabled {
            cursor: default;
            opacity: 0.5;
        }

        .feed-like-count {
            font-size: 14px;
            font-weight: bold;
        }


        /* ========================================================
           후기 내용
           ======================================================== */

        .feed-body {
            padding: 12px;
        }

        .feed-title {
            margin-bottom: 8px;

            font-size: 18px;
            font-weight: bold;

            word-break: break-word;
        }

        .feed-content {
            margin-bottom: 12px;

            white-space: pre-wrap;
            word-break: break-word;
        }

        .feed-created-at {
            color: #888888;

            font-size: 12px;
        }


        /* ========================================================
           댓글
           ======================================================== */

        .feed-comment-area {
            border-top: 1px solid #eeeeee;

            padding: 10px 12px 12px 12px;

            font-size: 12px;
        }

        .feed-comment-count {
            margin-bottom: 9px;

            color: #666666;

            font-size: 12px;
            font-weight: bold;
        }

        .feed-comment-list {
            display: flex;
            flex-direction: column;

            gap: 7px;

            margin-bottom: 10px;
        }

        .feed-comment-item {
            display: flex;
            align-items: flex-start;

            gap: 6px;

            line-height: 1.4;
        }

        .feed-comment-nickname {
            flex-shrink: 0;

            font-size: 12px;
            font-weight: bold;
        }

        .feed-comment-content {
            flex: 1;

            font-size: 12px;

            white-space: pre-wrap;
            word-break: break-word;
        }

        .feed-comment-actions {
            display: flex;

            gap: 5px;

            margin-left: 5px;

            flex-shrink: 0;
        }

        .feed-comment-actions button {
            border: none;
            background: none;

            padding: 0;

            color: #888888;

            font-size: 10px;

            cursor: pointer;
        }

        .feed-comment-actions button:hover {
            color: #333333;

            text-decoration: underline;
        }

        .feed-comment-empty {
            color: #999999;

            font-size: 11px;
        }

        .feed-comment-form {
            display: flex;

            gap: 6px;

            margin-top: 8px;
        }

        .feed-comment-input {
            flex: 1;

            box-sizing: border-box;

            border: 1px solid #dddddd;
            border-radius: 4px;

            padding: 7px 8px;

            font-size: 12px;
        }

        .feed-comment-submit {
            border: 1px solid #cccccc;
            background: white;

            padding: 6px 11px;

            font-size: 11px;

            cursor: pointer;
        }

        .feed-comment-submit:disabled {
            cursor: default;

            opacity: 0.5;
        }

        .feed-comment-edit-input {
            flex: 1;

            box-sizing: border-box;

            border: 1px solid #cccccc;
            border-radius: 4px;

            padding: 5px 7px;

            font-size: 12px;
        }


        /* ========================================================
           후기 수정
           ======================================================== */

        .feed-edit-title {
            width: 100%;

            box-sizing: border-box;

            margin-bottom: 10px;

            padding: 8px;
        }

        .feed-edit-content {
            width: 100%;
            min-height: 120px;

            box-sizing: border-box;

            padding: 8px;

            resize: vertical;
        }

        .feed-edit-buttons {
            display: flex;

            gap: 8px;

            margin-top: 10px;
        }

    </style>

</head>


<body>

<div class="feed-page">


    <!-- =========================================================
         상단
         ========================================================= -->

    <div class="feed-page-header">

        <h1>
            후기 게시판
        </h1>


        <div class="feed-navigation">

            <a th:href="@{/feed/write}">
                후기 작성
            </a>

            <a th:href="@{/home}">
                홈
            </a>

        </div>

    </div>


    <!-- =========================================================
         메시지
         ========================================================= -->

    <div
            id="feedMessage"
            class="feed-message">

        후기를 불러오고 있습니다.

    </div>


    <!-- =========================================================
         후기 목록
         ========================================================= -->

    <div id="feedContainer">
    </div>

</div>


<script>

    // ============================================================
    // DOM
    // ============================================================

    const feedContainer =
        document.getElementById(
            "feedContainer"
        );

    const feedMessage =
        document.getElementById(
            "feedMessage"
        );


    // ============================================================
    // Access Token
    // ============================================================

    const accessToken =
        localStorage.getItem(
            "accessToken"
        );


    // ============================================================
    // JWT payload 읽기
    // ============================================================

    function parseJwtPayload(
        token
    ) {

        if (!token) {

            return null;
        }


        try {

            const parts =
                token.split(
                    "."
                );


            if (
                parts.length !== 3
            ) {

                return null;
            }


            let payload =
                parts[1]
                    .replace(
                        /-/g,
                        "+"
                    )
                    .replace(
                        /_/g,
                        "/"
                    );


            while (
                payload.length % 4 !== 0
                ) {

                payload += "=";
            }


            return JSON.parse(
                atob(
                    payload
                )
            );

        }
        catch (error) {

            console.error(
                "[JWT PARSE ERROR]",
                error
            );


            return null;
        }
    }


    // ============================================================
    // 현재 로그인 사용자 ID
    //
    // 1. localStorage userId
    // 2. 없으면 JWT sub
    // ============================================================

    function getCurrentUserId()
    {

        const storedUserId =
            localStorage.getItem(
                "userId"
            );


        if (
            storedUserId != null
            &&
            storedUserId !== ""
        ) {

            return String(
                storedUserId
            );
        }


        const payload =
            parseJwtPayload(
                accessToken
            );


        if (
            payload == null
            ||
            payload.sub == null
        ) {

            return null;
        }


        return String(
            payload.sub
        );
    }


    const currentUserId =
        getCurrentUserId();


    console.log(
        "[CURRENT USER ID]",
        currentUserId
    );


    // ============================================================
    // 닉네임 -> 이니셜
    // ============================================================

    function getProfileInitial(
        nickname
    ) {

        if (
            nickname == null
            ||
            nickname.trim() === ""
            ||
            nickname === "알 수 없음"
        ) {

            return "?";
        }


        return nickname
            .trim()
            .charAt(0)
            .toUpperCase();
    }


    // ============================================================
    // 날짜
    // ============================================================

    function formatDate(
        dateString
    ) {

        if (!dateString) {

            return "";
        }


        const date =
            new Date(
                dateString
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return dateString;
        }


        return date.toLocaleString(
            "ko-KR"
        );
    }


    // ============================================================
    // 본인 후기 판별
    // ============================================================

    function isMyFeed(
        feed
    ) {

        if (
            currentUserId == null
            ||
            feed.userId == null
        ) {

            return false;
        }


        const result =
            String(
                currentUserId
            ) === String(
                feed.userId
            );


        console.log(
            "[FEED OWNER CHECK]",
            {
                currentUserId:
                currentUserId,

                feedUserId:
                feed.userId,

                nickname:
                feed.nickname,

                isMyFeed:
                result
            }
        );


        return result;
    }


    // ============================================================
    // 후기 카드
    // ============================================================

    function createFeedCard(
        feed
    ) {

        const card =
            document.createElement(
                "article"
            );


        card.className =
            "feed-card";


        card.dataset.feedId =
            feed.feedId;


        // ========================================================
        // HEADER
        // ========================================================

        const header =
            document.createElement(
                "div"
            );


        header.className =
            "feed-header";


        // --------------------------------------------------------
        // 이니셜
        // --------------------------------------------------------

        const profile =
            document.createElement(
                "div"
            );


        profile.className =
            "profile-initial";


        profile.textContent =
            getProfileInitial(
                feed.nickname
            );


        header.appendChild(
            profile
        );


        // --------------------------------------------------------
        // 닉네임
        // --------------------------------------------------------

        const nickname =
            document.createElement(
                "div"
            );


        nickname.className =
            "feed-nickname";


        nickname.textContent =
            feed.nickname
            || "알 수 없음";


        header.appendChild(
            nickname
        );


        // --------------------------------------------------------
        // 본인 후기면 ⋯
        // --------------------------------------------------------

        if (
            isMyFeed(
                feed
            )
        ) {

            const menuArea =
                createMenuArea(
                    feed,
                    card
                );


            header.appendChild(
                menuArea
            );
        }


        card.appendChild(
            header
        );


        // ========================================================
        // IMAGE
        // ========================================================

        createImageSlider(
            feed,
            card
        );


        // ========================================================
        // LIKE
        // ========================================================

        createLikeArea(
            feed,
            card
        );


        // ========================================================
        // BODY
        // ========================================================

        const body =
            createFeedBody(
                feed
            );


        card.appendChild(
            body
        );


        // ========================================================
        // COMMENT
        // ========================================================

        createCommentArea(
            feed,
            card
        );


        return card;
    }


    // ============================================================
    // 좋아요 영역
    // ============================================================

    function createLikeArea(
        feed,
        card
    ) {

        const likeArea =
            document.createElement(
                "div"
            );


        likeArea.className =
            "feed-like-area";


        const likeButton =
            document.createElement(
                "button"
            );


        likeButton.type =
            "button";


        likeButton.className =
            "feed-like-button";


        const likeCount =
            document.createElement(
                "span"
            );


        likeCount.className =
            "feed-like-count";


        // ========================================================
        // 좋아요 UI 출력
        // ========================================================

        function renderLike()
        {

            const liked =
                feed.liked === true;


            const count =
                Number(
                    feed.likeCount
                ) || 0;


            likeButton.textContent =
                liked
                    ? "♥"
                    : "♡";


            likeButton.setAttribute(
                "aria-label",
                liked
                    ? "좋아요 취소"
                    : "좋아요"
            );


            likeCount.textContent =
                "좋아요 "
                + count
                + "개";
        }


        // ========================================================
        // 좋아요 클릭
        // ========================================================

        likeButton.addEventListener(
            "click",
            async function() {

                likeButton.disabled =
                    true;


                try {

                    await toggleFeedLike(
                        feed
                    );


                    renderLike();

                }
                catch (error) {

                    console.error(
                        "[FEED LIKE ERROR]",
                        error
                    );


                    alert(
                        error.message
                        || "좋아요 처리 중 오류가 발생했습니다."
                    );

                }
                finally {

                    likeButton.disabled =
                        false;
                }
            }
        );


        renderLike();


        likeArea.appendChild(
            likeButton
        );


        likeArea.appendChild(
            likeCount
        );


        card.appendChild(
            likeArea
        );
    }


    // ============================================================
    // 좋아요 등록 / 취소
    // ============================================================

    async function toggleFeedLike(
        feed
    ) {

        const method =
            feed.liked === true
                ? "DELETE"
                : "POST";


        const response =
            await fetch(
                "/api/feeds/"
                + encodeURIComponent(
                    feed.feedId
                )
                + "/likes",
                {

                    method:
                    method,

                    headers: {

                        "Authorization":
                            "Bearer "
                            + accessToken

                    }

                }
            );


        if (
            response.status === 401
            ||
            response.status === 403
        ) {

            window.location.href =
                "/login";


            return;
        }


        if (
            !response.ok
        ) {

            const errorText =
                await response.text();


            throw new Error(
                errorText
                || "좋아요 처리에 실패했습니다."
            );
        }


        const result =
            await response.json();


        feed.likeCount =
            result.likeCount;


        feed.liked =
            result.liked;
    }


    // ============================================================
    // 댓글 영역
    // ============================================================

    function createCommentArea(
        feed,
        card
    ) {

        const commentArea =
            document.createElement(
                "div"
            );


        commentArea.className =
            "feed-comment-area";


        // --------------------------------------------------------
        // 댓글 개수
        // --------------------------------------------------------

        const commentCount =
            document.createElement(
                "div"
            );


        commentCount.className =
            "feed-comment-count";


        commentCount.textContent =
            "댓글 불러오는 중...";


        // --------------------------------------------------------
        // 댓글 목록
        // --------------------------------------------------------

        const commentList =
            document.createElement(
                "div"
            );


        commentList.className =
            "feed-comment-list";


        // --------------------------------------------------------
        // 댓글 입력 영역
        // --------------------------------------------------------

        const commentForm =
            document.createElement(
                "div"
            );


        commentForm.className =
            "feed-comment-form";


        const commentInput =
            document.createElement(
                "input"
            );


        commentInput.type =
            "text";


        commentInput.className =
            "feed-comment-input";


        commentInput.placeholder =
            "댓글을 입력하세요";


        const commentSubmit =
            document.createElement(
                "button"
            );


        commentSubmit.type =
            "button";


        commentSubmit.className =
            "feed-comment-submit";


        commentSubmit.textContent =
            "등록";


        commentForm.appendChild(
            commentInput
        );


        commentForm.appendChild(
            commentSubmit
        );


        commentArea.appendChild(
            commentCount
        );


        commentArea.appendChild(
            commentList
        );


        commentArea.appendChild(
            commentForm
        );


        card.appendChild(
            commentArea
        );


        // ========================================================
        // 댓글 목록 조회
        // ========================================================

        async function loadComments()
        {

            try {

                const response =
                    await fetch(
                        "/api/feeds/"
                        + encodeURIComponent(
                            feed.feedId
                        )
                        + "/comments",
                        {

                            method:
                                "GET",

                            headers: {

                                "Authorization":
                                    "Bearer "
                                    + accessToken

                            }

                        }
                    );


                if (
                    response.status === 401
                    ||
                    response.status === 403
                ) {

                    window.location.href =
                        "/login";


                    return;
                }


                if (
                    !response.ok
                ) {

                    throw new Error(
                        "댓글을 불러오지 못했습니다."
                    );
                }


                const comments =
                    await response.json();


                renderComments(
                    comments
                );

            }
            catch (error) {

                console.error(
                    "[COMMENT LIST ERROR]",
                    error
                );


                commentCount.textContent =
                    "댓글 조회 실패";
            }
        }


        // ========================================================
        // 댓글 목록 출력
        // ========================================================

        function renderComments(
            comments
        ) {

            commentList.innerHTML =
                "";


            const commentArray =
                Array.isArray(
                    comments
                )
                    ? comments
                    : [];


            commentCount.textContent =
                "댓글 "
                + commentArray.length
                + "개";


            if (
                commentArray.length === 0
            ) {

                const emptyMessage =
                    document.createElement(
                        "div"
                    );


                emptyMessage.className =
                    "feed-comment-empty";


                emptyMessage.textContent =
                    "아직 댓글이 없습니다.";


                commentList.appendChild(
                    emptyMessage
                );


                return;
            }


            for (
                const comment
                of commentArray
                ) {

                const commentItem =
                    createCommentItem(
                        comment,
                        loadComments
                    );


                commentList.appendChild(
                    commentItem
                );
            }
        }


        // ========================================================
        // 댓글 등록
        // ========================================================

        commentSubmit.addEventListener(
            "click",
            async function() {

                const content =
                    commentInput
                        .value
                        .trim();


                if (!content) {

                    alert(
                        "댓글 내용을 입력해주세요."
                    );


                    return;
                }


                commentSubmit.disabled =
                    true;


                try {

                    const response =
                        await fetch(
                            "/api/feeds/"
                            + encodeURIComponent(
                                feed.feedId
                            )
                            + "/comments",
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Authorization":
                                        "Bearer "
                                        + accessToken,

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify(
                                        {

                                            content:
                                            content

                                        }
                                    )

                            }
                        );


                    if (
                        response.status === 401
                        ||
                        response.status === 403
                    ) {

                        window.location.href =
                            "/login";


                        return;
                    }


                    if (
                        !response.ok
                    ) {

                        const errorText =
                            await response.text();


                        throw new Error(
                            errorText
                            || "댓글 등록에 실패했습니다."
                        );
                    }


                    commentInput.value =
                        "";


                    await loadComments();

                }
                catch (error) {

                    console.error(
                        "[COMMENT CREATE ERROR]",
                        error
                    );


                    alert(
                        error.message
                        || "댓글 등록 중 오류가 발생했습니다."
                    );

                }
                finally {

                    commentSubmit.disabled =
                        false;
                }
            }
        );


        // ========================================================
        // Enter 키 댓글 등록
        // ========================================================

        commentInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                    &&
                    !event.isComposing
                ) {

                    event.preventDefault();


                    commentSubmit.click();
                }
            }
        );


        // ========================================================
        // 댓글 최초 조회
        // ========================================================

        loadComments();
    }


    // ============================================================
    // 댓글 한 개 출력
    // ============================================================

    function createCommentItem(
        comment,
        reloadComments
    ) {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "feed-comment-item";


        // --------------------------------------------------------
        // 댓글 작성자 닉네임
        // --------------------------------------------------------

        const nickname =
            document.createElement(
                "span"
            );


        nickname.className =
            "feed-comment-nickname";


        nickname.textContent =
            comment.nickname
            || "알 수 없음";


        // --------------------------------------------------------
        // 댓글 내용
        // --------------------------------------------------------

        const content =

                        return;

                                    comment.commentId

                                    method:
                                        "DELETE",

                                    headers: {

                                        "Authorization":

                                            + accessToken

                        if (

                            false;

    // ============================================================
    // 댓글 수정
    // ============================================================

    function startCommentEdit(
        comment,
        item,
        reloadComments
    ) {

        // --------------------------------------------------------
        // 본인 댓글만 수정 가능
        // --------------------------------------------------------

        if (
            comment.mine !== true
        ) {

            return;
        }


        item.innerHTML =
            "";


        // --------------------------------------------------------
        // 수정 input
        // --------------------------------------------------------

        const editInput =
            document.createElement(
                "input"
            );


        editInput.type =
            "text";


        editInput.className =
            "feed-comment-edit-input";


        editInput.value =
            comment.content
            || "";


        // --------------------------------------------------------
        // 저장 / 취소 버튼 영역
        // --------------------------------------------------------

        const actions =
            document.createElement(
                "div"
            );


        actions.className =
            "feed-comment-actions";


        const saveButton =
            document.createElement(
                "button"
            );


        saveButton.type =
            "button";


        saveButton.textContent =
            "저장";


        const cancelButton =
            document.createElement(
                "button"
            );


        cancelButton.type =
            "button";


        cancelButton.textContent =
            "취소";


        actions.appendChild(
            saveButton
        );


        actions.appendChild(
            cancelButton
        );


        item.appendChild(
            editInput
        );


        item.appendChild(
            actions
        );


        editInput.focus();


        // ========================================================
        // 댓글 수정 저장
        // ========================================================

        saveButton.addEventListener(
            "click",
            async function() {

                const content =
                    editInput
                        .value
                        .trim();


                if (!content) {

                    alert(
                        "댓글 내용을 입력해주세요."
                    );


                    return;
                }


                saveButton.disabled =
                    true;


                try {

                    const response =
                        await fetch(
                            "/api/comments/"
                            + encodeURIComponent(
                                comment.commentId
                            ),
                            {

                                method:
                                    "PUT",

                                headers: {

                                    "Authorization":
                                        "Bearer "
                                        + accessToken,

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify(
                                        {

                                            content:
                                            content

                                        }
                                    )

                            }
                        );


                    if (
                        response.status === 401
                        ||
                        response.status === 403
                    ) {

                        window.location.href =
                            "/login";


                        return;
                    }


                    if (
                        !response.ok
                    ) {

                        const errorText =
                            await response.text();


                        throw new Error(
                            errorText
                            || "댓글 수정에 실패했습니다."
                        );
                    }


                    await reloadComments();

                }
                catch (error) {

                    console.error(
                        "[COMMENT UPDATE ERROR]",
                        error
                    );


                    alert(
                        error.message
                        || "댓글 수정 중 오류가 발생했습니다."
                    );

                }
                finally {

                    saveButton.disabled =
                        false;
                }
            }
        );


        // ========================================================
        // 댓글 수정 취소
        // ========================================================

        cancelButton.addEventListener(
            "click",
            function() {

                reloadComments();
            }
        );


        // ========================================================
        // Enter 키 댓글 수정 저장
        // ========================================================

        editInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                    &&
                    !event.isComposing
                ) {

                    event.preventDefault();


                    saveButton.click();
                }
            }
        );
    }

    // ============================================================
    // 이미지 슬라이더
    // ============================================================

    function createImageSlider(
        feed,
        card
    ) {

        const images =
            Array.isArray(
                feed.images
            )
                ? feed.images
                : [];


        if (
            images.length === 0
        ) {

            return;
        }


        let currentImageIndex =
            0;


        const imageArea =
            document.createElement(
                "div"
            );


        imageArea.className =
            "feed-image-area";


        const image =
            document.createElement(
                "img"
            );


        image.className =
            "feed-image";


        imageArea.appendChild(
            image
        );


        const imageCount =
            document.createElement(
                "div"
            );


        imageCount.className =
            "feed-image-count";


        imageArea.appendChild(
            imageCount
        );


        const previousButton =
            document.createElement(
                "button"
            );


        previousButton.type =
            "button";


        previousButton.className =
            "feed-slide-button feed-previous-button";


        previousButton.textContent =
            "‹";


        imageArea.appendChild(
            previousButton
        );


        const nextButton =
            document.createElement(
                "button"
            );


        nextButton.type =
            "button";


        nextButton.className =
            "feed-slide-button feed-next-button";


        nextButton.textContent =
            "›";


        imageArea.appendChild(
            nextButton
        );


        card.appendChild(
            imageArea
        );


        const indicatorContainer =
            document.createElement(
                "div"
            );


        indicatorContainer.className =
            "feed-indicator-container";


        card.appendChild(
            indicatorContainer
        );


        function renderCurrentImage()
        {

            const currentImage =
                images[
                    currentImageIndex
                    ];


            image.src =
                currentImage.imageUrl;


            image.alt =
                currentImage.originalName
                || "후기 이미지";


            imageCount.textContent =
                (currentImageIndex + 1)
                + " / "
                + images.length;


            indicatorContainer.innerHTML =
                "";


            images.forEach(
                function(
                    ignoredImage,
                    index
                ) {

                    const indicator =
                        document.createElement(
                            "div"
                        );


                    indicator.className =
                        "feed-indicator";


                    if (
                        index
                        === currentImageIndex
                    ) {

                        indicator.classList.add(
                            "active"
                        );
                    }


                    indicatorContainer.appendChild(
                        indicator
                    );
                }
            );


            if (
                images.length === 1
            ) {

                previousButton.style.display =
                    "none";


                nextButton.style.display =
                    "none";


                imageCount.style.display =
                    "none";


                indicatorContainer.style.display =
                    "none";
            }
            else {

                previousButton.style.display =
                    "block";


                nextButton.style.display =
                    "block";


                imageCount.style.display =
                    "block";


                indicatorContainer.style.display =
                    "flex";
            }
        }


        previousButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                currentImageIndex--;


                if (
                    currentImageIndex < 0
                ) {

                    currentImageIndex =
                        images.length - 1;
                }


                renderCurrentImage();
            }
        );


        nextButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                currentImageIndex++;


                if (
                    currentImageIndex
                    >= images.length
                ) {

                    currentImageIndex =
                        0;
                }


                renderCurrentImage();
            }
        );


        renderCurrentImage();
    }

    // ============================================================
    // 카드 내부 후기 수정
    // ============================================================

    function startInlineEdit(
        feed,
        card
    ) {

        if (
            !isMyFeed(
                feed
            )
        ) {

            alert(
                "본인이 작성한 후기만 수정할 수 있습니다."
            );


            return;
        }


        const body =
            card.querySelector(
                ".feed-body"
            );


        body.innerHTML =
            "";


        const titleInput =
            document.createElement(
                "input"
            );


        titleInput.type =
            "text";


        titleInput.className =
            "feed-edit-title";


        titleInput.maxLength =
            255;


        titleInput.value =
            feed.title
            || "";


        const contentInput =
            document.createElement(
                "textarea"
            );


        contentInput.className =
            "feed-edit-content";


        contentInput.value =
            feed.content
            || "";


        const buttonArea =
            document.createElement(
                "div"
            );


        buttonArea.className =
            "feed-edit-buttons";


        const saveButton =
            document.createElement(
                "button"
            );


        saveButton.type =
            "button";


        saveButton.textContent =
            "후기 수정 완료";


        const cancelButton =
            document.createElement(
                "button"
            );


        cancelButton.type =
            "button";


        cancelButton.textContent =
            "취소";


        buttonArea.appendChild(
            saveButton
        );


        buttonArea.appendChild(
            cancelButton
        );


        body.appendChild(
            titleInput
        );


        body.appendChild(
            contentInput
        );


        body.appendChild(
            buttonArea
        );


        saveButton.addEventListener(
            "click",
            async function() {

                const title =
                    titleInput
                        .value
                        .trim();


                const content =
                    contentInput
                        .value
                        .trim();


                if (!title) {

                    alert(
                        "제목을 입력해주세요."
                    );


                    return;
                }


                if (!content) {

                    alert(
                        "후기 내용을 입력해주세요."
                    );


                    return;
                }


                saveButton.disabled =
                    true;


                try {

                    const response =
                        await fetch(
                            "/api/feeds/"
                            + encodeURIComponent(
                                feed.feedId
                            ),
                            {

                                method:
                                    "PUT",

                                headers: {

                                    "Authorization":
                                        "Bearer "
                                        + accessToken,

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify(
                                        {

                                            title:
                                            title,

                                            content:
                                            content

                                        }
                                    )
                            }
                        );


                    if (
                        response.status === 401
                        ||
                        response.status === 403
                    ) {

                        window.location.href =
                            "/login";


                        return;
                    }


                    if (
                        !response.ok
                    ) {

                        const errorText =
                            await response.text();


                        throw new Error(
                            errorText
                            || "후기 수정에 실패했습니다."
                        );
                    }


                    await loadFeeds();

                }
                catch (error) {

                    console.error(
                        "[FEED UPDATE ERROR]",
                        error
                    );


                    alert(
                        error.message
                        || "후기 수정 중 오류가 발생했습니다."
                    );
                }
                finally {

                    saveButton.disabled =
                        false;
                }
            }
        );


        cancelButton.addEventListener(
            "click",
            function() {

                loadFeeds();
            }
        );
    }


    // ============================================================
    // 후기 삭제
    // ============================================================

    async function deleteFeed(
        feedId
    ) {

        const confirmed =
            window.confirm(
                "정말 이 후기를 삭제하시겠습니까?"
            );


        if (!confirmed) {

            return;
        }


        try {

            const response =
                await fetch(
                    "/api/feeds/"
                    + encodeURIComponent(
                        feedId
                    ),
                    {

                        method:
                            "DELETE",

                        headers: {

                            "Authorization":
                                "Bearer "
                                + accessToken

                        }

                    }
                );


            if (
                response.status === 401
                ||
                response.status === 403
            ) {

                window.location.href =
                    "/login";


                return;
            }


            if (
                !response.ok
            ) {

                const errorText =
                    await response.text();


                throw new Error(
                    errorText
                    || "후기 삭제에 실패했습니다."
                );
            }


            await loadFeeds();

        }
        catch (error) {

            console.error(

            alert(

                || "후기 삭제 중 오류가 발생했습니다."
            );
        }
    }


    // ============================================================
    // 후기 조회
    // ============================================================

    async function loadFeeds()
    {

        if (
            !accessToken
        ) {

            window.location.href =
                "/login";


            return;
        }


        try {

            const response =
                await fetch(
                    "/api/feeds",
                    {

                        method:
                            "GET",

                        headers: {

                            "Authorization":
                                "Bearer "
                                + accessToken

                        }

                    }
                );


            if (
                response.status === 401
                ||
                response.status === 403
            ) {

                window.location.href =
                    "/login";


                return;
            }


            if (
                !response.ok
            ) {

                throw new Error(
                    "후기 목록을 불러오지 못했습니다."
                );
            }


            const feeds =
                await response.json();


            console.log(
                "[FEEDS RESPONSE]",
                feeds
            );


            feedContainer.innerHTML =
                "";


            if (
                !Array.isArray(
                    feeds
                )
                ||
                feeds.length === 0
            ) {

                feedMessage.textContent =
                    "아직 작성된 후기가 없습니다.";


                return;
            }


            feedMessage.textContent =
                "";


            for (
                const feed
                of feeds
                ) {

                const feedCard =
                    createFeedCard(
                        feed
                    );


                feedContainer.appendChild(
                    feedCard
                );
            }

        }
        catch (error) {

            console.error(
                "[FEED LIST ERROR]",
                error
            );


            feedMessage.textContent =
                error.message
                || "후기 목록 조회 중 오류가 발생했습니다.";
        }
    }

            closeAllMenus();

    );


    // ============================================================
    // 실행
    // ============================================================

    loadFeeds();
