<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>MeetBack 장소 투표</title>

    <script
            src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js">
    </script>

    <script src="/js/meeting-common.js"></script>
    <script src="/js/auth-session-guard.js" defer></script>

    <link
            rel="stylesheet"
            href="/css/meeting-vote.css">

</head>


<body>



<!-- =========================================================
     최종 장소 확정 확인 모달
     ========================================================= -->

<div
        id="finalConfirmOverlay"
        class="confirm-overlay">

    <div class="confirm-modal">

        <h3 class="confirm-title">
            최종 장소 확정
        </h3>


        <p
                id="finalConfirmMessage"
                class="confirm-message">

            이 장소를 최종 장소로 확정할까요?

        </p>


        <div class="confirm-buttons">

            <button
                    type="button"
                    onclick="closeFinalConfirmModal()">

                취소

            </button>


            <button
                    type="button"
                    id="finalConfirmActionButton"
                    class="primary"
                    onclick="confirmFinalCandidateAction()">

                확정

            </button>

        </div>

    </div>

</div>



<!-- =========================================================
     Toast
     ========================================================= -->

<div class="toast-container">

    <div
            id="toastMessage"
            class="toast">
    </div>

</div>



<h1>
    장소 투표
</h1>


<p>
    귀가 가능 여부와 이동시간을 확인하고
    원하는 장소에 투표해주세요.
</p>


<button
        type="button"
        onclick="goRoom()">

    모임방으로

</button>


<hr>

<div
        id="voteProgressArea"
        class="vote-progress-area">

    <strong>
        투표 현황을 불러오는 중...
    </strong>
</div>

<!-- =========================================================
     후보 목록
     ========================================================= -->

<div id="rankingArea">

    <strong>
    후보 정보를 불러오는 중...
    </strong>

</div>


<!-- =========================================================
     기권
     ========================================================= -->

<div class="abstain-area">

    <div>

        <strong>
            원하는 장소가 없나요?
        </strong>

        <p>
            기권해도 투표 완료 인원에는 포함됩니다.
        </p>

    </div>


    <button
            type="button"
            class="abstain-button"
            onclick="abstainVote()">

        기권하기

    </button>

</div>


<!-- =========================================================
     방장 영역
     ========================================================= -->

<div
        id="hostArea"
        class="host-area"
        style="display:none;">

    <h2>
        방장 최종 확정
    </h2>


    <p id="voteStatus">
        투표 상태 확인 중...
    </p>


    <button
            type="button"
            id="confirmButton"
            class="primary"
            disabled
            onclick="confirmFinalCandidate()">

        최종 장소 확정

    </button>

</div>



<script>

    // ============================================================
    // 상태
    // ============================================================

    let meetingId = null;

    let currentUser = null;

    let meeting = null;

    let participant = null;

    let stompClient = null;
    /*
     * 추천 후보
     */
    let rankings = [];


    /*
     * 후보별 득표 결과
     *
     * [
     *   {
     *      candidateId,
     *      placeName,
     *      voteCount
     *   }
     * ]
     */
    let voteResults = [];


    /*
     * 후보별 투표자
     *
     * [
     *   {
     *      candidateId,
     *      participantId,
     *      userId,
     *      nickname
     *   }
     * ]
     */
    let voteVoters = [];

    let voteProgress = null;


    let selectedCandidateId = null;

    let toastTimer = null;



    // ============================================================
    // Toast
    // ============================================================

    function showToast(
        message,
        type = "info"
    )
    {

        const toast =
            document.getElementById(
                "toastMessage"
            );


        if (!toast)
        {
            return;
        }


        if (toastTimer)
        {

            clearTimeout(
                toastTimer
            );
        }


        toast.textContent =
            message;


        toast.className =
            "toast show";


        if (type === "error")
        {

            toast.classList.add(
                "toast-error"
            );
        }

        else if (type === "success")
        {

            toast.classList.add(
                "toast-success"
            );
        }

        else
        {

            toast.classList.add(
                "toast-info"
            );
        }


        toastTimer =
            setTimeout(
                () =>
                {

                    toast.classList.remove(
                        "show"
                    );

                },
                4000
            );
    }



    // ============================================================
    // 초기화
    // ============================================================

    async function initialize()
    {

        currentUser =
            await MeetBack.checkLogin();


        if (!currentUser)
        {
            return;
        }


        meetingId =
            MeetBack.getMeetingId();


        if (!meetingId)
        {

            location.href =
                "/home";

            return;
        }


        /*
         * 모임 조회
         */
        await loadMeeting();


        if (
            !meeting
            ||
            meeting.status !== "VOTING"
        )
        {

            sessionStorage.setItem(
                "meetbackToastMessage",
                "현재 투표 가능한 상태가 아닙니다."
            );


            sessionStorage.setItem(
                "meetbackToastType",
                "info"
            );


            goRoom();

            return;
        }


        /*
         * 현재 참가자
         */
        await loadParticipant();


        /*
         * 추천 후보
         */
        await loadRanking();


        /*
         * 후보별 득표수
         */
        await loadVoteResults();


        /*
         * 후보별 투표자
         */
        await loadVoteVoters();

        await loadVoteProgress();


        /*
         * 모든 데이터를 받은 다음
         * 카드 최종 렌더링
         */
        renderRanking();

        /*
         * 이후 다른 사용자의 투표를
         * 실시간으로 받기 시작
         */
        await connectVoteWebSocket();
    }



    // ============================================================
    // 모임 조회
    // ============================================================

    async function loadMeeting()
    {

        const response =
            await MeetBack.authenticatedFetch(
                "/meetings/"
                + meetingId
            );


        if (!response.ok)
        {

            showToast(
                "모임 조회에 실패했습니다.",
                "error"
            );

            return;
        }


        meeting =
            await response.json();
    }



    // ============================================================
    // 현재 참가자
    // ============================================================

    async function loadParticipant()
    {

        const response =
            await MeetBack.authenticatedFetch(
                "/participants/meetings/"
                + meetingId
                + "/participants/me"
            );


        if (!response.ok)
        {

            showToast(
                "참가자 조회에 실패했습니다.",
                "error"
            );

            return;
        }


        participant =
            await response.json();
    }



    // ============================================================
    // 추천 순위 조회
    // ============================================================

    async function loadRanking()
    {

        const response =
            await MeetBack.authenticatedFetch(
                "/calculations/meeting/ranking?meetingId="
                + meetingId
            );


        if (!response.ok)
        {

            showToast(
                "추천 결과를 불러오지 못했습니다.",
                "error"
            );

            return;
        }


        rankings =
            await response.json();


        /*
         * 여기서는 renderRanking() 하지 않는다.
         *
         * 득표수와 투표자 목록까지 받은 다음
         * initialize()에서 한 번에 렌더링한다.
         */
    }



    // ============================================================
    // 추천 결과 렌더링
    // ============================================================

    function renderRanking()
    {

        const area =
            document.getElementById(
                "rankingArea"
            );


        area.innerHTML =
            "";


        if (
            !rankings
            ||
            rankings.length === 0
        )
        {

            area.textContent =
                "투표 가능한 장소가 없습니다.";

            return;
        }



        // --------------------------------------------------------
        // 추천 순위 정렬
        // --------------------------------------------------------

        const sortedRankings =
            [...rankings]
                .sort(
                    (a, b) =>
                        (
                            a.recommendationRank
                            ?? Number.MAX_SAFE_INTEGER
                        )
                        -
                        (
                            b.recommendationRank
                            ?? Number.MAX_SAFE_INTEGER
                        )
                );



        // --------------------------------------------------------
        // 공정성 BEST 계산
        // --------------------------------------------------------

        const fairnessCandidates =
            sortedRankings.filter(
                item =>
                    item.fairnessGapMinutes
                    != null
            );


        let fairnessBestCandidateId =
            null;


        if (
            fairnessCandidates.length
            > 0
        )
        {

            fairnessBestCandidateId =
                [...fairnessCandidates]
                    .sort(
                        (a, b) =>
                        {

                            const gap =
                                a.fairnessGapMinutes
                                - b.fairnessGapMinutes;


                            if (gap !== 0)
                            {
                                return gap;
                            }


                            const rankA =
                                a.recommendationRank
                                ?? Number.MAX_SAFE_INTEGER;


                            const rankB =
                                b.recommendationRank
                                ?? Number.MAX_SAFE_INTEGER;


                            if (rankA !== rankB)
                            {
                                return rankA - rankB;
                            }


                            return (
                                (a.candidateId ?? 0)
                                -
                                (b.candidateId ?? 0)
                            );
                        }
                    )[0]
                    .candidateId;
        }



        // --------------------------------------------------------
        // 후보 카드 생성
        // --------------------------------------------------------

        sortedRankings.forEach(
            item =>
            {

                const card =
                    document.createElement(
                        "div"
                    );


                const isTop =
                    item.recommendationRank
                    === 1;


                const isFairnessBest =
                    Number(item.candidateId)
                    === Number(
                        fairnessBestCandidateId
                    );


                card.className =
                    isTop
                        ? "candidate top"
                        : "candidate";



                // ------------------------------------------------
                // 배지
                // ------------------------------------------------

                let badges =
                    "";


                if (isTop)
                {

                    badges +=
                        `
                        <span class="badge badge-top">
                            추천 1위
                        </span>
                        `;
                }


                if (isFairnessBest)
                {

                    badges +=
                        `
                        <span class="badge badge-fair">
                            공정성 BEST
                        </span>
                        `;
                }


                if (
                    item.allReturnable
                    === true
                )
                {

                    badges +=
                        `
                        <span class="badge badge-return">
                            전원 귀가 가능
                        </span>
                        `;
                }



                // ------------------------------------------------
                // 참가자별 귀가 결과
                // ------------------------------------------------

                const participantResults =
                    item.participantResults
                    || [];


                let rows =
                    "";


                participantResults.forEach(
                    participantResult =>
                    {

                        const canReturn =
                            participantResult.canReturn
                            === true;

                        const participantName =
                            participantResult.nickname
                            || (
                                "참가자 "
                                + participantResult.participantId
                            );


                        rows +=
                            `
                        <div class="participant-result">

                            <strong>
                                ${MeetBack.escapeHtml(
                                participantName
                            )}
                            </strong>

                            &nbsp;

                            <span
                                class="${
                                canReturn
                                    ? "return-possible"
                                    : "return-impossible"
                            }">

                                ${
                                canReturn
                                    ? "귀가 가능"
                                    : "귀가 불가"
                            }

                            </span>

                            <br>

                            귀가시간 :
                            ${displayValue(
                                participantResult.returnMinutes,
                                "분"
                            )}

                            <br>

                            환승 횟수 :
                            ${displayValue(
                                participantResult.transferCount,
                                "회"
                            )}

                            <br>

                            안전 출발 마감 :
                            ${displayDateTime(
                                participantResult.lastSafeDepartureAt
                            )}

                            <br>

                            막차 출발 :
                            ${displayDateTime(
                                participantResult.lastTrainDepartureAt
                            )}

                            <br>

                            막차 도착 :
                            ${displayDateTime(
                                participantResult.lastTrainArrivalAt
                            )}

                        </div>
                        `;


                    }
                );



                // ------------------------------------------------
                // ★ 해당 후보 득표수
                // ------------------------------------------------

                const voteResult =
                    voteResults.find(
                        result =>
                            Number(result.candidateId)
                            === Number(item.candidateId)
                    );


                const voteCount =
                    voteResult
                        ? Number(
                            voteResult.voteCount
                        )
                        : 0;



                // ------------------------------------------------
                // ★ 해당 후보 투표자
                // ------------------------------------------------

                const voters =
                    voteVoters.filter(
                        voter =>
                            Number(voter.candidateId)
                            === Number(item.candidateId)
                    );


                let voterRows =
                    "";


                voters.forEach(
                    voter =>
                    {

                        const voterName =
                            voter.nickname
                            || (
                                "참가자 "
                                + voter.participantId
                            );


                        const me =
                            Number(voter.userId)
                            === Number(
                                currentUser.userId
                            );


                        voterRows +=
                            `
                            <span
                                class="vote-voter-chip ${
                                me
                                    ? "me"
                                    : ""
                            }">

                                ${MeetBack.escapeHtml(
                                voterName
                            )}

                                ${
                                me
                                    ? "(나)"
                                    : ""
                            }

                            </span>
                            `;
                    }
                );



                // ------------------------------------------------
                // ★ 내가 이 후보에 투표했는지
                // ------------------------------------------------

                const myVote =
                    voters.some(
                        voter =>
                            Number(voter.userId)
                            === Number(
                                currentUser.userId
                            )
                    );



                // ------------------------------------------------
                // 카드 출력
                // ------------------------------------------------

                card.innerHTML =
                    `

                    <div class="candidate-title">

                        <h2>

                            ${MeetBack.escapeHtml(
                        item.recommendationRank
                        ?? "-"
                    )}위

                            ${MeetBack.escapeHtml(
                        item.placeName
                        ?? "장소명 없음"
                    )}

                        </h2>


                        ${badges}

                    </div>



                    <div class="candidate-address">

                        ${MeetBack.escapeHtml(
                        item.address
                        || ""
                    )}

                    </div>



                    <div class="info-grid">


                        <div class="info">

                            <span class="info-label">
                                Deadline
                            </span>

                            <strong>
                                ${displayDateTime(
                        item.deadlineAt
                    )}
                            </strong>

                        </div>



                        <div class="info">

                            <span class="info-label">
                                Golden Margin
                            </span>

                            <strong>
                                ${formatMinutes(
                        item.goldenMarginMinutes
                    )}
                            </strong>

                        </div>



                        <div class="info">

                            <span class="info-label">
                                평균 귀가시간
                            </span>

                            <strong>

                                ${
                        item.averageReturnMinutes
                        == null
                            ? "-"
                            : (
                                Math.round(
                                    item.averageReturnMinutes
                                )
                                + "분"
                            )
                    }

                            </strong>

                        </div>



                        <div class="info">

                            <span class="info-label">
                                귀가시간 편차
                            </span>

                            <strong>
                                ${displayValue(
                        item.fairnessGapMinutes,
                        "분"
                    )}
                            </strong>

                        </div>



                        <div class="info">

                            <span class="info-label">
                                Fairness Score
                            </span>

                            <strong>
                                ${displayValue(
                        item.fairnessScore,
                        "점"
                    )}
                            </strong>

                        </div>



                        <div class="info">

                            <span class="info-label">
                                Rule Score
                            </span>

                            <strong>

                                ${
                        item.ruleScore
                        == null
                            ? "-"
                            : Number(
                                item.ruleScore
                            ).toFixed(1)
                    }

                            </strong>

                        </div>

                    </div>



                    <div class="candidate-buttons">

                        <button
                                type="button"
                                class="primary ${
                        myVote
                            ? "my-vote-button"
                            : ""
                    }"
                                onclick="vote(${item.candidateId})">

                            ${
                        myVote
                            ? "내가 투표한 장소"
                            : "이 장소에 투표"
                    }

                        </button>


                        <button
                                type="button"
                                id="participantButton-${item.candidateId}"
                                onclick="toggleParticipantResults(${item.candidateId})">

                            참가자별 귀가 결과

                        </button>

                    </div>



                    <!-- ============================================
                         ★ 후보별 투표 현황
                         ============================================ -->

                    <div class="vote-result-box">

                        <div class="vote-result-title">

                            현재
                            ${voteCount}표

                        </div>


                        <div class="vote-voter-title">

                            투표자
                            (${voters.length}명)

                        </div>


                        <div class="vote-voter-list">

                            ${
                        voters.length === 0

                            ? `
                                      <span class="vote-empty">
                                          아직 투표한 참가자가 없습니다.
                                      </span>
                                      `

                            : voterRows
                    }

                        </div>

                    </div>



                    <div
                            id="participantResults-${item.candidateId}"
                            class="participant-results">

                        <div class="participant-result-title">

                            참가자별 귀가 결과
                            (${participantResults.length}명)

                        </div>


                        ${
                        participantResults.length === 0
                            ? "참가자별 귀가 결과가 없습니다."
                            : rows
                    }

                    </div>
                    `;


                area.appendChild(
                    card
                );
            }
        );
    }



    // ============================================================
    // 참가자별 귀가 결과 열기 / 닫기
    // ============================================================

    function toggleParticipantResults(
        candidateId
    )
    {

        const result =
            document.getElementById(
                "participantResults-"
                + candidateId
            );


        const button =
            document.getElementById(
                "participantButton-"
                + candidateId
            );


        if (
            !result
            ||
            !button
        )
        {
            return;
        }


        const opened =
            result.classList.contains(
                "show"
            );


        result.classList.toggle(
            "show"
        );


        button.textContent =
            opened
                ? "참가자별 귀가 결과"
                : "참가자별 귀가 결과 닫기";
    }



    // ============================================================
    // 표시 Util
    // ============================================================

    function displayValue(
        value,
        suffix = ""
    )
    {

        if (
            value === null
            ||
            value === undefined
        )
        {
            return "-";
        }


        return (
            MeetBack.escapeHtml(
                value
            )
            + suffix
        );
    }



    function displayDateTime(
        value
    )
    {

        if (!value)
        {
            return "-";
        }


        return MeetBack.escapeHtml(
            MeetBack.formatDateTime(
                value
            )
        );
    }

    // ============================================================
    // 분 → 시간 / 분 표시
    // ============================================================

    function formatMinutes(value)
    {

        if (
            value === null
            ||
            value === undefined
        )
        {
            return "-";
        }


        const totalMinutes =
            Number(value);


        const hours =
            Math.floor(
                totalMinutes / 60
            );


        const minutes =
            totalMinutes % 60;


        if (hours === 0)
        {
            return minutes + "분";
        }


        if (minutes === 0)
        {
            return hours + "시간";
        }


        return (
            hours
            + "시간 "
            + minutes
            + "분"
        );
    }

    // ============================================================
    // 투표
    // ============================================================

    async function vote(
        candidateId
    )
    {

        if (!participant)
        {

            showToast(
                "참가자 정보를 확인할 수 없습니다.",
                "error"
            );

            return;
        }


        /*
         * participantId를 프론트에서 보내지 않는다.
         *
         * JWT userId
         * +
         * meetingId
         *
         * 로 Spring 백엔드 애플리케이션이
         * participantId를 조회한다.
         */
        const response =
            await MeetBack.authenticatedFetch(
                "/meetings/"
                + meetingId
                + "/votes",
                {

                    method:
                        "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            {

                                /*
                                 * 일반 후보 투표
                                 */
                                voteType:
                                    "CANDIDATE",

                                candidateId:
                                candidateId

                            }
                        )
                }
            );


        if (!response.ok)
        {

            const text =
                await response.text();


            showToast(
                text
                || "투표에 실패했습니다.",
                "error"
            );


            return;
        }


        selectedCandidateId =
            candidateId;


        showToast(
            "투표가 완료되었습니다.",
            "success"
        );


        /*
         * WebSocket VOTE_UPDATED가 오기 전에도
         * 내 화면을 즉시 갱신한다.
         */
        await refreshVoteState();
    }



    // ============================================================
    // 기권
    // ============================================================

    async function abstainVote()
    {

        if (!participant)
        {

            showToast(
                "참가자 정보를 확인할 수 없습니다.",
                "error"
            );

            return;
        }


        const confirmed =
            confirm(
                "이번 장소 투표에서 기권하시겠습니까?\n"
                + "기권 후에도 다시 후보 장소에 투표할 수 있습니다."
            );


        if (!confirmed)
        {
            return;
        }


        const response =
            await MeetBack.authenticatedFetch(
                "/meetings/"
                + meetingId
                + "/votes",
                {

                    method:
                        "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            {

                                /*
                                 * 기권
                                 *
                                 * 후보를 선택하지 않으므로
                                 * candidateId는 null
                                 */
                                voteType:
                                    "ABSTAIN",

                                candidateId:
                                    null

                            }
                        )
                }
            );


        if (!response.ok)
        {

            const text =
                await response.text();


            showToast(
                text
                || "기권 처리에 실패했습니다.",
                "error"
            );


            return;
        }


        /*
         * 특정 후보 선택 상태 제거
         */
        selectedCandidateId =
            null;


        showToast(
            "기권표가 반영되었습니다.",
            "success"
        );


        await refreshVoteState();
    }



    // ============================================================
    // 후보별 득표수 조회
    //
    // 중요:
    // 이 함수에서는 단순히 데이터만 조회한다.
    //
    // 방장의 최종확정 가능 여부는
    // updateHostConfirmState()에서만 판단한다.
    // ============================================================

    async function loadVoteResults()
    {

        const response =
            await MeetBack.authenticatedFetch(
                "/meetings/"
                + meetingId
                + "/votes/results"
            );


        if (!response.ok)
        {

            voteResults =
                [];


            console.error(
                "[VOTE RESULTS] 조회 실패"
            );


            return;
        }


        voteResults =
            await response.json();


        console.log(
            "[VOTE RESULTS]",
            voteResults
        );
    }



    // ============================================================
    // 후보별 투표자
    // ============================================================

    async function loadVoteVoters()
    {

        const response =
            await MeetBack.authenticatedFetch(
                "/meetings/"
                + meetingId
                + "/votes/voters"
            );


        if (!response.ok)
        {

            console.error(
                "[VOTE VOTERS] 조회 실패"
            );


            voteVoters =
                [];


            return;
        }


        voteVoters =
            await response.json();


        console.log(
            "[VOTE VOTERS]",
            voteVoters
        );
    }



    // ============================================================
    // 투표 화면 WebSocket
    // ============================================================

    async function connectVoteWebSocket()
    {

        const protocol =
            location.protocol === "https:"
                ? "wss"
                : "ws";


        stompClient =
            new StompJs.Client(
                {

                    brokerURL:
                        protocol
                        + "://"
                        + location.host
                        + "/ws",


                    connectHeaders:
                        {

                            "Authorization":
                                "Bearer "
                                + MeetBack.getAccessToken()

                        },


                    reconnectDelay:
                        5000,


                    onConnect:
                        function()
                        {

                            console.log(
                                "[VOTE WS CONNECTED]"
                            );


                            const destination =
                                "/topic/meetings/"
                                + meetingId
                                + "/chat";


                            console.log(
                                "[VOTE WS SUBSCRIBE]",
                                destination
                            );


                            stompClient.subscribe(
                                destination,

                                async message =>
                                {

                                    const data =
                                        JSON.parse(
                                            message.body
                                        );


                                    console.log(
                                        "[VOTE WS RECEIVE]",
                                        data
                                    );


                                    // =====================================
                                    // 누군가 후보 투표 / 재투표 / 기권
                                    // =====================================

                                    if (
                                        data.eventType
                                        === "VOTE_UPDATED"
                                    )
                                    {

                                        await refreshVoteState();

                                        return;
                                    }


                                    // =====================================
                                    // 방장이 최종 장소 확정
                                    //
                                    // 모든 참가자의 vote.html을
                                    // 모임방으로 되돌린다.
                                    // =====================================

                                    if (
                                        data.eventType
                                        === "MEETING_CONFIRMED"
                                    )
                                    {

                                        sessionStorage.setItem(
                                            "meetbackToastMessage",
                                            "최종 장소가 확정되었습니다."
                                        );


                                        sessionStorage.setItem(
                                            "meetbackToastType",
                                            "success"
                                        );


                                        goRoom();

                                        return;
                                    }

                                }
                            );
                        }
                }
            );


        stompClient.activate();
    }



    // ============================================================
    // 실시간 투표 현황 갱신
    // ============================================================

    async function refreshVoteState()
    {

        /*
         * 후보별 득표수
         */
        await loadVoteResults();


        /*
         * 후보별 투표자
         */
        await loadVoteVoters();


        /*
         * 전체 투표 진행 상황
         *
         * 후보 투표 + 기권 포함
         */
        await loadVoteProgress();


        /*
         * 후보 카드 다시 렌더링
         */
        renderRanking();


        /*
         * 방장 버튼 상태도
         * 최신 투표 결과로 다시 판단
         */
        updateHostConfirmState();
    }

    // ============================================================
    // 최종 장소 확정 모달 열기
    // ============================================================

    function confirmFinalCandidate()
    {

        if (!selectedCandidateId)
        {

            showToast(
                "확정할 후보가 없습니다.",
                "error"
            );

            return;
        }


        const selectedCandidate =
            rankings.find(
                item =>
                    Number(item.candidateId)
                    ===
                    Number(selectedCandidateId)
            );


        const message =
            document.getElementById(
                "finalConfirmMessage"
            );


        if (
            message
            &&
            selectedCandidate
        )
        {

            message.textContent =
                "'"
                + (
                    selectedCandidate.placeName
                    || "선택된 장소"
                )
                + "'을 최종 장소로 확정할까요?";
        }


        const overlay =
            document.getElementById(
                "finalConfirmOverlay"
            );


        if (overlay)
        {

            overlay.classList.add(
                "show"
            );
        }
    }



    // ============================================================
    // 최종 장소 확정 모달 닫기
    // ============================================================

    function closeFinalConfirmModal()
    {

        const overlay =
            document.getElementById(
                "finalConfirmOverlay"
            );


        if (!overlay)
        {
            return;
        }


        overlay.classList.remove(
            "show"
        );
    }



    // ============================================================
    // 최종 장소 확정
    // ============================================================

    async function confirmFinalCandidateAction()
    {

        if (!selectedCandidateId)
        {

            closeFinalConfirmModal();


            showToast(
                "확정할 후보가 없습니다.",
                "error"
            );


            return;
        }


        /*
         * 전원 투표 완료 여부를
         * 최종 요청 직전 한 번 더 검사한다.
         *
         * 화면 버튼만 믿으면 안 된다.
         *
         * meetingType이 QUICK_VOTE 일 경우
         * 과반수 넘을시 투표 가능하다
         */
        await loadVoteProgress();


        if (
            !voteProgress
            ||
            !voteProgress.canConfirm
        )
        {

            closeFinalConfirmModal();


            showToast(
                meeting
                &&
                meeting.meetingType === "QUICK_VOTE"
                    ? "과반수의 투표가 완료되어야 장소를 확정할 수 있습니다."
                    : "아직 모든 참가자의 투표가 완료되지 않았습니다.",
                "error"
            );


            return;
        }


        const actionButton =
            document.getElementById(
                "finalConfirmActionButton"
            );


        if (actionButton)
        {

            actionButton.disabled =
                true;


            actionButton.textContent =
                "확정 중...";
        }


        closeFinalConfirmModal();


        try
        {

            const response =
                await MeetBack.authenticatedFetch(
                    "/meetings/"
                    + meetingId
                    + "/final-candidate",
                    {

                        method:
                            "PUT",

                        headers:
                            {

                                "Content-Type":
                                    "application/json"

                            },

                        body:
                            JSON.stringify(
                                {

                                    candidateId:
                                    selectedCandidateId

                                }
                            )
                    }
                );


            if (!response.ok)
            {

                const text =
                    await response.text();


                showToast(
                    text
                    || "최종 장소 확정에 실패했습니다.",
                    "error"
                );


                return;
            }


            /*
             * 방장 본인은 HTTP 응답이 성공하면
             * 바로 모임방으로 복귀한다.
             *
             * 다른 참가자는 MEETING_CONFIRMED
             * WebSocket 이벤트를 받아 복귀한다.
             */
            sessionStorage.setItem(
                "meetbackToastMessage",
                "최종 장소가 확정되었습니다."
            );


            sessionStorage.setItem(
                "meetbackToastType",
                "success"
            );


            goRoom();

        }
        catch (error)
        {

            console.error(
                "[FINAL CANDIDATE ERROR]",
                error
            );


            showToast(
                "최종 장소 확정 중 오류가 발생했습니다.",
                "error"
            );

        }
        finally
        {

            if (actionButton)
            {

                actionButton.disabled =
                    false;


                actionButton.textContent =
                    "확정";
            }
        }
    }



    // ============================================================
    // 전체 투표 진행 상태 조회
    // ============================================================

    async function loadVoteProgress()
    {

        const response =
            await MeetBack.authenticatedFetch(
                "/meetings/"
                + meetingId
                + "/votes/progress"
            );


        if (!response.ok)
        {

            voteProgress =
                null;


            console.error(
                "[VOTE PROGRESS] 조회 실패"
            );


            renderVoteProgress();

            updateHostConfirmState();

            return;
        }


        voteProgress =
            await response.json();


        console.log(
            "[VOTE PROGRESS]",
            voteProgress
        );


        renderVoteProgress();


        updateHostConfirmState();
    }



    // ============================================================
    // 전체 투표 진행 상태 렌더링
    // ============================================================

    function renderVoteProgress()
    {

        const area =
            document.getElementById(
                "voteProgressArea"
            );


        if (!area)
        {
            return;
        }


        if (!voteProgress)
        {

            area.innerHTML =
                `
            <strong>
                투표 현황을 불러오지 못했습니다.
            </strong>
            `;

            return;
        }


        const isQuickVote =
            meeting
            &&
            meeting.meetingType === "QUICK_VOTE";


        // =========================================================
        // 전원 투표 완료
        // =========================================================

        if (voteProgress.allVoted)
        {

            area.innerHTML =
                `
            <div
                class="
                    vote-progress-title
                    vote-progress-complete
                ">

                ✅ 전원 투표 완료

            </div>

            <div class="vote-progress-detail">

                ${voteProgress.totalVotes}
                /
                ${voteProgress.totalParticipants}명
                투표 완료

                <br>

                후보 투표 :
                ${voteProgress.candidateVotes}표

                <br>

                기권 :
                ${voteProgress.abstainVotes}표

            </div>
            `;


            return;
        }


        // =========================================================
        // QUICK_VOTE 과반수 충족
        // =========================================================

        if (
            isQuickVote
            &&
            voteProgress.canConfirm
        )
        {

            area.innerHTML =
                `
            <div
                class="
                    vote-progress-title
                    vote-progress-complete
                ">

                ✅ 과반수 투표 완료

            </div>

            <div class="vote-progress-detail">

                ${voteProgress.totalVotes}
                /
                ${voteProgress.totalParticipants}명
                투표 완료

                <br>

                확정 기준 :
                ${voteProgress.requiredVotes}명 이상

                <br>

                후보 투표 :
                ${voteProgress.candidateVotes}표

                <br>

                기권 :
                ${voteProgress.abstainVotes}표

                <br>

                현재 투표 결과로 장소를 확정할 수 있습니다.

            </div>
            `;


            return;
        }


        // =========================================================
        // QUICK_VOTE 과반수 미달
        // =========================================================

        if (isQuickVote)
        {

            const remainingToConfirm =
                Math.max(
                    0,
                    voteProgress.requiredVotes
                    - voteProgress.totalVotes
                );


            area.innerHTML =
                `
            <div
                class="
                    vote-progress-title
                    vote-progress-waiting
                ">

                투표 진행 중

            </div>

            <div class="vote-progress-detail">

                ${voteProgress.totalVotes}
                /
                ${voteProgress.totalParticipants}명
                투표 완료

                <br>

                확정 기준 :
                ${voteProgress.requiredVotes}명 이상

                <br>

                후보 투표 :
                ${voteProgress.candidateVotes}표

                <br>

                기권 :
                ${voteProgress.abstainVotes}표

                <br>

                확정까지
                ${remainingToConfirm}명의 투표가 더 필요합니다.

            </div>
            `;


            return;
        }


        // =========================================================
        // FRIEND - 기존 전원 투표 방식
        // =========================================================

        const remaining =
            Math.max(
                0,
                voteProgress.totalParticipants
                - voteProgress.totalVotes
            );


        area.innerHTML =
            `
        <div
            class="
                vote-progress-title
                vote-progress-waiting
            ">

            투표 진행 중

        </div>

        <div class="vote-progress-detail">

            ${voteProgress.totalVotes}
            /
            ${voteProgress.totalParticipants}명
            투표 완료

            <br>

            후보 투표 :
            ${voteProgress.candidateVotes}표

            <br>

            기권 :
            ${voteProgress.abstainVotes}표

            <br>

            ${remaining}명의 투표를 기다리고 있습니다.

        </div>
        `;
    }



    // ============================================================
    // 방장 최종 확정 가능 여부
    // ============================================================

    function updateHostConfirmState()
    {

        const hostArea =
            document.getElementById(
                "hostArea"
            );


        const voteStatus =
            document.getElementById(
                "voteStatus"
            );


        const confirmButton =
            document.getElementById(
                "confirmButton"
            );


        if (
            !hostArea
            ||
            !voteStatus
            ||
            !confirmButton
            ||
            !meeting
            ||
            !currentUser
        )
        {
            return;
        }


        const isHost =
            Number(
                meeting.hostUserId
            )
            ===
            Number(
                currentUser.userId
            );


        /*
         * 일반 참가자에게는
         * 최종 확정 영역 자체를 보여주지 않는다.
         */
        if (!isHost)
        {

            hostArea.style.display =
                "none";


            return;
        }


        hostArea.style.display =
            "block";


        // =========================================================
        // 진행 상태 조회 전
        // =========================================================

        if (!voteProgress)
        {

            selectedCandidateId =
                null;


            confirmButton.disabled =
                true;


            voteStatus.textContent =
                "투표 상태를 확인하고 있습니다.";


            return;
        }


        // =========================================================
        // 최종 확정 조건 충족 전
        //
        // FRIEND
        // → 전원 투표 필요
        //
        // QUICK_VOTE
        // → 과반수 투표 필요
        // =========================================================

        if (!voteProgress.canConfirm)
        {

            selectedCandidateId =
                null;


            confirmButton.disabled =
                true;


            if (
                meeting.meetingType
                === "QUICK_VOTE"
            )
            {

                const remainingToConfirm =
                    Math.max(
                        0,
                        voteProgress.requiredVotes
                        - voteProgress.totalVotes
                    );


                voteStatus.textContent =
                    voteProgress.totalVotes
                    + " / "
                    + voteProgress.totalParticipants
                    + "명 투표 완료 - "
                    + "확정까지 "
                    + remainingToConfirm
                    + "명의 투표가 더 필요합니다.";

            }
            else
            {

                voteStatus.textContent =
                    voteProgress.totalVotes
                    + " / "
                    + voteProgress.totalParticipants
                    + "명 투표 완료 - "
                    + "모든 참가자의 투표를 기다리고 있습니다.";
            }


            return;
        }


        // =========================================================
        // 후보에 들어간 표가 하나도 없는 경우
        // =========================================================

        if (
            Number(
                voteProgress.candidateVotes
            )
            === 0
        )
        {

            selectedCandidateId =
                null;


            confirmButton.disabled =
                true;


            voteStatus.textContent =
                "득표한 후보가 없어 장소를 확정할 수 없습니다.";


            return;
        }


        // =========================================================
        // 실제 득표가 있는 후보만 조회
        // =========================================================

        const votedCandidates =
            voteResults.filter(
                result =>
                    Number(
                        result.voteCount
                    )
                    > 0
            );


        if (
            votedCandidates.length
            === 0
        )
        {

            selectedCandidateId =
                null;


            confirmButton.disabled =
                true;


            voteStatus.textContent =
                "득표한 후보가 없습니다.";


            return;
        }


        // =========================================================
        // 최다 득표수
        // =========================================================

        const maxVoteCount =
            Math.max(
                ...votedCandidates.map(
                    result =>
                        Number(
                            result.voteCount
                        )
                )
            );


        // =========================================================
        // 최다 득표 후보들
        // =========================================================

        const topCandidates =
            votedCandidates.filter(
                result =>
                    Number(
                        result.voteCount
                    )
                    === maxVoteCount
            );


        // =========================================================
        // 동점
        // =========================================================

        if (
            topCandidates.length
            > 1
        )
        {

            selectedCandidateId =
                null;


            confirmButton.disabled =
                true;


            voteStatus.textContent =
                "최다 득표 후보가 동점입니다. "
                + "추가 투표를 기다려주세요.";


            return;
        }


        // =========================================================
        // 단독 최다 득표
        // =========================================================

        selectedCandidateId =
            topCandidates[0]
                .candidateId;


        confirmButton.disabled =
            false;


        voteStatus.textContent =
            meeting.meetingType === "QUICK_VOTE"
                ? "과반수의 투표가 완료되었습니다. 최다 득표 장소를 확정할 수 있습니다."
                : "전원 투표가 완료되었습니다. 최다 득표 장소를 확정할 수 있습니다.";
    }
    // ============================================================
    // 모임방 이동
    // ============================================================

    function goRoom()
    {

        location.href =
            "/meeting?meetingId="
            + meetingId;
    }






    // ============================================================
    // 실행
    // ============================================================

    initialize();

</script>
