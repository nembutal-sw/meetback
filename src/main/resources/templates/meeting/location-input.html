<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>MeetBack 장소 입력</title>

    <link rel="stylesheet" href="/css/location.css">

    <script src="/js/meeting-common.js"></script>

</head>

<body>


<div class="toast-container">

    <div
            id="toastMessage"
            class="toast">
    </div>

</div>



<h1>내 장소 입력</h1>

<p>
    출발 장소와 귀가 장소를 입력해주세요.
    희망 장소는 선택사항입니다.
</p>


<div class="card">


    <div class="field">

        <label for="departureQuery">
            출발 장소
        </label>

        <div class="search-row">

            <input
                    id="departureQuery"
                    placeholder="예: 수원역"
                    oninput="handlePlaceInputChange('departure')">

            <button
                    type="button"
                    onclick="searchPlace('departure')">
                검색
            </button>

        </div>

        <div
                id="departureResults"
                class="results">
        </div>

        <div
                id="departureSelected"
                class="selected">

            선택된 장소 없음

        </div>

    </div>



    <div class="field">

        <label for="returnQuery">
            귀가 장소
        </label>

        <div class="search-row">

            <input
                    id="returnQuery"
                    placeholder="예: 역삼역"
                    oninput="handlePlaceInputChange('return')">

            <button
                    type="button"
                    onclick="searchPlace('return')">
                검색
            </button>

        </div>

        <div
                id="returnResults"
                class="results">
        </div>

        <div
                id="returnSelected"
                class="selected">

            선택된 장소 없음

        </div>

    </div>



    <div class="field">

        <label for="candidateQuery">

            희망 장소

            <span class="optional-text">
                (선택)
            </span>

        </label>

        <div class="search-row">

            <input
                    id="candidateQuery"
                    placeholder="예: 건대입구역"
                    oninput="handlePlaceInputChange('candidate')">

            <button
                    type="button"
                    onclick="searchPlace('candidate')">
                검색
            </button>

            <button
                    type="button"
                    onclick="resetCandidate()">
                초기화
            </button>

        </div>

        <div
                id="candidateResults"
                class="results">
        </div>

        <div
                id="candidateSelected"
                class="selected">

            선택된 장소 없음

        </div>

    </div>


    <button
            type="button"
            class="primary"
            onclick="saveLocation()">

        장소 입력 완료

    </button>


    <br><br>


    <button
            type="button"
            id="backToRoomButton"
            onclick="goRoom()">

        모임방으로 돌아가기

    </button>

</div>



<script>

    let meetingId = null;

    let participant = null;

    let pageMode = "create";

    let selectedDeparture = null;

    let selectedReturn = null;

    let selectedCandidate = null;

    let candidateTouched = false;

    let toastTimer = null;



    function showToast(
        message,
        type = "info"
    )
    {

        const toast =
            document.getElementById(
                "toastMessage"
            );


        if (toastTimer)
        {
            clearTimeout(
                toastTimer
            );
        }


        toast.textContent =
            message;


        toast.className =
            "toast show";


        if (type === "error")
        {
            toast.classList.add(
                "toast-error"
            );
        }

        else if (type === "success")
        {
            toast.classList.add(
                "toast-success"
            );
        }

        else
        {
            toast.classList.add(
                "toast-info"
            );
        }


        toastTimer =
            setTimeout(
                () =>
                {

                    toast.classList.remove(
                        "show"
                    );

                },
                4000
            );

    }



    async function initialize()
    {

        const user =
            await MeetBack.checkLogin();


        if (!user)
        {
            return;
        }


        meetingId =
            MeetBack.getMeetingId();


        if (!meetingId)
        {

            location.href =
                "/home";

            return;
        }


        const params =
            new URLSearchParams(
                location.search
            );


        pageMode =
            params.get("mode")
            || "create";


        if (pageMode === "edit")
        {

            document.getElementById(
                "backToRoomButton"
            ).textContent =
                "수정 취소하고 모임방으로";

        }


        const response =
            await MeetBack.authenticatedFetch(
                "/participants/meetings/"
                + meetingId
                + "/participants/me"
            );


        if (!response.ok)
        {

            showToast(
                "참가자 정보를 찾을 수 없습니다.",
                "error"
            );


            return;
        }


        participant =
            await response.json();


        await loadSavedLocation();

    }



    async function loadSavedLocation()
    {

        const response =
            await MeetBack.authenticatedFetch(
                "/participants/"
                + participant.participantId
            );


        if (!response.ok)
        {
            return;
        }


        const data =
            await response.json();


        if (data.departureName)
        {

            document.getElementById(
                "departureQuery"
            ).value =
                data.departureName;


            document.getElementById(
                "departureSelected"
            ).textContent =
                data.departureName
                + (
                    data.departureAddress
                        ? " / " + data.departureAddress
                        : ""
                );


            selectedDeparture = {

                name:
                data.departureName,

                address:
                data.departureAddress

            };

        }


        if (data.returnName)
        {

            document.getElementById(
                "returnQuery"
            ).value =
                data.returnName;


            document.getElementById(
                "returnSelected"
            ).textContent =
                data.returnName
                + (
                    data.returnAddress
                        ? " / " + data.returnAddress
                        : ""
                );


            selectedReturn = {

                name:
                data.returnName,

                address:
                data.returnAddress

            };

        }

    }



    function handlePlaceInputChange(type)
    {

        if (type === "departure")
        {

            selectedDeparture =
                null;


            document.getElementById(
                "departureSelected"
            ).textContent =
                "선택된 장소 없음";

        }

        else if (type === "return")
        {

            selectedReturn =
                null;


            document.getElementById(
                "returnSelected"
            ).textContent =
                "선택된 장소 없음";

        }

        else
        {

            selectedCandidate =
                null;


            candidateTouched =
                true;


            document.getElementById(
                "candidateSelected"
            ).textContent =
                "선택된 장소 없음";

        }

    }



    async function searchPlace(type)
    {

        const input =
            document.getElementById(
                type + "Query"
            );


        const resultArea =
            document.getElementById(
                type + "Results"
            );


        const query =
            input.value.trim();


        if (!query)
        {

            showToast(
                "검색어를 입력해주세요.",
                "info"
            );


            return;
        }


        resultArea.style.display =
            "block";


        resultArea.textContent =
            "검색 중...";


        const response =
            await MeetBack.authenticatedFetch(
                "/places?query="
                + encodeURIComponent(query)
            );


        if (!response.ok)
        {

            resultArea.style.display =
                "none";


            const text =
                await response.text();


            showToast(
                text
                || "장소 검색에 실패했습니다.",
                "error"
            );


            return;
        }


        const places =
            await response.json();


        resultArea.innerHTML =
            "";


        resultArea.style.display =
            "block";


        if (
            !places
            ||
            places.length === 0
        )
        {

            resultArea.textContent =
                "검색 결과가 없습니다.";


            return;
        }


        places.forEach(
            place =>
            {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "result";


                const name =
                    place.name
                    || place.placeName
                    || "장소명 없음";


                const address =
                    place.roadAddress
                    || place.address
                    || "";


                div.innerHTML =
                    `
                    <strong>
                        ${MeetBack.escapeHtml(name)}
                    </strong>

                    <br>

                    ${MeetBack.escapeHtml(address)}
                    `;


                div.onclick =
                    () =>
                        selectPlace(
                            type,
                            place
                        );


                resultArea.appendChild(
                    div
                );

            }
        );

    }



    function selectPlace(
        type,
        place
    )
    {

        const name =
            place.name
            || place.placeName;


        const address =
            place.roadAddress
            || place.address
            || "";


        if (type === "departure")
        {

            selectedDeparture =
                place;

        }

        else if (type === "return")
        {

            selectedReturn =
                place;

        }

        else
        {

            selectedCandidate =
                place;


            candidateTouched =
                true;

        }


        document.getElementById(
            type + "Query"
        ).value =
            name;


        document.getElementById(
            type + "Selected"
        ).textContent =
            name
            + (
                address
                    ? " / " + address
                    : ""
            );


        document.getElementById(
            type + "Results"
        ).style.display =
            "none";

    }



    function resetCandidate()
    {

        selectedCandidate =
            null;


        candidateTouched =
            true;


        document.getElementById(
            "candidateQuery"
        ).value =
            "";


        document.getElementById(
            "candidateSelected"
        ).textContent =
            "선택된 장소 없음";


        const results =
            document.getElementById(
                "candidateResults"
            );


        results.innerHTML =
            "";


        results.style.display =
            "none";


        showToast(
            "희망 장소가 초기화되었습니다.\n장소 입력 완료 버튼을 눌러 저장해주세요.",
            "info"
        );

    }



    async function saveLocation()
    {

        if (!selectedDeparture)
        {

            showToast(
                "출발 장소를 검색 후 선택해주세요.",
                "error"
            );


            return;
        }


        if (!selectedReturn)
        {

            showToast(
                "귀가 장소를 검색 후 선택해주세요.",
                "error"
            );


            return;
        }


        const candidateInput =
            document.getElementById(
                "candidateQuery"
            ).value.trim();


        if (
            candidateInput
            &&
            !selectedCandidate
        )
        {

            showToast(
                "희망 장소는 검색 후 선택해주세요.",
                "error"
            );


            return;
        }


        const locationResponse =
            await MeetBack.authenticatedFetch(
                "/participants/"
                + participant.participantId
                + "/location",
                {

                    method:
                        "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            {

                                departureQuery:
                                    selectedDeparture.name
                                    || selectedDeparture.placeName,

                                returnQuery:
                                    selectedReturn.name
                                    || selectedReturn.placeName

                            }
                        )

                }
            );


        if (!locationResponse.ok)
        {

            const text =
                await locationResponse.text();


            showToast(
                text
                || "장소 저장에 실패했습니다.",
                "error"
            );


            return;
        }


        if (
            pageMode === "create"
            ||
            candidateTouched
        )
        {

            let candidateQuery =
                "";


            if (selectedCandidate)
            {

                candidateQuery =
                    selectedCandidate.name
                    || selectedCandidate.placeName
                    || "";

            }


            const candidateResponse =
                await MeetBack.authenticatedFetch(
                    "/participants/"
                    + participant.participantId
                    + "/candidate",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                {

                                    candidateQuery:
                                    candidateQuery

                                }
                            )

                    }
                );


            if (!candidateResponse.ok)
            {

                const text =
                    await candidateResponse.text();


                showToast(
                    text
                    || "희망 장소 저장에 실패했습니다.",
                    "error"
                );


                return;
            }

        }


        // --------------------------------------------------------
        // 모임방에서 성공 메시지 출력
        // --------------------------------------------------------

        sessionStorage.setItem(
            "meetbackToastMessage",
            pageMode === "edit"
                ? "장소 정보가 수정되었습니다."
                : "장소 입력이 완료되었습니다."
        );


        sessionStorage.setItem(
            "meetbackToastType",
            "success"
        );


        // 딜레이 없이 이동
        returnToRoom();

    }



    function returnToRoom()
    {

        location.href =
            "/meeting?meetingId="
            + meetingId;

    }



    async function goRoom()
    {

        if (
            pageMode === "edit"
            &&
            participant
        )
        {

            const response =
                await MeetBack.authenticatedFetch(
                    "/participants/"
                    + participant.participantId
                    + "/edit/cancel",
                    {

                        method:
                            "PUT"

                    }
                );


            if (!response.ok)
            {

                const text =
                    await response.text();


                showToast(
                    text
                    || "수정 취소 처리에 실패했습니다.",
                    "error"
                );


                return;
            }

        }


        returnToRoom();

    }



    initialize();

</script>

</body>
</html>
