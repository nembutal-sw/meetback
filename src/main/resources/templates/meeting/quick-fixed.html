<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>MeetBack 고정 번개방</title>

    <script
            src="/js/auth-session-guard.js"
            defer>
    </script>

    <script
            src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js">
    </script>

    <script src="/js/meeting-common.js"></script>

    <script src="/js/meeting-presence.js"></script>

    <!-- NAVER MAP -->
    <script
            th:src="|https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${naverMapsClientId}&submodules=gl|">
    </script>
    <script src="/js/naver-map-theme.js"></script>


    <link rel="stylesheet" href="/css/quick-fixed.css">
    <link rel="stylesheet" href="/css/meetback-theme.css">
    <link rel="stylesheet" href="/css/app-pages.css">
    <link rel="stylesheet" href="/css/route-map.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
    <script src="/js/theme-toggle.js"></script>
</head>


<body class="mb-page mb-app-page mb-map-page page-quick-fixed">


<!-- =========================================================
     강퇴 Modal
     ========================================================= -->

<div
        id="kickModal"
        class="kick-modal"
        role="dialog"
        aria-modal="true"
        aria-hidden="true">

    <div class="kick-modal-box">

        <div class="kick-modal-title">
            모임에서 강퇴되었습니다.
        </div>

    </div>

</div>


<!-- =========================================================
     귀가 경로 지도 Modal
     ========================================================= -->

<div
        id="routeMapModal"
        class="route-map-modal"
        onclick="handleRouteMapBackground(event)">

    <div class="route-map-modal-content">

        <div class="route-map-modal-header">

            <div>

                <div class="route-map-label">
                    RETURN ROUTE
                </div>

                <h2 id="routeMapTitle">
                    내 귀가 경로
                </h2>

            </div>


            <button
                    type="button"
                    class="route-map-close"
                    onclick="closeReturnRouteMap()">

                ×

            </button>

        </div>


        <div class="route-map-body">

            <div
                    id="routeMap"
                    class="route-map">
            </div>


            <div
                    id="routeMapInfo"
                    class="route-map-info">
            </div>


            <div
                    id="routeGuide"
                    class="route-guide">
            </div>

        </div>

    </div>

</div>


<div class="page">


    <!-- =========================================================
         상단
         ========================================================= -->

    <div class="header">

        <h1>
            MeetBack
        </h1>

    </div>


    <div
            id="message"
            class="message">
    </div>


    <!-- =========================================================
         고정 번개방 정보
         ========================================================= -->

    <div class="card">

        <!-- 왼쪽 모임 정보 -->
        <div class="meeting-main">

            <div
                    id="meetingTitle"
                    class="meeting-title">

                모임 정보를 불러오는 중...

            </div>


            <!-- 방 유형과 초대코드를 한 줄로 배치 -->
            <div class="meeting-meta-row">

                <div class="meeting-type">
                    ⚡ 고정 번개방
                </div>


                <button
                        type="button"
                        id="inviteCodeButton"
                        class="invite-button"
                        onclick="copyInviteUrl()"
                        disabled>

                    🔗 초대코드
                    <span id="inviteCode">
                    -
                </span>

                </button>

            </div>


            <div class="info-grid">

                <div class="info-item">

                    <div class="info-label">
                        모임 시작시간
                    </div>

                    <div
                            id="meetingStartAt"
                            class="info-value">

                        -

                    </div>

                </div>


                <div class="info-item">

                    <div class="info-label">
                        희망 종료시간
                    </div>

                    <div
                            id="desiredEndAt"
                            class="info-value">

                        -

                    </div>

                </div>

            </div>

        </div>


        <!-- 오른쪽 버튼 영역 -->
        <div class="room-actions">

            <button
                    type="button"
                    id="closeRecruitmentButton"
                    class="close-recruitment-button"
                    onclick="closeRecruitment()"
                    hidden>

                참가 마감

            </button>


            <button
                    type="button"
                    id="leaveMeetingButton"
                    class="leave-button"
                    onclick="leaveMeeting()"
                    hidden>

                방 나가기

            </button>


            <button
                    type="button"
                    class="home-button"
                    onclick="goHome()">

                홈으로

            </button>

        </div>

    </div>




    <!-- =========================================================
         고정 장소
         ========================================================= -->

    <div class="card place-card">

        <h2>
            모임 장소
        </h2>


        <div
                id="fixedPlaceName"
                class="place-name">

            장소 정보를 불러오는 중...

        </div>


        <div
                id="fixedPlaceAddress"
                class="place-address">

            -

        </div>


        <div class="place-actions">

            <button
                    type="button"
                    class="place-action-button"
                    onclick="openReturnCheck()">

                내 귀가정보 확인

            </button>


            <button
                    type="button"
                    id="returnRouteMapButton"
                    class="place-action-button map-button"
                    onclick="openReturnRouteMap()"
                    disabled>

                🗺 귀가 경로 지도

            </button>

        </div>

    </div>


    <!-- =========================================================
         참가자 현황
         ========================================================= -->

    <div class="card">

        <h2>
            참가자 현황
        </h2>


        <div
                id="participantSummary"
                class="participant-summary">

            현재 인원을 불러오는 중...

        </div>


        <div
                id="participantList"
                class="participant-list">
        </div>


        <div
                id="kickedParticipantSection"
                class="kicked-participant-section"
                hidden>

            <h3>
                강퇴된 참가자
            </h3>


            <div
                    id="kickedParticipantList"
                    class="participant-list">
            </div>

        </div>

    </div>


    <!-- =========================================================
         모임 채팅
         ========================================================= -->

    <div class="card">

        <div class="chat-header">

            <h2>
                모임 채팅
            </h2>


            <div>
                연결 상태 :
                <strong id="chatStatus">
                    CONNECTING
                </strong>
            </div>

        </div>


        <div
                id="chatMessages"
                class="chat-messages">
        </div>


        <div class="chat-row">

            <input
                    type="text"
                    id="chatInput"
                    placeholder="메시지를 입력하세요"
                    onkeydown="
                        if (event.key === 'Enter') {
                            sendChat();
                        }
                    ">


            <button
                    type="button"
                    class="chat-send-button"
                    onclick="sendChat()">

                전송

            </button>

        </div>

    </div>


</div>


<script>

    // =========================================================
    // 상태
    // =========================================================

    let meetingId =
        null;

    let meeting =
        null;

    let fixedPlace =
        null;

    let currentUser =
        null;

    let stompClient = null;

    const roomTabId =
        (
            typeof globalThis.crypto?.randomUUID === "function"
                ? globalThis.crypto.randomUUID()
                : Date.now()
                + "-"
                + Math.random()
        ).toString();
    // =========================================================
    // 귀가 지도 상태
    // =========================================================

    let returnPreviewResult =
        null;

    let routeMap =
        null;

    let routePolylines =
        [];

    let routeMarkers =
        [];

    let roomSessionReplaced = false;

    let currentParticipant = null;

    // =========================================================
    // DOM
    // =========================================================

    const message =
        document.getElementById(
            "message"
        );

    const meetingTitle =
        document.getElementById(
            "meetingTitle"
        );

    const meetingStartAt =
        document.getElementById(
            "meetingStartAt"
        );

    const desiredEndAt =
        document.getElementById(
            "desiredEndAt"
        );

    const inviteCode =
        document.getElementById(
            "inviteCode"
        );

    const inviteCodeButton =
        document.getElementById(
            "inviteCodeButton"
        );

    const leaveMeetingButton =
        document.getElementById(
            "leaveMeetingButton"
        );

    const closeRecruitmentButton =
        document.getElementById(
            "closeRecruitmentButton"
        );

    const fixedPlaceName =
        document.getElementById(
            "fixedPlaceName"
        );

    const fixedPlaceAddress =
        document.getElementById(
            "fixedPlaceAddress"
        );

    const participantSummary =
        document.getElementById(
            "participantSummary"
        );

    const participantList =
        document.getElementById(
            "participantList"
        );

    const kickedParticipantSection =
        document.getElementById(
            "kickedParticipantSection"
        );

    const kickedParticipantList =
        document.getElementById(
            "kickedParticipantList"
        );

    const returnRouteMapButton =
        document.getElementById(
            "returnRouteMapButton"
        );


    // =========================================================
    // 메시지
    // =========================================================

    function showMessage(
        text
    )
    {
        message.textContent =
            text;

        message.className =
            "message show message-error";
    }


    // =========================================================
    // 홈 이동
    // =========================================================

    function goHome()
    {
        location.href =
            "/home";
    }


    // =========================================================
    // 내 귀가정보 확인 페이지 이동
    // =========================================================

    function openReturnCheck()
    {
        if (!meetingId)
        {
            showMessage(
                "모임 ID를 확인할 수 없습니다."
            );

            return;
        }


        location.href =
            "/quick-fixed-check?meetingId="
            +
            encodeURIComponent(
                meetingId
            )
            +
            "&from=room";
    }


    // =========================================================
    // 귀가 결과 불러오기
    //
    // 1. sessionStorage 결과가 있으면 우선 재사용
    // 2. 없거나 사용할 수 없는 결과면
    //    DB에 저장된 현재 참가자의 귀가지 기준으로 조회
    // =========================================================

    async function loadSavedReturnPreview()
    {
        returnPreviewResult =
            null;


        const storageKey =
            `quickFixedReturnResult:${meetingId}`;


        const savedText =
            sessionStorage.getItem(
                storageKey
            );


        // =====================================================
        // 1. sessionStorage 확인
        // =====================================================

        if (savedText)
        {
            try
            {
                const saved =
                    JSON.parse(
                        savedText
                    );


                if (
                    saved
                    &&
                    Number(saved.meetingId)
                    ===
                    Number(meetingId)
                    &&
                    saved.result
                )
                {
                    let validSavedResult =
                        true;


                    // =============================================
                    // 모임 종료시간 변경 여부
                    // =============================================

                    if (
                        meeting?.desiredEndAt
                        &&
                        saved.result.desiredEndAt
                    )
                    {
                        const currentEndTime =
                            new Date(
                                meeting.desiredEndAt
                            ).getTime();


                        const savedEndTime =
                            new Date(
                                saved.result.desiredEndAt
                            ).getTime();


                        if (
                            !Number.isNaN(
                                currentEndTime
                            )
                            &&
                            !Number.isNaN(
                                savedEndTime
                            )
                            &&
                            currentEndTime
                            !==
                            savedEndTime
                        )
                        {
                            validSavedResult =
                                false;


                            sessionStorage.removeItem(
                                storageKey
                            );
                        }
                    }


                    if (validSavedResult)
                    {
                        returnPreviewResult =
                            saved.result;


                        // =========================================
                        // 예전 routeMapData 세션 호환
                        // =========================================

                        if (
                            !returnPreviewResult.routeMap
                            &&
                            returnPreviewResult.routeMapData
                        )
                        {
                            try
                            {
                                returnPreviewResult.routeMap =
                                    typeof returnPreviewResult.routeMapData
                                    ===
                                    "string"
                                        ? JSON.parse(
                                            returnPreviewResult.routeMapData
                                        )
                                        : returnPreviewResult.routeMapData;
                            }
                            catch (error)
                            {
                                console.warn(
                                    "[OLD ROUTE MAP DATA PARSE ERROR]",
                                    error
                                );
                            }
                        }


                        const walking =
                            !returnPreviewResult.lastTrainDepartureAt;


                        /*
                         * 도보 결과는 지도 데이터가 없는 것이 정상.
                         *
                         * 대중교통 결과는 routeMap.lines가 있어야
                         * 세션 결과를 그대로 사용한다.
                         */
                        if (
                            walking
                            ||
                            (
                                returnPreviewResult.routeMap
                                &&
                                Array.isArray(
                                    returnPreviewResult.routeMap.lines
                                )
                                &&
                                returnPreviewResult.routeMap.lines.length > 0
                            )
                        )
                        {
                            updateReturnRouteMapButton();

                            return;
                        }


                        returnPreviewResult =
                            null;
                    }
                }
            }
            catch (error)
            {
                console.warn(
                    "[QUICK FIXED SESSION PREVIEW ERROR]",
                    error
                );


                sessionStorage.removeItem(
                    storageKey
                );


                returnPreviewResult =
                    null;
            }
        }


        // =====================================================
        // 2. 세션 결과가 없으면
        //    DB 귀가지 기준으로 현재 참가자의 결과 조회
        // =====================================================

        try
        {
            const response =
                await MeetBack.authenticatedFetch(
                    `/calculations/meeting/${meetingId}/quick-fixed/return-check`,
                    {
                        method:
                            "POST",

                        cache:
                            "no-store"
                    }
                );


            if (!response.ok)
            {
                console.warn(
                    "[QUICK FIXED RETURN CHECK FAILED]",
                    response.status
                );


                returnPreviewResult =
                    null;


                updateReturnRouteMapButton();


                return;
            }


            returnPreviewResult =
                await response.json();


            updateReturnRouteMapButton();
        }
        catch (error)
        {
            console.error(
                "[QUICK FIXED RETURN CHECK ERROR]",
                error
            );


            returnPreviewResult =
                null;


            updateReturnRouteMapButton();
        }
    }


    // =========================================================
    // 지도 버튼 상태
    // =========================================================

    function updateReturnRouteMapButton()
    {
        const routeData =
            returnPreviewResult?.routeMap;


        if (
            routeData
            &&
            Array.isArray(
                routeData.lines
            )
            &&
            routeData.lines.length > 0
        )
        {
            returnRouteMapButton.disabled =
                false;


            returnRouteMapButton.textContent =
                "🗺 귀가 경로 지도";


            return;
        }


        returnRouteMapButton.disabled =
            true;


        if (
            returnPreviewResult
            &&
            !returnPreviewResult.lastTrainDepartureAt
        )
        {
            returnRouteMapButton.textContent =
                "🚶 도보 귀가";
        }
        else
        {
            returnRouteMapButton.textContent =
                "🗺 귀가 경로 지도";
        }
    }


    // =========================================================
    // 귀가 지도 열기
    // =========================================================

    async function openReturnRouteMap()
    {
        /*
         * 초기화에서 이미 결과를 읽지만
         * 혹시 결과가 없다면 다시 조회한다.
         */
        if (!returnPreviewResult)
        {
            await loadSavedReturnPreview();
        }


        const routeData =
            returnPreviewResult?.routeMap;


        // =====================================================
        // 도보 귀가
        // =====================================================

        if (
            returnPreviewResult
            &&
            !returnPreviewResult.lastTrainDepartureAt
        )
        {
            showMessage(
                "도보 귀가 가능한 거리입니다."
            );

            return;
        }


        // =====================================================
        // 지도 데이터 확인
        // =====================================================

        if (
            !routeData
            ||
            !Array.isArray(
                routeData.lines
            )
            ||
            routeData.lines.length === 0
        )
        {
            showMessage(
                "표시할 귀가 경로가 없습니다. 내 귀가정보 확인에서 다시 계산해주세요."
            );

            return;
        }


        // =====================================================
        // NAVER MAP SDK 확인
        // =====================================================

        if (
            typeof naver === "undefined"
            ||
            !naver.maps
        )
        {
            showMessage(
                "네이버 지도를 불러오지 못했습니다."
            );

            return;
        }


        // =====================================================
        // 제목
        // =====================================================

        document.getElementById(
            "routeMapTitle"
        ).textContent =
            (
                routeData.startName
                ||
                fixedPlace?.placeName
                ||
                "모임 장소"
            )
            +
            " → "
            +
            (
                routeData.endName
                ||
                "귀가 장소"
            );


        // =====================================================
        // Modal
        // =====================================================

        document.getElementById(
            "routeMapModal"
        ).classList.add(
            "open"
        );


        document.body.classList.add(
            "modal-open"
        );


        renderReturnRouteInfo();


        renderRouteGuide(
            routeData.steps,
            routeData.lines
        );


        setTimeout(
            () =>
            {
                drawRouteMap(
                    routeData.lines,
                    routeData.startName,
                    routeData.endName,
                    routeData.steps
                );
            },
            100
        );
    }


    // =========================================================
    // 지도 상단 귀가 정보
    // =========================================================

    function renderReturnRouteInfo()
    {
        const info =
            document.getElementById(
                "routeMapInfo"
            );


        if (!returnPreviewResult)
        {
            info.innerHTML =
                "";

            return;
        }


        info.innerHTML =
            `
            <span>
                예상 귀가시간
                <strong>
                    ${
                returnPreviewResult.returnMinutes == null
                    ? "-"
                    : returnPreviewResult.returnMinutes + "분"
            }
                </strong>
            </span>

            <span>
                환승
                <strong>
                    ${
                returnPreviewResult.transferCount == null
                    ? "-"
                    : returnPreviewResult.transferCount + "회"
            }
                </strong>
            </span>

            <span>
                막차
                <strong>
                    ${
                returnPreviewResult.lastTrainDepartureAt
                    ? formatTimeOnly(
                        returnPreviewResult.lastTrainDepartureAt
                    )
                    : "-"
            }
                </strong>
            </span>
            `;
    }


    // =========================================================
    // 노선명 정리
    // =========================================================

    function normalizeLineName(
        lineName
    )
    {
        if (!lineName)
        {
            return "노선 정보 없음";
        }


        return String(
            lineName
        )
            .replace(
                /^수도권\s*/,
                ""
            )
            .trim();
    }


    // =========================================================
    // 지하철 호선 색
    // =========================================================

    function getSubwayLineColor(
        type
    )
    {
        const colors = {

            1: "#0052A4",
            2: "#00A84D",
            3: "#EF7C1C",
            4: "#00A5DE",
            5: "#996CAC",
            6: "#CD7C2F",
            7: "#747F00",
            8: "#E6186C",
            9: "#BDB092"

        };


        return colors[type]
            ||
            "#6557f6";
    }


    // =========================================================
    // 이용 노선 안내
    // =========================================================

    function renderRouteGuide(
        steps,
        lines
    )
    {
        const guide =
            document.getElementById(
                "routeGuide"
            );


        if (
            !Array.isArray(steps)
            ||
            steps.length === 0
        )
        {
            guide.innerHTML =
                "";


            guide.style.display =
                "none";


            return;
        }


        let html =
            `
            <div class="route-guide-content">

                <span class="route-guide-label">
                    이용 노선
                </span>
            `;


        steps.forEach(
            (
                step,
                index
            ) =>
            {
                const lineType =
                    lines?.[index]?.type;


                const lineColor =
                    getSubwayLineColor(
                        Number(
                            lineType
                        )
                    );


                const lineName =
                    MeetBack.escapeHtml(
                        normalizeLineName(
                            step.lineName
                        )
                    );


                html +=
                    `
                    <span
                            class="route-guide-line-chip"
                            style="
                                color: ${lineColor};
                                border: 1px solid ${lineColor}40;
                                background: ${lineColor}18;
                            ">

                        ${lineName}

                    </span>
                    `;


                if (
                    index
                    <
                    steps.length - 1
                )
                {
                    html +=
                        `
                        <span class="route-guide-arrow">
                            →
                        </span>

                        <span class="route-guide-transfer-station">
                            ${
                            MeetBack.escapeHtml(
                                step.endStationName
                                ||
                                "환승역"
                            )
                        }
                        </span>

                        <span class="route-guide-transfer-badge">
                            환승
                        </span>

                        <span class="route-guide-arrow">
                            →
                        </span>
                        `;
                }
            }
        );


        html +=
            `
            </div>
            `;


        guide.innerHTML =
            html;


        guide.style.display =
            "block";
    }


    // =========================================================
    // 지도 역 마커
    // =========================================================

    function createRouteStationMarker(
        position,
        type,
        stationName,
        lineText,
        lineType,
        nextLineType = null
    )
    {
        if (
            !position
            ||
            !routeMap
        )
        {
            return;
        }


        let badgeText =
            "경유";


        if (type === "start")
        {
            badgeText =
                "출발";
        }
        else if (type === "transfer")
        {
            badgeText =
                "환승";
        }
        else if (type === "end")
        {
            badgeText =
                "도착";
        }


        const lineColor =
            getSubwayLineColor(
                Number(
                    lineType
                )
            );


        const nextLineColor =
            nextLineType == null
                ? lineColor
                : getSubwayLineColor(
                    Number(
                        nextLineType
                    )
                );


        const safeStationName =
            MeetBack.escapeHtml(
                stationName
                ||
                "역 정보 없음"
            );


        const safeLineText =
            MeetBack.escapeHtml(
                lineText
                ||
                ""
            );


        const marker =
            new naver.maps.Marker(
                {

                    map:
                    routeMap,

                    position:

    // =========================================================
    // 네이버 지도 출력
    // =========================================================

    function drawRouteMap(
        lines,
        startName,
        endName,
        steps
    )
    {
        if (
            typeof naver === "undefined"
            ||
            !naver.maps
        )
        {
            return;
        }


        const allPoints =
            [];


        lines.forEach(
            line =>
            {
                if (
                    !Array.isArray(
                        line.points
                    )
                    ||
                    line.points.length === 0
                )
                {
                    return;
                }


                line.points.forEach(
                    point =>
                    {
                        const latitude =
                            Number(
                                point.latitude
                            );


                        const longitude =
                            Number(
                                point.longitude
                            );


                        if (
                            Number.isNaN(latitude)
                            ||
                            Number.isNaN(longitude)
                        )
                        {
                            return;
                        }


                        allPoints.push(
                            new naver.maps.LatLng(
                                latitude,
                                longitude
                            )
                        );
                    }
                );
            }
        );


        if (allPoints.length === 0)
        {
            showMessage(
                "표시할 경로 좌표가 없습니다."
            );

            return;
        }


        if (!routeMap)
        {
            routeMap =
                new naver.maps.Map(
                    "routeMap",
                    {

                        center:
                            allPoints[0],

                        zoom:
                            13
                    }
                );
        }


        naver.maps.Event.trigger(
            routeMap,
            "resize"
        );


        routePolylines.forEach(
            polyline =>
                polyline.setMap(
                    null
                )
        );


        routePolylines =
            [];


        routeMarkers.forEach(
            marker =>
                marker.setMap(
                    null
                )
        );


        routeMarkers =
            [];


        // =====================================================
        // 경로선
        // =====================================================

        lines.forEach(
            line =>
            {
                if (
                    !Array.isArray(
                        line.points
                    )
                    ||
                    line.points.length === 0
                )
                {
                    return;
                }


                const path =
                    line.points.map(
                        point =>
                            new naver.maps.LatLng(
                                Number(
                                    point.latitude
                                ),
                                Number(
                                    point.longitude
                                )
                            )
                    );


                const polyline =
                    new naver.maps.Polyline(
                        {

                            map:
                            routeMap,

                            path:
                            path,

                            strokeColor:
                                getSubwayLineColor(
                                    Number(
                                        line.type
                                    )
                                ),

                            strokeWeight:
                                6,

                            strokeOpacity:
                                0.9,

                            strokeLineCap:
                                "round",

                            strokeLineJoin:
                                "round"
                        }
                    );


                routePolylines.push(
                    polyline
                );
            }
        );


        // =====================================================
        // 역 마커
        // =====================================================

        if (
            Array.isArray(steps)
            &&
            steps.length > 0
        )
        {
            const firstStep =
                steps[0];


            const lastStep =
                steps[
                steps.length - 1
                    ];


            // =================================================
            // 출발역
            // =================================================

            let startPosition =
                allPoints[0];


            if (
                firstStep.startLatitude != null
                &&
                firstStep.startLongitude != null
            )
            {
                startPosition =
                    new naver.maps.LatLng(
                        Number(
                            firstStep.startLatitude
                        ),
                        Number(
                            firstStep.startLongitude
                        )
                    );
            }


            createRouteStationMarker(
                startPosition,
                "start",
                firstStep.startStationName
                ||
                startName
                ||
                "출발역",
                normalizeLineName(
                    firstStep.lineName
                ),
                lines[0]?.type
            );


            // =================================================
            // 환승역
            // =================================================

            for (
                let i = 0;
                i < steps.length - 1;
                i++
            )
            {
                const currentStep =
                    steps[i];


                const nextStep =
                    steps[i + 1];


                if (
                    currentStep.endLatitude == null
                    ||
                    currentStep.endLongitude == null
                )
                {
                    continue;
                }


                const transferPosition =
                    new naver.maps.LatLng(
                        Number(
                            currentStep.endLatitude
                        ),
                        Number(
                            currentStep.endLongitude
                        )
                    );


                createRouteStationMarker(
                    transferPosition,
                    "transfer",
                    currentStep.endStationName
                    ||
                    "환승역",
                    normalizeLineName(
                        currentStep.lineName
                    )
                    +
                    " → "
                    +
                    normalizeLineName(
                        nextStep.lineName
                    ),
                    lines[i]?.type,
                    lines[i + 1]?.type
                );
            }


            // =================================================
            // 도착역
            // =================================================

            let endPosition =
                allPoints[
                allPoints.length - 1
                    ];


            if (
                lastStep.endLatitude != null
                &&
                lastStep.endLongitude != null
            )
            {
                endPosition =
                    new naver.maps.LatLng(
                        Number(
                            lastStep.endLatitude
                        ),
                        Number(
                            lastStep.endLongitude
                        )
                    );
            }


            createRouteStationMarker(
                endPosition,
                "end",
                lastStep.endStationName
                ||
                endName
                ||
                "도착역",
                normalizeLineName(
                    lastStep.lineName
                ),
                lines[
                lines.length - 1
                    ]?.type
            );
        }


        // =====================================================
        // 지도 범위
        // =====================================================

        const bounds =
            new naver.maps.LatLngBounds();


        allPoints.forEach(
            point =>
                bounds.extend(
                    point
                )
        );


        routeMap.fitBounds(
            bounds
        );
    }

    function formatTimeOnly(
        value
    )
    {
        if (!value)
        {
            return "-";
        }


        const date =
            new Date(
                value
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        )
        {
            return "-";
        }


        return new Intl.DateTimeFormat(
            "ko-KR",
            {

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                hour12:
                    false

            }
        ).format(
            date
        );
    }

    async function copyInviteUrl()

        const inviteUrl =

            );

    async function loadParticipants()
    {

            await MeetBack.authenticatedFetch(
                "/participants/meeting/"
                +
                meetingId,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok)
        {
            throw new Error(
                "참가자 목록을 불러오지 못했습니다."
            );
        }


        const participants =
            await response.json();


        if (!Array.isArray(participants))
        {
            throw new Error(
                "참가자 목록 형식이 올바르지 않습니다."
            );
        }


        currentParticipant =
            participants.find(
                participant =>
                    Number(participant.userId)
                    ===
                    Number(currentUser.userId)
            )
            ||
            null;

        const currentUserIsHost =
            Number(meeting.hostUserId)
            ===
            Number(currentUser.userId);

        leaveMeetingButton.hidden =
            !currentParticipant
            ||
            currentUserIsHost;

        const maxParticipants =
            Number(
                meeting.maxParticipants
                ||
                0
            );

        participantSummary.textContent =
            maxParticipants > 0
                ? "현재 인원 "
                + participants.length
                + " / "
                + maxParticipants
                + "명"
                : "현재 인원 "
                + participants.length
                + "명";

        participantList.replaceChildren();

        participants.forEach(
            participant =>
            {
                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "participant-card";

                const host =
                    Number(participant.userId)
                    ===
                    Number(meeting.hostUserId);

                const me =
                    Number(participant.userId)
                    ===
                    Number(currentUser.userId);

                const canKick =
                    currentUserIsHost
                    &&
                    !host
                    &&
                    !me;

                const nickname =
                    participant.nickname
                    ||
                    "참가자";

                item.innerHTML =
                    `
                    <div class="participant-card-top">

                        <strong class="participant-name">
                            ${host ? "👑 " : ""}
                            ${MeetBack.escapeHtml(nickname)}
                            ${me ? " (나)" : ""}
                        </strong>

                        <span
                                id="presence-user-${participant.userId}"
                                class="
                                    presence-badge
                                    ${participant.online ? "online" : "offline"}
                                ">

                            <span class="presence-dot"></span>

                            <span class="presence-text">
                                ${participant.online ? "ON" : "OFF"}
                            </span>

                        </span>

                    </div>

                    <div class="participant-card-bottom">

                        ${
                                        canKick
                                            ? `
                                    <button
                                            type="button"
                                            class="participant-kick-button">
                                        강퇴
                                    </button>
                                  `
                                            : ""
                                    }

                    </div>
                    `;


                const kickButton =
                    item.querySelector(
                        ".participant-kick-button"
                    );

                if (kickButton)
                {
                    kickButton.addEventListener(
                        "click",
                        () =>
                        {
                            requestKick(
                                participant.participantId,
                                nickname
                            );
                        }
                    );
                }

                participantList.appendChild(
                    item
                );
            }
        );
    }

    async function loadKickedParticipants()
    {
        const currentUserIsHost =
            meeting
            &&
            currentUser
            &&
            Number(meeting.hostUserId)
            ===
            Number(currentUser.userId);

        if (!currentUserIsHost)
        {
            kickedParticipantSection.hidden =
                true;

            kickedParticipantList.replaceChildren();

            return;
        }

        const response =
            await MeetBack.authenticatedFetch(
                "/participants/meeting/"
                +
                meetingId
                +
                "/kicked",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

        if (!response.ok)
        {
            kickedParticipantSection.hidden =
                true;

            return;
        }

        const kickedParticipants =
            await response.json();

        kickedParticipantList.replaceChildren();

        if (
            !Array.isArray(kickedParticipants)
            ||
            kickedParticipants.length === 0
        )
        {
            kickedParticipantSection.hidden =
                true;

            return;
        }

        kickedParticipantSection.hidden =
            false;

        kickedParticipants.forEach(
            participant =>
            {
                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "participant-item";

                const nickname =
                    participant.nickname
                    ||
                    "참가자";

                item.innerHTML =
                    `
                    <span class="participant-name">
                        ${MeetBack.escapeHtml(nickname)}
                    </span>

                    <span class="kicked-participant-badge">
                        강퇴됨
                    </span>

                    <button
                            type="button"
                            class="participant-kick-cancel-button">

                        강퇴 취소

                    </button>
                    `;

                item.querySelector(
                    ".participant-kick-cancel-button"
                ).addEventListener(
                    "click",
                    () =>
                    {
                        requestCancelKick(
                            participant.participantId,
                            nickname
                        );
                    }
                );

                kickedParticipantList.appendChild(
                    item
                );
            }
        );
    }

    async function requestKick(

        nickname

        if (
            !confirm(
                nickname
                +
                "님을 강퇴하시겠습니까?"
            )
        )
        {
            return;
        }

        const response =
            await MeetBack.authenticatedFetch(
                "/participants/"
                +
                participantId
                +
                "/kick",
                {
                    method:
                        "DELETE"
                }
            );

        if (!response.ok)
        {
            showMessage(
                "참가자 강퇴에 실패했습니다."
            );

            return;
        }

        await loadParticipants();

        await loadKickedParticipants();
    }

    // =========================================================
    // 사용자가 채팅 맨 아래 근처를 보고 있는지 확인
    // =========================================================

    function isChatNearBottom(
        area
    )
    {
        const threshold =
            80;

        const distanceFromBottom =
            area.scrollHeight
            - area.scrollTop
            - area.clientHeight;

        return distanceFromBottom
            <= threshold;
    }

    // =========================================================
    // 채팅 메시지 화면 추가
    // =========================================================

    function addChatMessage(
        chatMessage
    )
    {
        const area =
            document.getElementById(
                "chatMessages"
            );

        if (!area)
        {
            return;
        }


        /*
         * 메시지를 추가하기 전에
         * 사용자가 맨 아래를 보고 있었는지 확인한다.
         */
        const shouldAutoScroll =
            isChatNearBottom(
                area
            );


        const row =
            document.createElement(
                "div"
            );

        if (chatMessage.messageType === "SYSTEM")
        {
            row.className =
                "chat-message system";


            /*
             * 참가 시스템 메시지는
             * 이벤트를 발생시킨 참가자의 닉네임을 표시한다.
             */
            if (
                chatMessage.eventType
                ===
                "PARTICIPANT_JOINED"
            )
            {
                const nickname =
                    chatMessage.nickname
                    ||
                    "참가자";

                row.textContent =
                    nickname
                    +
                    "님이 "
                    +
                    (
                        chatMessage.content
                        ||
                        "모임에 참가했습니다."
                    );
            }
            else
            {
                row.textContent =
                    "📢 "
                    +
                    (
                        chatMessage.content
                        ||
                        ""
                    );
            }
        }
        else
        {
            row.className =
                "chat-message";

            const nickname =
                document.createElement(
                    "strong"
                );

            nickname.textContent =
                chatMessage.nickname
                ||
                "참가자";

            const content =
                document.createElement(
                    "span"
                );

            content.textContent =
                " : "
                +
                (
                    chatMessage.content
                    ||
                    ""
                );

            row.appendChild(
                nickname
            );

            row.appendChild(
                content
            );
        }

        area.appendChild(
            row
        );


        /*
         * 기존에 맨 아래를 보고 있었을 때만
         * 새 메시지를 따라 내려간다.
         */
        if (shouldAutoScroll)
        {
            area.scrollTop =
                area.scrollHeight;
        }
    }

        {
            modal.classList.add(
                "show"
            );

            modal.setAttribute(
                "aria-hidden",
                "false"
            );
        }

        const chatInput =
            document.getElementById(
                "chatInput"
            );

        if (chatInput)
        {
            chatInput.disabled =
                true;
        }

        if (stompClient)
        {
            stompClient.reconnectDelay =
                0;

            await stompClient.deactivate();
        }

        setTimeout(
            () =>
            {
                location.replace(
                    "/home"
                );
            },
            2500
        );
    }


    // =========================================================
    // WebSocket 연결
    // =========================================================

    function connectChat()
    {
        const protocol =
            location.protocol === "https:"
                ? "wss"
                : "ws";

        stompClient =
            new StompJs.Client({

                brokerURL:
                    protocol
                    +
                    "://"
                    +
                    location.host
                    +
                    "/ws",

                connectHeaders: {
                    "Authorization":
                        "Bearer "
                        +
                        MeetBack.getAccessToken()
                },

                reconnectDelay:
                    5000,

                onConnect:
                    async function()
                    {
                        document.getElementById(
                            "chatStatus"
                        ).textContent =
                            "CONNECTED";

                        const destination =
                            "/topic/meetings/"
                            +
                            meetingId
                            +
                            "/chat";

                        const receiptId =
                            "quick-fixed-"
                            +
                            meetingId
                            +
                            "-"
                            +
                            Date.now();

                        stompClient.watchForReceipt(
                            receiptId,
                            async function()
                            {
                                await loadParticipants();
                                await loadKickedParticipants();
                            }
                        );

                        stompClient.subscribe(
                            destination,
                            async frame =>
                            {
                                const data =
                                    JSON.parse(
                                        frame.body
                                    );

                                if(
                                    data.messageType === "EVENT"
                                    &&
                                    data.eventType === "ROOM_SESSION_REPLACED"
                                    &&
                                    Number(data.userId)
                                        === Number(currentUser.userId)
                                    &&
                                    data.activeTabId !== roomTabId
                                )
                                {
                                    await handleRoomSessionReplaced();

                                    return;
                                }

                                if (
                                    data.messageType === "CHAT"
                                    ||
                                    data.messageType === "SYSTEM"
                                )
                                {
                                    addChatMessage(
                                        data
                                    );
                                }

                                if (
                                    data.messageType === "EVENT"
                                    &&
                                    data.eventType === "PARTICIPANT_KICKED"
                                )
                                {
                                    const kickedMe =
                                        Number(data.userId)
                                        ===
                                        Number(currentUser.userId);

                                    if (kickedMe)
                                    {
                                        showKickModal();

                                        if (stompClient)
                                        {
                                            stompClient.reconnectDelay =
                                                0;

                                            stompClient
                                                .deactivate()
                                                .catch(
                                                    error =>
                                                        console.error(
                                                            "WebSocket 종료 실패:",
                                                            error
                                                        )
                                                );
                                        }

                                        setTimeout(
                                            () =>
                                            {
                                                location.replace(
                                                    "/home"
                                                );
                                            },
                                            2000
                                        );

                                        return;
                                    }

                                    await loadParticipants();

                                    await loadKickedParticipants();

                                    return;
                                }

                                if (
                                    data.messageType === "EVENT"
                                    &&
                                    data.eventType === "PARTICIPANT_KICK_CANCELED"
                                )
                                {
                                    await loadParticipants();

                                    await loadKickedParticipants();

                                    return;
                                }

                                if (
                                    data.eventType === "PRESENCE_UPDATED"
                                    ||
                                    data.eventType === "PARTICIPANT_JOINED"
                                    ||
                                    data.eventType === "PARTICIPANT_LEFT"
                                )
                                {
                                    await loadParticipants();
                                }

                                if (
                                    data.eventType === "RECRUITMENT_CLOSED"
                                )
                                {
                                    await loadMeeting();
                                }
                                if (
                                    data.eventType
                                    ===
                                    "RECRUITMENT_CLOSED"
                                )
                                {
                                    await loadMeeting();
                                }
                            },
                            {
                                receipt:
                                receiptId,

                                "x-room-tab-id":
                                roomTabId
                            }
                        );

                        await loadChatHistory();
                    },

                onWebSocketClose:
                    function()
                    {
                        document.getElementById(
                            "chatStatus"
                        ).textContent =
                            "DISCONNECTED";
                    },

                onStompError:
                    function(frame)
                    {
                        console.error(
                            "[QUICK FIXED STOMP ERROR]",
                            frame
                        );
                    }
            });

        stompClient.activate();
    }


    // =========================================================
    // 채팅 전송
    // =========================================================

    function sendChat()
    {
        const input =
            document.getElementById(
                "chatInput"
            );

        const content =
            input.value.trim();

        if (!content)
        {
            return;
        }

        if (
            !stompClient
            ||
            !stompClient.connected
        )
        {
            showMessage(
                "채팅 서버에 연결 중입니다."
            );

            return;
        }

        stompClient.publish({

            destination:
                "/app/meetings/"
                +
                meetingId
                +
                "/chat",

            body:
                JSON.stringify({
                    content:
                    content
                })
        });

        input.value =
            "";
    }


    // =========================================================
    // 참가 모집 마감
    // =========================================================

    async function closeRecruitment()
    {
        const confirmed =
            confirm(
                "참가 모집을 마감하시겠습니까?\n"
                +
                "마감 후에는 새로운 참가자와 나간 참가자가 다시 들어올 수 없습니다."
            );

        if (!confirmed)
        {
            return;
        }

        closeRecruitmentButton.disabled =
            true;

        try
        {
            const response =
                await MeetBack.authenticatedFetch(
                    "/meetings/"
                    +
                    meetingId
                    +
                    "/recruitment/close",
                    {
                        method:
                            "PATCH"
                    }
                );

            if (!response.ok)
            {
                let errorMessage =
                    "참가 모집을 마감하지 못했습니다.";

                try
                {
                    const errorBody =
                        await response.json();

                    errorMessage =
                        errorBody.message
                        ||
                        errorMessage;
                }
                catch (error)
                {
                }

                throw new Error(
                    errorMessage
                );
            }

            await loadMeeting();
        }
        catch (error)
        {
            showMessage(
                error.message
                ||
                "참가 모집 마감 중 오류가 발생했습니다."
            );

            updateRecruitmentButton();
        }
    }


    // =========================================================
    // 방 나가기
    // =========================================================

    async function leaveMeeting()
    {
        if (!currentParticipant)
        {
            showMessage(
                "현재 참가자 정보를 확인할 수 없습니다."
            );

            return;
        }

        const confirmed =
            confirm(
                "정말 이 모임에서 나가시겠습니까?"
            );

        if (!confirmed)
        {
            return;
        }

        leaveMeetingButton.disabled =
            true;

        try
        {
            const response =
                await MeetBack.authenticatedFetch(
                    "/participants/"
                    +
                    currentParticipant.participantId
                    +
                    "/leave",
                    {
                        method:
                            "DELETE"
                    }
                );

            if (!response.ok)
            {
                let errorMessage =
                    "모임에서 나가지 못했습니다.";

                try
                {
                    const errorBody =
                        await response.json();

                    errorMessage =
                        errorBody.message
                        ||
                        errorMessage;
                }
                catch (error)
                {
                    // 응답 본문이 JSON이 아니면 기본 문구 사용
                }

                throw new Error(
                    errorMessage
                );
            }

            if (
                stompClient
                &&
                stompClient.active
            )
            {
                await stompClient.deactivate();
            }

            location.href =
                "/home";
        }
        catch (error)
        {
            showMessage(
                error.message
                ||
                "모임에서 나가는 중 오류가 발생했습니다."
            );

            leaveMeetingButton.disabled =
                false;
        }
    }


    // =========================================================
    // 초기화
    // =========================================================

    async function initialize()
    {
        currentUser =
            await MeetBack.checkLogin();


        if (!currentUser)
        {
            return;
        }


        meetingId =
            MeetBack.getMeetingId();


        if (!meetingId)
        {
            showMessage(
                "모임 ID를 확인할 수 없습니다."
            );

            return;
        }

        try
        {
            await loadMeeting();

            await loadFixedPlace();

            await loadParticipants();

            await loadKickedParticipants();


            /*
             * sessionStorage 결과가 있으면 재사용.
             *
             * 없거나 사용할 수 없는 경우
             * DB의 현재 귀가지 기준으로
             * /return-check를 호출한다.
             */
            await loadSavedReturnPreview();


            connectChat();
        }
        catch (error)
        {
            console.error(
                "[QUICK FIXED INITIALIZE ERROR]",
                error
            );

            showMessage(
                error.message
                ||
                "고정 번개방을 불러오는 중 오류가 발생했습니다."
            );
        }
    }


    // =========================================================
    // 실행
    // =========================================================

    initialize();

</script>
