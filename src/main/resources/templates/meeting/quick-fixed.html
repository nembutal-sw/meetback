<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>MeetBack 고정 번개방</title>

    <script
            src="/js/auth-session-guard.js"
            defer>
    </script>

    <script
            src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js">
    </script>

    <script src="/js/meeting-common.js"></script>

    <script src="/js/meeting-presence.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f8f8fd;
            font-family: Arial, sans-serif;
            color: #191924;
        }

        .page {
            width: 900px;
            max-width: calc(100% - 32px);
            margin: 40px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0;
        }

        .home-button {
            border: 1px solid #e8e7f1;
            background: white;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
        }

        .card {
            background: white;
            border: 1px solid #e8e7f1;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 18px;
        }

        .meeting-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .meeting-type {
            color: #6557f6;
            font-weight: bold;
            font-size: 14px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 22px;
        }

        .info-item {
            padding: 16px;
            background: #f8f8fd;
            border-radius: 12px;
        }

        .info-label {
            color: #777788;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .info-value {
            font-size: 16px;
            font-weight: bold;
        }

        .place-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .place-address {
            color: #777788;
        }

        .invite-button {
            margin-top: 18px;
            border: 1px solid #6557f6;
            background: #f1efff;
            color: #5143df;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .return-card h2 {
            margin-top: 0;
        }

        .return-description {
            color: #777788;
            line-height: 1.6;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 14px 16px;
            border-radius: 10px;
        }

        .message.show {
            display: block;
        }

        .message-error {
            background: #fff0f1;
            color: #c94b54;
        }

        @media (max-width: 700px) {

            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        .participant-summary {
            margin-bottom: 16px;
            color: #6557f6;
            font-weight: bold;
        }

        .participant-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .participant-item {
            padding: 16px;
            border: 1px solid #e8e7f1;
            border-radius: 12px;
            background: #f8f8fd;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .participant-name {
            font-weight: bold;
        }

        .presence-badge {
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: bold;
        }

        .presence-badge.online {
            color: #16834a;
            background: #e8fff1;
        }

        .presence-badge.offline {
            color: #d34242;
            background: #fff0f0;
        }

        @media (max-width: 700px) {
            .participant-list {
                grid-template-columns: 1fr;
            }
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .chat-header h2 {
            margin: 0;
        }

        .chat-messages {
            height: 320px;
            overflow-y: auto;
            padding: 16px;
            border: 1px solid #e8e7f1;
            border-radius: 12px;
            background: #f8f8fd;
        }

        .chat-message {
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .chat-message.system {
            color: #777788;
            text-align: center;
        }

        .chat-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .chat-row input {
            flex: 1;
            padding: 13px 14px;
            border: 1px solid #e8e7f1;
            border-radius: 10px;
        }

        .chat-send-button {
            border: 0;
            border-radius: 10px;
            padding: 0 22px;
            color: white;
            background: #6557f6;
            font-weight: bold;
            cursor: pointer;
        }

        .leave-button {
            margin-top: 18px;
            margin-left: 8px;
            padding: 10px 14px;

            border: 1px solid #ef5b63;
            border-radius: 10px;

            color: #d9424b;
            background: #fff5f5;

            font-weight: bold;
            cursor: pointer;
        }

        .close-recruitment-button {
            margin-top: 18px;
            margin-left: 8px;
            padding: 10px 14px;

            border: 0;
            border-radius: 10px;

            color: white;
            background: #6557f6;

            font-weight: bold;
            cursor: pointer;
        }

        .close-recruitment-button:disabled {
            color: #777788;
            background: #e8e7f1;
            cursor: default;
        }

        .participant-kick-button,
        .participant-kick-cancel-button {
            padding: 7px 11px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .participant-kick-button {
            color: #d9424b;
            background: #fff5f5;
            border: 1px solid #ef5b63;
        }

        .participant-kick-cancel-button {
            color: #5143df;
            background: #f1efff;
            border: 1px solid #6557f6;
        }

        .kicked-participant-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e8e7f1;
        }

        .kicked-participant-badge {
            color: #d9424b;
            font-size: 13px;
            font-weight: bold;
        }

        .kick-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;

            align-items: center;
            justify-content: center;

            background: rgba(25, 25, 36, 0.55);
        }

        .kick-modal.show {
            display: flex;
        }

        .kick-modal-box {
            width: 420px;
            max-width: calc(100% - 40px);
            padding: 40px 30px;

            border-radius: 18px;
            background: white;
            text-align: center;
        }

        .kick-modal-title {
            font-size: 24px;
            font-weight: bold;
        }

    </style>

</head>

<body>
    <div
            id="kickModal"
            class="kick-modal"
            role="dialog"
            aria-modal="true"
            aria-hidden="true">

        <div class="kick-modal-box">

            <div class="kick-modal-title">
                모임에서 강퇴되었습니다.
            </div>

        </div>

    </div>


<div class="page">


    <!-- =========================================================
         상단
         ========================================================= -->

    <div class="header">

        <h1>
            MeetBack
        </h1>

        <button
                type="button"
                class="home-button"
                onclick="goHome()">

            홈으로

        </button>

    </div>


    <div
            id="message"
            class="message">
    </div>


    <!-- =========================================================
         고정 번개방 정보
         ========================================================= -->

    <div class="card">

        <div
                id="meetingTitle"
                class="meeting-title">

            모임 정보를 불러오는 중...

        </div>


        <div class="meeting-type">

            ⚡ 고정 번개방

        </div>


        <div class="info-grid">


            <div class="info-item">

                <div class="info-label">
                    모임 시작시간
                </div>

                <div
                        id="meetingStartAt"
                        class="info-value">

                    -

                </div>

            </div>


            <div class="info-item">

                <div class="info-label">
                    희망 종료시간
                </div>

                <div
                        id="desiredEndAt"
                        class="info-value">

                    -

                </div>

            </div>


        </div>


        <button
                type="button"
                id="inviteCodeButton"
                class="invite-button"
                onclick="copyInviteUrl()"
                disabled>

            🔗 초대코드
            <span id="inviteCode">
                -
            </span>

        </button>

        <button
                type="button"
                id="leaveMeetingButton"
                class="leave-button"
                onclick="leaveMeeting()"
                hidden>

            방 나가기

        </button>

        <button
                type="button"
                id="closeRecruitmentButton"
                class="close-recruitment-button"
                onclick="closeRecruitment()"
                hidden>

            참가 마감

        </button>

    </div>


    <!-- =========================================================
         고정 장소
         ========================================================= -->

    <div class="card">

        <h2>
            모임 장소
        </h2>


        <div
                id="fixedPlaceName"
                class="place-name">

            장소 정보를 불러오는 중...

        </div>


        <div
                id="fixedPlaceAddress"
                class="place-address">

            -

        </div>

    </div>

    <!-- =========================================================
     참가자 현황
     ========================================================= -->

    <div class="card">

        <h2>
            참가자 현황
        </h2>

        <div
                id="participantSummary"
                class="participant-summary">

            현재 인원을 불러오는 중...

        </div>

        <!-- 현재 참가 중인 사람 -->
        <div
                id="participantList"
                class="participant-list">
        </div>

        <!-- 방장에게만 보이는 강퇴된 참가자 목록 -->
        <div
                id="kickedParticipantSection"
                class="kicked-participant-section"
                hidden>

            <h3>
                강퇴된 참가자
            </h3>

            <div
                    id="kickedParticipantList"
                    class="participant-list">
            </div>

        </div>

    </div>

    <!-- =========================================================
     모임 채팅
     ========================================================= -->

    <div class="card">

        <div class="chat-header">

            <h2>
                모임 채팅
            </h2>

            <div>
                연결 상태 :
                <strong id="chatStatus">
                    CONNECTING
                </strong>
            </div>

        </div>

        <div
                id="chatMessages"
                class="chat-messages">
        </div>

        <div class="chat-row">

            <input
                    type="text"
                    id="chatInput"
                    placeholder="메시지를 입력하세요"
                    onkeydown="
                    if (event.key === 'Enter') {
                        sendChat();
                    }
                ">

            <button
                    type="button"
                    class="chat-send-button"
                    onclick="sendChat()">

                전송

            </button>

        </div>

    </div>


    <!-- =========================================================
         내 귀가 정보
         이후 구현 영역
         ========================================================= -->

    <div class="card return-card">

        <h2>
            내 귀가 확인
        </h2>


        <div class="return-description">

            귀가 장소를 입력하면
            모임 종료 후 집에 돌아갈 수 있는지 확인하고
            귀가 경로를 볼 수 있습니다.

        </div>

    </div>


</div>



<script>

    // =========================================================
    // 상태
    // =========================================================

    let meetingId =
        null;


    let meeting =
        null;


    let fixedPlace =
        null;

    let currentUser = null;

    let stompClient = null;

    const roomTabId =
        (
            typeof globalThis.crypto?.randomUUID === "function"
                ? globalThis.crypto.randomUUID()
                : Date.now()
                + "-"
                + Math.random()
        ).toString();

    let roomSessionReplaced = false;

    let currentParticipant = null;

    // =========================================================
    // DOM
    // =========================================================

    const message =
        document.getElementById(
            "message"
        );


    const meetingTitle =
        document.getElementById(
            "meetingTitle"
        );


    const meetingStartAt =
        document.getElementById(
            "meetingStartAt"
        );


    const desiredEndAt =
        document.getElementById(
            "desiredEndAt"
        );


    const inviteCode =
        document.getElementById(
            "inviteCode"
        );


    const inviteCodeButton =
        document.getElementById(
            "inviteCodeButton"
        );

    const closeRecruitmentButton =
        document.getElementById(
            "closeRecruitmentButton"
        );

    const fixedPlaceName =
        document.getElementById(
            "fixedPlaceName"
        );


    const fixedPlaceAddress =
        document.getElementById(
            "fixedPlaceAddress"
        );

    const participantSummary =
        document.getElementById(
            "participantSummary"
        );

    const participantList =
        document.getElementById(
            "participantList"
        );

    const kickedParticipantSection =
        document.getElementById(
            "kickedParticipantSection"
        );

    const kickedParticipantList =
        document.getElementById(
            "kickedParticipantList"
        );



    // =========================================================
    // 메시지
    // =========================================================

    function showMessage(
        text
    )
    {

        message.textContent =
            text;


        message.className =
            "message show message-error";
    }



    // =========================================================
    // 홈 이동
    // =========================================================

    function goHome()
    {

        location.href =
            "/home";
    }



    // =========================================================
    // 초대 링크 복사
    // =========================================================

    async function copyInviteUrl()
    {

        if (
            !meeting
            ||
            !meeting.inviteCode
        )
        {
            return;
        }


        const inviteUrl =
            window.location.origin
            +
            "/home?inviteCode="
            +
            encodeURIComponent(
                meeting.inviteCode
            );


        try
        {

            await navigator.clipboard.writeText(
                inviteUrl
            );


            const originalText =
                inviteCodeButton.innerHTML;


            inviteCodeButton.textContent =
                "✓ 초대 링크 복사 완료";


            setTimeout(
                () =>
                {

                    inviteCodeButton.innerHTML =
                        originalText;

                },
                1500
            );

        }
        catch (error)
        {

            console.error(
                "[INVITE COPY ERROR]",
                error
            );
        }
    }


    function updateRecruitmentButton()
    {
        if (
            !meeting
            ||
            !currentUser
        )
        {
            closeRecruitmentButton.hidden =
                true;

            return;
        }

        const currentUserIsHost =
            Number(meeting.hostUserId)
            ===
            Number(currentUser.userId);

        closeRecruitmentButton.hidden =
            !currentUserIsHost;

        const recruitmentClosed =
            meeting.status
            ===
            "RECRUITMENT_CLOSED";

        closeRecruitmentButton.disabled =
            recruitmentClosed;

        closeRecruitmentButton.textContent =
            recruitmentClosed
                ? "참가 마감됨"
                : "참가 마감";
    }


    // =========================================================
    // 모임 정보 조회
    // =========================================================

    async function loadMeeting()
    {

        const response =
            await MeetBack.authenticatedFetch(
                "/meetings/"
                +
                meetingId
            );


        if (!response.ok)
        {

            throw new Error(
                "모임 정보를 불러오지 못했습니다."
            );
        }


        const data =
            await response.json();


        if (
            data.meetingType
            !==
            "QUICK_FIXED"
        )
        {

            throw new Error(
                "고정 번개방이 아닙니다."
            );
        }


        meeting =
            data;


        meetingTitle.textContent =
            data.title
            ||
            "제목 없는 모임";


        meetingStartAt.textContent =
            MeetBack.formatDateTime(
                data.meetingStartAt
            );


        desiredEndAt.textContent =
            MeetBack.formatDateTime(
                data.desiredEndAt
            );


        inviteCode.textContent =
            data.inviteCode
            ||
            "-";


        inviteCodeButton.disabled =
            !data.inviteCode;

        updateRecruitmentButton();
    }



    // =========================================================
    // 고정 장소 조회
    // =========================================================

    async function loadFixedPlace()
    {

        const response =
            await MeetBack.authenticatedFetch(
                "/participants/meeting/"
                +
                meetingId
                +
                "/candidates"
            );


        if (!response.ok)
        {

            throw new Error(
                "모임 장소를 불러오지 못했습니다."
            );
        }


        const candidates =
            await response.json();


        if (
            !Array.isArray(
                candidates
            )
        )
        {

            throw new Error(
                "모임 장소 정보가 올바르지 않습니다."
            );
        }


        fixedPlace =
            candidates.find(
                candidate =>
                    Number(
                        candidate.candidateId
                    )
                    ===
                    Number(
                        meeting.finalCandidateId
                    )
            );


        if (!fixedPlace)
        {

            throw new Error(
                "확정된 모임 장소를 찾을 수 없습니다."
            );
        }


        fixedPlaceName.textContent =
            fixedPlace.placeName
            ||
            "장소명 없음";


        fixedPlaceAddress.textContent =
            fixedPlace.address
            ||
            "주소 정보 없음";
    }


    // =========================================================
    // 참가자 목록 조회
    // =========================================================

    async function loadParticipants()
    {
        const response =
            await MeetBack.authenticatedFetch(
                "/participants/meeting/"
                +
                meetingId,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

        if (!response.ok)
        {
            throw new Error(
                "참가자 목록을 불러오지 못했습니다."
            );
        }

        const participants =
            await response.json();

        if (!Array.isArray(participants))
        {
            throw new Error(
                "참가자 목록 형식이 올바르지 않습니다."
            );
        }

        currentParticipant =
            participants.find(
                participant =>
                    Number(participant.userId)
                    ===
                    Number(currentUser.userId)
            )
            ||
            null;

        const currentUserIsHost =
            Number(meeting.hostUserId)
            ===
            Number(currentUser.userId);

        leaveMeetingButton.hidden =
            !currentParticipant
            ||
            currentUserIsHost;

        const maxParticipants =
            Number(
                meeting.maxParticipants
                ||
                0
            );

        participantSummary.textContent =
            maxParticipants > 0
                ? "현재 인원 "
                + participants.length
                + " / "
                + maxParticipants
                + "명"
                : "현재 인원 "
                + participants.length
                + "명";

        participantList.replaceChildren();

        participants.forEach(
            participant =>
            {
                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "participant-item";

                const host =
                    Number(participant.userId)
                    ===
                    Number(meeting.hostUserId);

                const me =
                    Number(participant.userId)
                    ===
                    Number(currentUser.userId);

                const canKick =
                    currentUserIsHost
                    &&
                    !host
                    &&
                    !me;

                const nickname =
                    participant.nickname
                    ||
                    "참가자";

                item.innerHTML =
                    `
            <span class="participant-name">
                ${host ? "👑 " : ""}
                ${MeetBack.escapeHtml(nickname)}
                ${me ? " (나)" : ""}
            </span>

            <span class="
                presence-badge
                ${participant.online ? "online" : "offline"}
            ">
                ${participant.online ? "● ON" : "● OFF"}
            </span>

            ${
                        canKick
                            ? `
                        <button
                                type="button"
                                class="participant-kick-button">
                            강퇴
                        </button>
                    `
                            : ""
                    }
            `;

                const kickButton =
                    item.querySelector(
                        ".participant-kick-button"
                    );

                if (kickButton)
                {
                    kickButton.addEventListener(
                        "click",
                        () =>
                        {
                            requestKick(
                                participant.participantId,
                                nickname
                            );
                        }
                    );
                }

                participantList.appendChild(
                    item
                );
            }
        );
    }

    async function loadKickedParticipants()
    {
        const currentUserIsHost =
            meeting
            &&
            currentUser
            &&
            Number(meeting.hostUserId)
            ===
            Number(currentUser.userId);

        if (!currentUserIsHost)
        {
            kickedParticipantSection.hidden =
                true;

            kickedParticipantList.replaceChildren();

            return;
        }

        const response =
            await MeetBack.authenticatedFetch(
                "/participants/meeting/"
                +
                meetingId
                +
                "/kicked",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

        if (!response.ok)
        {
            kickedParticipantSection.hidden =
                true;

            return;
        }

        const kickedParticipants =
            await response.json();

        kickedParticipantList.replaceChildren();

        if (
            !Array.isArray(kickedParticipants)
            ||
            kickedParticipants.length === 0
        )
        {
            kickedParticipantSection.hidden =
                true;

            return;
        }

        kickedParticipantSection.hidden =
            false;

        kickedParticipants.forEach(
            participant =>
            {
                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "participant-item";

                const nickname =
                    participant.nickname
                    ||
                    "참가자";

                item.innerHTML =
                    `
                <span class="participant-name">
                    ${MeetBack.escapeHtml(nickname)}
                </span>

                <span class="kicked-participant-badge">
                    강퇴됨
                </span>

                <button
                        type="button"
                        class="participant-kick-cancel-button">

                    강퇴 취소

                </button>
                `;

                item.querySelector(
                    ".participant-kick-cancel-button"
                ).addEventListener(
                    "click",
                    () =>
                    {
                        requestCancelKick(
                            participant.participantId,
                            nickname
                        );
                    }
                );

                kickedParticipantList.appendChild(
                    item
                );
            }
        );
    }


    async function requestKick(
        participantId,
        nickname
    )
    {
        if (
            !confirm(
                nickname
                +
                "님을 강퇴하시겠습니까?"
            )
        )
        {
            return;
        }

        const response =
            await MeetBack.authenticatedFetch(
                "/participants/"
                +
                participantId
                +
                "/kick",
                {
                    method:
                        "DELETE"
                }
            );

        if (!response.ok)
        {
            showMessage(
                "참가자 강퇴에 실패했습니다."
            );

            return;
        }

        await loadParticipants();

        await loadKickedParticipants();
    }


    async function requestCancelKick(
        participantId,
        nickname
    )
    {
        if (
            !confirm(
                nickname
                +
                "님의 강퇴를 취소하시겠습니까?"
            )
        )
        {
            return;
        }

        const response =
            await MeetBack.authenticatedFetch(
                "/participants/"
                +
                participantId
                +
                "/kick/cancel",
                {
                    method:
                        "PATCH"
                }
            );

        if (!response.ok)
        {
            showMessage(
                "강퇴 취소에 실패했습니다."
            );

        }

        await loadParticipants();

        await loadKickedParticipants();
    }


    function showKickModal()
    {
        const modal =
            document.getElementById(
                "kickModal"
            );

        modal.classList.add(
            "show"
        );

        modal.setAttribute(
            "aria-hidden",
            "false"
        );

        document.body.style.overflow =
            "hidden";
    }

    // =========================================================
    // 채팅 메시지 화면 추가
    // =========================================================

    function addChatMessage(
        chatMessage
    )
    {
        const area =
            document.getElementById(
                "chatMessages"
            );

        const row =
            document.createElement(
                "div"
            );

        if (chatMessage.messageType === "SYSTEM")
        {
            row.className =
                "chat-message system";

            row.textContent =
                "📢 "
                +
                (
                    chatMessage.content
                    ||
                    ""
                );
        }
        else
        {
            row.className =
                "chat-message";

            const nickname =
                document.createElement(
                    "strong"
                );

            nickname.textContent =
                chatMessage.nickname
                ||
                "참가자";

            const content =
                document.createElement(
                    "span"
                );

            content.textContent =
                " : "
                +
                (
                    chatMessage.content
                    ||
                    ""
                );

            row.appendChild(
                nickname
            );

            row.appendChild(
                content
            );
        }

        area.appendChild(
            row
        );

        area.scrollTop =
            area.scrollHeight;
    }


    // =========================================================
    // 기존 채팅 내역 조회
    // =========================================================

    async function loadChatHistory()
    {
        const response =
            await MeetBack.authenticatedFetch(
                "/meetings/"
                +
                meetingId
                +
                "/messages"
            );

        if (!response.ok)
        {
            throw new Error(
                "채팅 내역을 불러오지 못했습니다."
            );
        }

        const messages =
            await response.json();

        const area =
            document.getElementById(
                "chatMessages"
            );

        area.replaceChildren();

        messages.forEach(
            chatMessage =>
                addChatMessage(
                    chatMessage
                )
        );
    }

    async function handleRoomSessionReplaced()
    {
        if (roomSessionReplaced)
        {
            return;
        }

        roomSessionReplaced =
            true;

        const modal =
            document.getElementById(
                "kickModal"
            );

        const title =
            modal?.querySelector(
                ".kick-modal-title"
            );

        if (title)
        {
            title.textContent =
                "다른 탭에서 이 모임을 열었습니다.";
        }

        if (modal)
        {
            modal.classList.add(
                "show"
            );

            modal.setAttribute(
                "aria-hidden",
                "false"
            );
        }

        const chatInput =
            document.getElementById(
                "chatInput"
            );

        if (chatInput)
        {
            chatInput.disabled =
                true;
        }

        if (stompClient)
        {
            stompClient.reconnectDelay =
                0;

            await stompClient.deactivate();
        }

        setTimeout(
            () =>
            {
                location.replace(
                    "/home"
                );
            },
            2500
        );
    }


    // =========================================================
    // WebSocket 연결
    // =========================================================

    function connectChat()
    {
        const protocol =
            location.protocol === "https:"
                ? "wss"
                : "ws";

        stompClient =
            new StompJs.Client({

                brokerURL:
                    protocol
                    +
                    "://"
                    +
                    location.host
                    +
                    "/ws",

                connectHeaders: {
                    "Authorization":
                        "Bearer "
                        +
                        MeetBack.getAccessToken()
                },

                reconnectDelay:
                    5000,

                onConnect:
                    async function()
                    {
                        document.getElementById(
                            "chatStatus"
                        ).textContent =
                            "CONNECTED";

                        const destination =
                            "/topic/meetings/"
                            +
                            meetingId
                            +
                            "/chat";

                        const receiptId =
                            "quick-fixed-"
                            +
                            meetingId
                            +
                            "-"
                            +
                            Date.now();

                        stompClient.watchForReceipt(
                            receiptId,
                            async function()
                            {
                                await loadParticipants();
                                await loadKickedParticipants();
                            }
                        );

                        stompClient.subscribe(
                            destination,
                            async frame =>
                            {
                                const data =
                                    JSON.parse(
                                        frame.body
                                    );

                                if(
                                    data.messageType === "EVENT"
                                    &&
                                    data.eventType === "ROOM_SESSION_REPLACED"
                                    &&
                                    Number(data.userId)
                                        === Number(currentUser.userId)
                                    &&
                                    data.activeTabId !== roomTabId
                                )
                                {
                                    await handleRoomSessionReplaced();

                                    return;
                                }

                                if (
                                    data.messageType === "CHAT"
                                    ||
                                    data.messageType === "SYSTEM"
                                )
                                {
                                    addChatMessage(
                                        data
                                    );
                                }

                                if (
                                    data.messageType === "EVENT"
                                    &&
                                    data.eventType === "PARTICIPANT_KICKED"
                                )
                                {
                                    const kickedMe =
                                        Number(data.userId)
                                        ===
                                        Number(currentUser.userId);

                                    if (kickedMe)
                                    {
                                        showKickModal();

                                        if (stompClient)
                                        {
                                            stompClient.reconnectDelay =
                                                0;

                                            stompClient
                                                .deactivate()
                                                .catch(
                                                    error =>
                                                        console.error(
                                                            "WebSocket 종료 실패:",
                                                            error
                                                        )
                                                );
                                        }

                                        setTimeout(
                                            () =>
                                            {
                                                location.replace(
                                                    "/home"
                                                );
                                            },
                                            2000
                                        );

                                        return;
                                    }

                                    await loadParticipants();

                                    await loadKickedParticipants();

                                    return;
                                }

                                if (
                                    data.messageType === "EVENT"
                                    &&
                                    data.eventType === "PARTICIPANT_KICK_CANCELED"
                                )
                                {
                                    await loadParticipants();

                                    await loadKickedParticipants();

                                    return;
                                }

                                if (
                                    data.eventType === "PRESENCE_UPDATED"
                                    ||
                                    data.eventType === "PARTICIPANT_JOINED"
                                    ||
                                    data.eventType === "PARTICIPANT_LEFT"
                                )
                                {
                                    await loadParticipants();
                                }

                                if (
                                    data.eventType === "RECRUITMENT_CLOSED"
                                )
                                {
                                    await loadMeeting();
                                }
                                if (
                                    data.eventType
                                    ===
                                    "RECRUITMENT_CLOSED"
                                )
                                {
                                    await loadMeeting();
                                }
                            },
                            {
                                receipt:
                                receiptId,

                                "x-room-tab-id":
                                roomTabId
                            }
                        );

                        await loadChatHistory();
                    },

                onWebSocketClose:
                    function()
                    {
                        document.getElementById(
                            "chatStatus"
                        ).textContent =
                            "DISCONNECTED";
                    },

                onStompError:
                    function(frame)
                    {
                        console.error(
                            "[QUICK FIXED STOMP ERROR]",
                            frame
                        );
                    }
            });

        stompClient.activate();
    }


    // =========================================================
    // 채팅 전송
    // =========================================================

    function sendChat()
    {
        const input =
            document.getElementById(
                "chatInput"
            );

        const content =
            input.value.trim();

        if (!content)
        {
            return;
        }

        if (
            !stompClient
            ||
            !stompClient.connected
        )
        {
            showMessage(
                "채팅 서버에 연결 중입니다."
            );

            return;
        }

        stompClient.publish({

            destination:
                "/app/meetings/"
                +
                meetingId
                +
                "/chat",

            body:
                JSON.stringify({
                    content:
                    content
                })
        });

        input.value =
            "";
    }

    async function closeRecruitment()
    {
        const confirmed =
            confirm(
                "참가 모집을 마감하시겠습니까?\n"
                +
                "마감 후에는 새로운 참가자와 나간 참가자가 다시 들어올 수 없습니다."
            );

        if (!confirmed)
        {
            return;
        }

        closeRecruitmentButton.disabled =
            true;

        try
        {
            const response =
                await MeetBack.authenticatedFetch(
                    "/meetings/"
                    +
                    meetingId
                    +
                    "/recruitment/close",
                    {
                        method:
                            "PATCH"
                    }
                );

            if (!response.ok)
            {
                let errorMessage =
                    "참가 모집을 마감하지 못했습니다.";

                try
                {
                    const errorBody =
                        await response.json();

                    errorMessage =
                        errorBody.message
                        ||
                        errorMessage;
                }
                catch (error)
                {
                    // JSON 응답이 아니면 기본 문구 사용
                }

                throw new Error(
                    errorMessage
                );
            }

            await loadMeeting();
        }
        catch (error)
        {
            showMessage(
                error.message
                ||
                "참가 모집 마감 중 오류가 발생했습니다."
            );

            updateRecruitmentButton();
        }
    }

    async function leaveMeeting()
    {
        if (!currentParticipant)
        {
            showMessage(
                "현재 참가자 정보를 확인할 수 없습니다."
            );

            return;
        }

        const confirmed =
            confirm(
                "정말 이 모임에서 나가시겠습니까?"
            );

        if (!confirmed)
        {
            return;
        }

        leaveMeetingButton.disabled =
            true;

        try
        {
            const response =
                await MeetBack.authenticatedFetch(
                    "/participants/"
                    +
                    currentParticipant.participantId
                    +
                    "/leave",
                    {
                        method:
                            "DELETE"
                    }
                );

            if (!response.ok)
            {
                let errorMessage =
                    "모임에서 나가지 못했습니다.";

                try
                {
                    const errorBody =
                        await response.json();

                    errorMessage =
                        errorBody.message
                        ||
                        errorMessage;
                }
                catch (error)
                {
                    // 응답 본문이 JSON이 아니면 기본 문구 사용
                }

                throw new Error(
                    errorMessage
                );
            }

            if (
                stompClient
                &&
                stompClient.active
            )
            {
                await stompClient.deactivate();
            }

            location.href =
                "/home";
        }
        catch (error)
        {
            showMessage(
                error.message
                ||
                "모임에서 나가는 중 오류가 발생했습니다."
            );

            leaveMeetingButton.disabled =
                false;
        }
    }


    // =========================================================
    // 초기화
    // =========================================================

    async function initialize()
    {

        currentUser =
            await MeetBack.checkLogin();


        if (!currentUser)
        {
            return;
        }


        meetingId =
            MeetBack.getMeetingId();


        if (!meetingId)
        {

            showMessage(
                "모임 ID를 확인할 수 없습니다."
            );


            return;
        }

        try
        {

            await loadMeeting();

            await loadFixedPlace();

            await loadParticipants();

            await loadKickedParticipants();

            connectChat();

        }
        catch (error)
        {

            console.error(
                "[QUICK FIXED INITIALIZE ERROR]",
                error
            );

            showMessage(
                error.message
                ||
                "고정 번개방을 불러오는 중 오류가 발생했습니다."
            );
        }
    }



    // =========================================================
    // 실행
    // =========================================================

    initialize();

</script>
