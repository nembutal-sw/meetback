    // =========================================================
    // 모임 정보 조회
    // =========================================================

    async function loadMeeting()
    {
        const response =
            await MeetBack.authenticatedFetch(
                "/meetings/"
                +
                meetingId
            );


        if (!response.ok)
        {
            throw new Error(
                "모임 정보를 불러오지 못했습니다."
            );
        }


        const data =
            await response.json();


        if (
            data.meetingType
            !==
            "QUICK_FIXED"
        )
        {
            throw new Error(
                "고정 번개방이 아닙니다."
            );
        }


        meeting =
            data;


        meetingTitle.textContent =
            data.title
            ||
            "제목 없는 모임";


        meetingStartAt.textContent =
            MeetBack.formatDateTime(
                data.meetingStartAt
            );


        desiredEndAt.textContent =
            MeetBack.formatDateTime(
                data.desiredEndAt
            );


        inviteCode.textContent =
            data.inviteCode
            ||
            "-";


        inviteCodeButton.disabled =
            !data.inviteCode;

        updateRecruitmentButton();
    }


    // =========================================================
    // 고정 장소 조회
    // =========================================================

    async function loadFixedPlace()
    {
        const response =
            await MeetBack.authenticatedFetch(
                "/participants/meeting/"
                +
                meetingId
                +
                "/candidates"
            );


        if (!response.ok)
        {
            throw new Error(
                "모임 장소를 불러오지 못했습니다."
            );
        }


        const candidates =
            await response.json();


        if (
            !Array.isArray(
                candidates
            )
        )
        {
            throw new Error(
                "모임 장소 정보가 올바르지 않습니다."
            );
        }


        fixedPlace =
            candidates.find(
                candidate =>
                    Number(
                        candidate.candidateId
                    )
                    ===
                    Number(
                        meeting.finalCandidateId
                    )
            );


        if (!fixedPlace)
        {
            throw new Error(
                "확정된 모임 장소를 찾을 수 없습니다."
            );
        }


        fixedPlaceName.textContent =
            fixedPlace.placeName
            ||
            "장소명 없음";


        fixedPlaceAddress.textContent =
            fixedPlace.address
            ||
            "주소 정보 없음";
    }


    // =========================================================
    // 참가자 목록 조회
    // =========================================================

    async function loadParticipants()
    {
        const response =
            await MeetBack.authenticatedFetch(
                "/participants/meeting/"
                +
                meetingId,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

        if (!response.ok)
        {
            throw new Error(
                "참가자 목록을 불러오지 못했습니다."
            );
        }

        const participants =
            await response.json();

        if (!Array.isArray(participants))
        {
            throw new Error(
                "참가자 목록 형식이 올바르지 않습니다."
            );
        }

        currentParticipant =
            participants.find(
                participant =>
                    Number(participant.userId)
                    ===
                    Number(currentUser.userId)
            )
            ||
            null;

        const currentUserIsHost =
            Number(meeting.hostUserId)
            ===
            Number(currentUser.userId);

        leaveMeetingButton.hidden =
            !currentParticipant
            ||
            currentUserIsHost;

        const maxParticipants =
            Number(
                meeting.maxParticipants
                ||
                0
            );

        participantSummary.textContent =
            maxParticipants > 0
                ? "현재 인원 "
                + participants.length
                + " / "
                + maxParticipants
                + "명"
                : "현재 인원 "
                + participants.length
                + "명";

        participantList.replaceChildren();

        participants.forEach(
            participant =>
            {
                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "participant-item";

                const host =
                    Number(participant.userId)
                    ===
                    Number(meeting.hostUserId);

                const me =
                    Number(participant.userId)
                    ===
                    Number(currentUser.userId);

                const canKick =
                    currentUserIsHost
                    &&
                    !host
                    &&
                    !me;

                const nickname =
                    participant.nickname
                    ||
                    "참가자";

                item.innerHTML =
                    `
                    <span class="participant-name">
                        ${host ? "👑 " : ""}
                        ${MeetBack.escapeHtml(nickname)}
                        ${me ? " (나)" : ""}
                    </span>

                    <span class="
                        presence-badge
                        ${participant.online ? "online" : "offline"}
                    ">
                        ${participant.online ? "● ON" : "● OFF"}
                    </span>

            ${
                        canKick
                            ? `
                        <button
                                type="button"
                                class="participant-kick-button">
                            강퇴
                        </button>
                    `
                            : ""
                    }
            `;

                const kickButton =
                    item.querySelector(
                        ".participant-kick-button"
                    );

                if (kickButton)
                {
                    kickButton.addEventListener(
                        "click",
                        () =>
                        {
                            requestKick(
                                participant.participantId,
                                nickname
                            );
                        }
                    );
                }

                participantList.appendChild(
                    item
                );
            }
        );
    }


    // =========================================================
    // 강퇴 참가자 조회
    // =========================================================

    async function loadKickedParticipants()
    {
        const currentUserIsHost =
            meeting
            &&
            currentUser
            &&
            Number(meeting.hostUserId)
            ===
            Number(currentUser.userId);

        if (!currentUserIsHost)
        {
            kickedParticipantSection.hidden =
                true;

            kickedParticipantList.replaceChildren();

            return;
        }

        const response =
            await MeetBack.authenticatedFetch(
                "/participants/meeting/"
                +
                meetingId
                +
                "/kicked",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

        if (!response.ok)
        {
            kickedParticipantSection.hidden =
                true;

            return;
        }

        const kickedParticipants =
            await response.json();

        kickedParticipantList.replaceChildren();

        if (
            !Array.isArray(kickedParticipants)
            ||
            kickedParticipants.length === 0
        )
        {
            kickedParticipantSection.hidden =
                true;

            return;
        }

        kickedParticipantSection.hidden =
            false;

        kickedParticipants.forEach(
            participant =>
            {
                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "participant-item";

                const nickname =
                    participant.nickname
                    ||
                    "참가자";

                item.innerHTML =
                    `
                    <span class="participant-name">
                        ${MeetBack.escapeHtml(nickname)}
                    </span>

                    <span class="kicked-participant-badge">
                        강퇴됨
                    </span>

                    <button
                            type="button"
                            class="participant-kick-cancel-button">

                        강퇴 취소

                    </button>
                    `;

                item.querySelector(
                    ".participant-kick-cancel-button"
                ).addEventListener(
                    "click",
                    () =>
                    {
                        requestCancelKick(
                            participant.participantId,
                            nickname
                        );
                    }
                );

                kickedParticipantList.appendChild(
                    item
                );
            }
        );
    }


    // =========================================================
    // 강퇴
    // =========================================================

    async function requestKick(
        participantId,
        nickname
    )
    {
        if (
            !confirm(
                nickname
                +
                "님을 강퇴하시겠습니까?"
            )
        )
        {
            return;
        }

        const response =
            await MeetBack.authenticatedFetch(
                "/participants/"
                +
                participantId
                +
                "/kick",
                {
                    method:
                        "DELETE"
                }
            );

        if (!response.ok)
        {
            showMessage(
                "참가자 강퇴에 실패했습니다."
            );

            return;
        }

        await loadParticipants();

        await loadKickedParticipants();
    }


    // =========================================================
    // 강퇴 취소
    // =========================================================

    async function requestCancelKick(
        participantId,
        nickname
    )
    {
        if (
            !confirm(
                nickname
                +
                "님의 강퇴를 취소하시겠습니까?"
            )
        )
        {
            return;
        }

        const response =
            await MeetBack.authenticatedFetch(
                "/participants/"
                +
                participantId
                +
                "/kick/cancel",
                {
                    method:
                        "PATCH"
                }
            );

        if (!response.ok)
        {
            showMessage(
                "강퇴 취소에 실패했습니다."
            );

            return;
        }

        await loadParticipants();

        await loadKickedParticipants();
    }


    // =========================================================
    // 강퇴 모달
    // =========================================================

    function showKickModal()
    {
        const modal =
            document.getElementById(
                "kickModal"
            );

        modal.classList.add(
            "show"
        );

        modal.setAttribute(
            "aria-hidden",
            "false"
        );

        document.body.style.overflow =
            "hidden";
    }

    // =========================================================
    // 채팅 메시지 화면 추가
    // =========================================================

    function addChatMessage(
        chatMessage
    )
    {
        const area =
            document.getElementById(
                "chatMessages"
            );

        const row =
            document.createElement(
                "div"
            );

        if (chatMessage.messageType === "SYSTEM")
        {
            row.className =
                "chat-message system";

            row.textContent =
                "📢 "
                +
                (
                    chatMessage.content
                    ||
                    ""
                );
        }
        else
        {
            row.className =
                "chat-message";

            const nickname =
                document.createElement(
                    "strong"
                );

            nickname.textContent =
                chatMessage.nickname
                ||
                "참가자";

            const content =
                document.createElement(
                    "span"
                );

            content.textContent =
                " : "
                +
                (
                    chatMessage.content
                    ||
                    ""
                );

            row.appendChild(
                nickname
            );

            row.appendChild(
                content
            );
        }

        area.appendChild(
            row
        );

        area.scrollTop =
            area.scrollHeight;
    }


    // =========================================================
    // 기존 채팅 내역
    // =========================================================

    async function loadChatHistory()
    {
        const response =
            await MeetBack.authenticatedFetch(
                "/meetings/"
                +
                meetingId
                +
                "/messages"
            );

        if (!response.ok)
        {
            throw new Error(
                "채팅 내역을 불러오지 못했습니다."
            );
        }

        const messages =
            await response.json();

        const area =
            document.getElementById(
                "chatMessages"
            );

        area.replaceChildren();

        messages.forEach(
            chatMessage =>
                addChatMessage(
                    chatMessage
                )
        );
    }

    async function handleRoomSessionReplaced()
    {
        if (roomSessionReplaced)
        {
            return;
        }

        roomSessionReplaced =
            true;

        const modal =
            document.getElementById(
                "kickModal"
            );

        const title =
            modal?.querySelector(
                ".kick-modal-title"
            );

        if (title)
        {
            title.textContent =
                "다른 탭에서 이 모임을 열었습니다.";
        }

        if (modal)
        {
            modal.classList.add(
                "show"
            );

            modal.setAttribute(
                "aria-hidden",
                "false"
            );
        }

        const chatInput =
            document.getElementById(
                "chatInput"
            );

        if (chatInput)
        {
            chatInput.disabled =
                true;
        }

        if (stompClient)
        {
            stompClient.reconnectDelay =
                0;

            await stompClient.deactivate();
        }

        setTimeout(
            () =>
            {
                location.replace(
                    "/home"
                );
            },
            2500
        );
    }


    // =========================================================
    // WebSocket 연결
    // =========================================================

    function connectChat()
    {
        const protocol =
            location.protocol === "https:"
                ? "wss"
                : "ws";

        stompClient =
            new StompJs.Client({

                brokerURL:
                    protocol
                    +
                    "://"
                    +
                    location.host
                    +
                    "/ws",

                connectHeaders: {
                    "Authorization":
                        "Bearer "
                        +
                        MeetBack.getAccessToken()
                },

                reconnectDelay:
                    5000,

                onConnect:
                    async function()
                    {
                        document.getElementById(
                            "chatStatus"
                        ).textContent =
                            "CONNECTED";

                        const destination =
                            "/topic/meetings/"
                            +
                            meetingId
                            +
                            "/chat";

                        const receiptId =
                            "quick-fixed-"
                            +
                            meetingId
                            +
                            "-"
                            +
                            Date.now();

                        stompClient.watchForReceipt(
                            receiptId,
                            async function()
                            {
                                await loadParticipants();
                                await loadKickedParticipants();
                            }
                        );

                        stompClient.subscribe(
                            destination,
                            async frame =>
                            {
                                const data =
                                    JSON.parse(
                                        frame.body
                                    );

                                if(
                                    data.messageType === "EVENT"
                                    &&
                                    data.eventType === "ROOM_SESSION_REPLACED"
                                    &&
                                    Number(data.userId)
                                        === Number(currentUser.userId)
                                    &&
                                    data.activeTabId !== roomTabId
                                )
                                {
                                    await handleRoomSessionReplaced();

                                    return;
                                }

                                if (
                                    data.messageType === "CHAT"
                                    ||
                                    data.messageType === "SYSTEM"
                                )
                                {
                                    addChatMessage(
                                        data
                                    );
                                }

                                if (
                                    data.messageType === "EVENT"
                                    &&
                                    data.eventType === "PARTICIPANT_KICKED"
                                )
                                {
                                    const kickedMe =
                                        Number(data.userId)
                                        ===
                                        Number(currentUser.userId);

                                    if (kickedMe)
                                    {
                                        showKickModal();

                                        if (stompClient)
                                        {
                                            stompClient.reconnectDelay =
                                                0;

                                            stompClient
                                                .deactivate()
                                                .catch(
                                                    error =>
                                                        console.error(
                                                            "WebSocket 종료 실패:",
                                                            error
                                                        )
                                                );
                                        }

                                        setTimeout(
                                            () =>
                                            {
                                                location.replace(
                                                    "/home"
                                                );
                                            },
                                            2000
                                        );

                                        return;
                                    }

                                    await loadParticipants();

                                    await loadKickedParticipants();

                                    return;
                                }

                                if (
                                    data.messageType === "EVENT"
                                    &&
                                    data.eventType === "PARTICIPANT_KICK_CANCELED"
                                )
                                {
                                    await loadParticipants();

                                    await loadKickedParticipants();

                                    return;
                                }

                                if (
                                    data.eventType === "PRESENCE_UPDATED"
                                    ||
                                    data.eventType === "PARTICIPANT_JOINED"
                                    ||
                                    data.eventType === "PARTICIPANT_LEFT"
                                )
                                {
                                    await loadParticipants();
                                }

                                if (
                                    data.eventType === "RECRUITMENT_CLOSED"
                                )
                                {
                                    await loadMeeting();
                                }
                                if (
                                    data.eventType
                                    ===
                                    "RECRUITMENT_CLOSED"
                                )
                                {
                                    await loadMeeting();
                                }
                            },
                            {
                                receipt:
                                receiptId,

                                "x-room-tab-id":
                                roomTabId
                            }
                        );

                        await loadChatHistory();
                    },

                onWebSocketClose:
                    function()
                    {
                        document.getElementById(
                            "chatStatus"
                        ).textContent =
                            "DISCONNECTED";
                    },

                onStompError:
                    function(frame)
                    {
                        console.error(
                            "[QUICK FIXED STOMP ERROR]",
                            frame
                        );
                    }
            });

        stompClient.activate();
    }


    // =========================================================
    // 채팅 전송
    // =========================================================

    function sendChat()
    {
        const input =
            document.getElementById(
                "chatInput"
            );

        const content =
            input.value.trim();

        if (!content)
        {
            return;
        }

        if (
            !stompClient
            ||
            !stompClient.connected
        )
        {
            showMessage(
                "채팅 서버에 연결 중입니다."
            );

            return;
        }

        stompClient.publish({

            destination:
                "/app/meetings/"
                +
                meetingId
                +
                "/chat",

            body:
                JSON.stringify({
                    content:
                    content
                })
        });

        input.value =
            "";
    }

    async function closeRecruitment()
    {
        const confirmed =
            confirm(
                "참가 모집을 마감하시겠습니까?\n"
                +
                "마감 후에는 새로운 참가자와 나간 참가자가 다시 들어올 수 없습니다."
            );

        if (!confirmed)
        {
            return;
        }

        closeRecruitmentButton.disabled =
            true;

        try
        {
            const response =
                await MeetBack.authenticatedFetch(
                    "/meetings/"
                    +
                    meetingId
                    +
                    "/recruitment/close",
                    {
                        method:
                            "PATCH"
                    }
                );

            if (!response.ok)
            {
                let errorMessage =
                    "참가 모집을 마감하지 못했습니다.";

                try
                {
                    const errorBody =
                        await response.json();

                    errorMessage =
                        errorBody.message
                        ||
                        errorMessage;
                }
                catch (error)
                {
                }

                throw new Error(
                    errorMessage
                );
            }

            await loadMeeting();
        }
        catch (error)
        {
            showMessage(
                error.message
                ||
                "참가 모집 마감 중 오류가 발생했습니다."
            );

            updateRecruitmentButton();
        }
    }


    // =========================================================
    // 방 나가기
    // =========================================================

    async function leaveMeeting()
    {
        if (!currentParticipant)
        {
            showMessage(
                "현재 참가자 정보를 확인할 수 없습니다."
            );

            return;
        }

        const confirmed =
            confirm(
                "정말 이 모임에서 나가시겠습니까?"
            );

        if (!confirmed)
        {
            return;
        }

        leaveMeetingButton.disabled =
            true;

        try
        {
            const response =
                await MeetBack.authenticatedFetch(
                    "/participants/"
                    +
                    currentParticipant.participantId
                    +
                    "/leave",
                    {
                        method:
                            "DELETE"
                    }
                );

            if (!response.ok)
            {
                let errorMessage =
                    "모임에서 나가지 못했습니다.";

                try
                {
                    const errorBody =
                        await response.json();

                    errorMessage =
                        errorBody.message
                        ||
                        errorMessage;
                }
                catch (error)
                {
                    // 응답 본문이 JSON이 아니면 기본 문구 사용
                }

                throw new Error(
                    errorMessage
                );
            }

            if (
                stompClient
                &&
                stompClient.active
            )
            {
                await stompClient.deactivate();
            }

            location.href =
                "/home";
        }
        catch (error)
        {
            showMessage(
                error.message
                ||
                "모임에서 나가는 중 오류가 발생했습니다."
            );

            leaveMeetingButton.disabled =
                false;
        }
    }


    // =========================================================
    // 초기화
    // =========================================================

    async function initialize()
    {
        currentUser =
            await MeetBack.checkLogin();


        if (!currentUser)
        {
            return;
        }


        meetingId =
            MeetBack.getMeetingId();


        if (!meetingId)
        {
            showMessage(
                "모임 ID를 확인할 수 없습니다."
            );

            return;
        }

        try
        {
            await loadMeeting();

            await loadFixedPlace();

            await loadParticipants();

            await loadKickedParticipants();


            /*
             * sessionStorage 결과가 있으면 재사용.
             *
             * 없거나 사용할 수 없는 경우
             * DB의 현재 귀가지 기준으로
             * /return-check를 호출한다.
             */
            await loadSavedReturnPreview();


            connectChat();
        }
        catch (error)
        {
            console.error(
                "[QUICK FIXED INITIALIZE ERROR]",
                error
            );

            showMessage(
                error.message
                ||
                "고정 번개방을 불러오는 중 오류가 발생했습니다."
            );
        }
    }


    // =========================================================
    // 실행
    // =========================================================

    initialize();

</script>
