<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MeetBack 최종 결과</title>

    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet"
          href="/css/meeting-result.css">

    <script
            src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js">
    </script>

    <script src="/js/meeting-common.js"></script>

    <script src="/js/meeting-presence.js"></script>

    <script src="/js/meeting-session-header.js"></script>

    <script src="/js/auth-session-guard.js" defer></script>


    <!-- =========================================================
         NAVER MAP
         ========================================================= -->
    <script
            th:src="|https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${naverMapsClientId}|">
    </script>


    <!-- =========================================================
         지도 UI
         ========================================================= -->
    <style>

        .participant-result-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .route-map-button {
            padding: 8px 14px;

            border: 1px solid #dcd7ff;
            border-radius: 10px;

            background: #ffffff;

            color: #6557f6;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            transition:
                    background 0.15s ease,
                    border-color 0.15s ease,
                    transform 0.15s ease;
        }


        .route-map-button:hover {
            background: #f1efff;
            border-color: #bfb6ff;

            transform: translateY(-1px);
        }


        .walking-route-label {
            padding: 7px 11px;

            border-radius: 10px;

            background: #f3f2f8;

            color: #777788;

            font-size: 12px;
            font-weight: 700;
        }


        /* =========================================================
           지도 모달
           ========================================================= */

        .route-map-modal {
            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 30px;

            background: rgba(20, 20, 35, 0.55);

            backdrop-filter: blur(3px);
        }


        .route-map-modal.open {
            display: flex;
        }


        .route-map-modal-content {
            width: min(900px, 100%);

            max-height: 90vh;

            padding: 24px;

            background: #ffffff;

            border-radius: 22px;

            box-shadow:
                    0 24px 70px
                    rgba(30, 25, 70, 0.22);
        }


        .route-map-modal-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }


        .route-map-modal-header h2 {
            margin: 5px 0 0;
        }


        .route-map-close {
            width: 42px;
            height: 42px;

            padding: 0;

            border: none;
            border-radius: 50%;

            background: #f3f2f8;

            color: #55556a;

            font-size: 26px;
            line-height: 1;

            cursor: pointer;
        }


        .route-map-close:hover {
            background: #e9e7f3;
        }


        .route-map {
            display: none;

            width: 100%;
            height: 500px;

            border: 1px solid #e8e7f1;
            border-radius: 16px;

            overflow: hidden;
        }


        .route-map-loading {
            display: flex;

            width: 100%;
            height: 500px;

            align-items: center;
            justify-content: center;

            border: 1px solid #e8e7f1;
            border-radius: 16px;

            background: #f8f8fd;

            color: #777788;
        }


        .route-map-info {
            display: flex;

            gap: 24px;

            margin-top: 16px;

            color: #777788;

            font-size: 14px;
        }


        .route-map-info strong {
            margin-left: 5px;

            color: #191924;
        }


        body.modal-open {
            overflow: hidden;
        }


        @media (max-width: 700px) {

            .participant-result-actions {
                gap: 7px;
            }


            .route-map-button {
                padding: 7px 10px;

                font-size: 12px;
            }


            .route-map-modal {
                padding: 12px;
            }


            .route-map-modal-content {
                padding: 18px;
            }


            .route-map,
            .route-map-loading {
                height: 420px;
            }
        }

    </style>

</head>


<body>

<header class="meeting-session-header">
    <div class="meeting-session-header__inner">
        <a class="mb-brand" href="/home" aria-label="MeetBack 홈">
            <img src="/images/favicon.svg" alt="">
            <span>MeetBack</span>
        </a>

        <div class="meeting-session-header__actions">
            <span class="meeting-session-step">FINAL DESTINATION · RESULT</span>
            <div class="meeting-session-user" aria-label="현재 로그인 사용자">
                <span class="meeting-session-avatar" data-session-avatar>MB</span>
                <span>
                    <strong data-session-nickname>사용자</strong>
                    <small data-session-role>일반 회원</small>
                </span>
            </div>
            <button type="button" class="meeting-session-home" onclick="location.href='/home'">
                홈으로
            </button>
        </div>
    </div>
</header>

<main class="meeting-page meeting-result-page">

<!-- =========================================================
     상단
     ========================================================= -->

<div class="result-header">

    <div>

        <span class="result-label">
            MEETBACK RESULT
        </span>

        <h1>
            모임 장소 결과
        </h1>

        <p id="resultDescription">
            모두의 지하철 막차를 계산한 함께 헤어질 시간입니다.
        </p>

    </div>


    <div class="header-actions">

        <button
                type="button"
                id="whatIfButton"
                class="primary"
                onclick="toggleWhatIf()">

            What-if · 30분 더 놀기

        </button>


        <button
                type="button"
                onclick="goRoom()">

            모임방으로

        </button>

    </div>

</div>



<!-- =========================================================
     최종 장소
     ========================================================= -->

<section class="result-card final-card">

    <div class="section-title">

        <div>

            <span class="section-small">
                FINAL PLACE
            </span>

            <h2>
                최종 선택 장소
            </h2>

        </div>


        <div class="final-header-info">

            <div class="final-desired-end">

                <span>
                    희망 종료시간
                </span>

                <strong id="finalDesiredEndView">
                    -
                </strong>

            </div>


            <span class="final-badge">
                최종 확정
            </span>

        </div>

    </div>


    <div id="finalPlaceArea">

        최종 장소 정보를 불러오는 중...

    </div>

</section>



<!-- =========================================================
     귀가 분석 결과
     ========================================================= -->

<section class="result-card">

    <div class="section-title">

        <div>

            <span
                    id="summaryLabel"
                    class="section-small">

                SUMMARY

            </span>


            <h2 id="summaryTitle">

                귀가 분석 결과

            </h2>

        </div>

    </div>


    <div
            id="summaryArea"
            class="summary-grid">

        분석 결과를 불러오는 중...

    </div>

</section>



<!-- =========================================================
     참가자별 귀가 결과
     ========================================================= -->

<section class="result-card">

    <div class="section-title">

        <div>

            <span
                    id="participantLabel"
                    class="section-small">

                PARTICIPANTS

            </span>


            <h2 id="participantTitle">

                참가자별 귀가 결과

            </h2>

        </div>

    </div>


    <div id="participantResultArea">

        참가자 결과를 불러오는 중...

    </div>

</section>



</main>


<!-- =========================================================
     참가자 귀가 경로 지도 모달
     ========================================================= -->

<div
        id="routeMapModal"
        class="route-map-modal"
        onclick="handleRouteMapBackground(event)">

    <div
            class="route-map-modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="routeMapTitle">

        <div class="route-map-modal-header">

            <div>

                <span class="section-small">
                    RETURN ROUTE
                </span>

                <h2 id="routeMapTitle">
                    귀가 경로
                </h2>

            </div>


            <button
                    type="button"
                    class="route-map-close"
                    onclick="closeRouteMap()">

                ×

            </button>

        </div>


        <div
                id="routeMapLoading"
                class="route-map-loading">

            귀가 경로를 불러오는 중...

        </div>


        <div
                id="routeMap"
                class="route-map">
        </div>


        <div
                id="routeMapInfo"
                class="route-map-info">
        </div>

    </div>

</div>



<!-- =========================================================
     Toast
     ========================================================= -->

<div class="toast-container">

    <div
            id="toastMessage"
            role="status"
            aria-live="polite"
            class="toast">
    </div>

</div>



<script>

    let meetingId = null;

    let currentUser = null;

    let rankings = [];

    let finalCandidate = null;

    let whatIfActive = false;


    let routeMap = null;

    let routePolylines = [];

    let routeMarkers = [];



    async function initialize() {

        currentUser =
            await MeetBack.checkLogin();


        if (!currentUser) {
            return;
        }

        window.MeetBackSessionHeader?.render(
            currentUser
        );


        meetingId =
            MeetBack.getMeetingId();


        if (!meetingId) {

            window.location.href =
                "/home";

            return;
        }


        /*
         * 결과 화면에서도 Presence ON 유지
         */
        MeetBackPresence.connect(
            meetingId
        );


        await loadResult();

    }



    /* =========================================================
       결과 조회
       ========================================================= */

    async function loadResult() {

        /*
         * 1. 모임 정보 조회
         */
        const meetingResponse =
            await MeetBack.authenticatedFetch(
                "/meetings/"
                + meetingId
            );


        if (!meetingResponse.ok) {

            showResultError(
                "모임 정보를 불러오지 못했습니다."
            );

            return;
        }


        const meeting =
            await meetingResponse.json();


        console.log(
            "[RESULT MEETING]",
            meeting
        );


        /*
         * 2. 최종 확정 상태 확인
         */
        if (
            meeting.status
            !== "CONFIRMED"
        ) {

            showResultError(
                "아직 최종 장소가 확정되지 않았습니다."
            );

            return;
        }


        /*
         * 3. 실제 투표 당첨 후보 ID 확인
         */
        if (
            meeting.finalCandidateId === null
            ||
            meeting.finalCandidateId === undefined
        ) {

            showResultError(
                "최종 확정된 장소를 찾을 수 없습니다."
            );

            return;
        }


        /*
         * 4. 계산 / 랭킹 결과 조회
         */
        const rankingResponse =
            await MeetBack.authenticatedFetch(
                "/calculations/meeting/ranking?meetingId="
                + meetingId
            );


        if (!rankingResponse.ok) {

            showResultError(
                "결과를 불러오지 못했습니다."
            );

            return;
        }


        rankings =
            await rankingResponse.json();


        if (
            !rankings
            ||
            rankings.length === 0
        ) {

            showResultError(
                "결과가 없습니다."
            );

            return;
        }


        /*
         * 추천 1위가 아니라
         * 실제 투표로 확정된 후보를 사용
         */
        finalCandidate =
            rankings.find(
                item =>
                    Number(
                        item.candidateId
                    )
                    ===
                    Number(
                        meeting.finalCandidateId
                    )
            );


        if (!finalCandidate) {

            console.error(
                "[FINAL CANDIDATE NOT FOUND]",
                {
                    finalCandidateId:
                    meeting.finalCandidateId,

                    rankings:
                    rankings
                }
            );


            showResultError(
                "최종 장소의 계산 결과를 찾을 수 없습니다."
            );

            return;
        }


        console.log(
            "[FINAL CANDIDATE]",
            finalCandidate
        );


        renderFinalPlace();

        renderSummary();

        renderParticipants();
    }



    /* =========================================================
       결과 조회 오류 공통 처리
       ========================================================= */

    function showResultError(
        message
    ) {

        document.getElementById(
            "finalPlaceArea"
        ).textContent =
            message;


        document.getElementById(
            "summaryArea"
        ).textContent =
            message;


        document.getElementById(
            "participantResultArea"
        ).textContent =
            message;
    }



    /* =========================================================
       최종 장소 출력
       ========================================================= */

    function renderFinalPlace() {

        const area =
            document.getElementById(
                "finalPlaceArea"
            );


        area.innerHTML =
            `
            <div class="final-place-name">

                ${MeetBack.escapeHtml(
                finalCandidate.placeName
                || "장소명 없음"
            )}

            </div>


            <div class="final-place-address">

                ${MeetBack.escapeHtml(
                finalCandidate.address
                || ""
            )}

            </div>
            `;


        const desiredEndView =
            document.getElementById(
                "finalDesiredEndView"
            );


        desiredEndView.textContent =
            formatDateObject(
                getDisplayEndTime()
            );

    }



    /* =========================================================
       원래 희망 종료시간 계산
       ========================================================= */

    function getDesiredEndTime() {

        const directValue =
            finalCandidate.desiredEndAt
            ||
            finalCandidate.desiredEndTime;


        if (directValue) {

            const date =
                new Date(
                    directValue
                );


            if (
                !Number.isNaN(
                    date.getTime()
                )
            ) {

                return date;
            }
        }


        if (
            !finalCandidate.deadlineAt
            ||
            finalCandidate.goldenMarginMinutes === null
            ||
            finalCandidate.goldenMarginMinutes === undefined
        ) {

            return null;
        }


        const deadline =
            new Date(
                finalCandidate.deadlineAt
            );


        const goldenMargin =
            Number(
                finalCandidate.goldenMarginMinutes
            );


        if (
            Number.isNaN(
                deadline.getTime()
            )
            ||
            Number.isNaN(
                goldenMargin
            )
        ) {

            return null;
        }


        return new Date(
            deadline.getTime()
            -
            goldenMargin
            * 60
            * 1000
        );
    }



    /* =========================================================
       화면에 표시할 희망 종료시간
       ========================================================= */

    function getDisplayEndTime() {

        const desiredEndTime =
            getDesiredEndTime();


        if (!desiredEndTime) {

            return null;
        }


        if (!whatIfActive) {

            return new Date(
                desiredEndTime.getTime()
            );
        }


        return new Date(
            desiredEndTime.getTime()
            +
            30
            * 60
            * 1000
        );
    }



    /* =========================================================
       귀가 분석 요약
       ========================================================= */

    function renderSummary() {

        const area =
            document.getElementById(
                "summaryArea"
            );


        const participants =
            finalCandidate.participantResults
            || [];


        let goldenMargin =
            finalCandidate.goldenMarginMinutes;


        let allReturnable =
            finalCandidate.allReturnable;


        if (whatIfActive) {

            if (
                goldenMargin !== null
                &&
                goldenMargin !== undefined
            ) {

                goldenMargin =
                    Number(
                        goldenMargin
                    )
                    - 30;
            }


            if (participants.length > 0) {

                allReturnable =
                    participants.every(
                        participant =>
                            calculateWhatIfCanReturn(
                                participant
                            )
                    );
            }
        }


        const ruleScoreHtml =
            !whatIfActive
                ? `
                    <div class="summary-item">

                        <span>
                            Rule Score
                        </span>

                        <strong>
                            ${
                    finalCandidate.ruleScore == null
                        ? "-"
                        : Number(
                            finalCandidate.ruleScore
                        ).toFixed(1)
                }
                        </strong>

                    </div>
                  `
                : "";


        area.innerHTML =
            `
            <div class="summary-item">

                <span>
                    전체 귀가
                </span>

                <strong>
                    ${
                allReturnable
                    ? "전원 가능"
                    : "일부 불가"
            }
                </strong>

            </div>


            <div class="summary-item">

                <span>
                    Deadline
                </span>

                <strong>
                    ${displayDateTime(
                finalCandidate.deadlineAt
            )}
                </strong>

            </div>


            <div class="summary-item">

                <span>
                    Golden Margin
                </span>

                <strong>
                    ${formatMinutes(
                goldenMargin
            )}
                </strong>

            </div>


            <div class="summary-item">

                <span>
                    평균 귀가시간
                </span>

                <strong>
                    ${
                finalCandidate.averageReturnMinutes == null
                    ? "-"
                    : Math.round(
                        finalCandidate.averageReturnMinutes
                    )
                    + "분"
            }
                </strong>

            </div>


            <div class="summary-item">

                <span>
                    귀가시간 편차
                </span>

                <strong>
                    ${displayValue(
                finalCandidate.fairnessGapMinutes,
                "분"
            )}
                </strong>

            </div>


            ${ruleScoreHtml}
            `;
    }



    /* =========================================================
       참가자별 귀가 결과
       ========================================================= */

    function renderParticipants() {

        const area =
            document.getElementById(
                "participantResultArea"
            );


        const participants =
            finalCandidate.participantResults
            || [];


        if (participants.length === 0) {

            area.textContent =
                "참가자별 결과가 없습니다.";

            return;
        }


        area.innerHTML =
            "";


        participants.forEach(
            participant =>
            {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "participant-result";


                const canReturn =
                    whatIfActive
                        ? calculateWhatIfCanReturn(
                            participant
                        )
                        : participant.canReturn;


                const participantName =
                    participant.nickname
                    || (
                        "참가자 "
                        + participant.participantId
                    );


                /*
                 * 도보 귀가 여부
                 */
                const walking =
                    !participant.lastTrainDepartureAt;


                const routeActionHtml =
                    walking
                        ? `
                            <span class="walking-route-label">
                                도보 귀가
                            </span>
                          `
                        : `
                            <button
                                    type="button"
                                    class="route-map-button">

                                지도로 보기

                            </button>
                          `;


                div.innerHTML =
                    `
                    <div class="participant-result-header">

                        <strong>
                            ${MeetBack.escapeHtml(
                        participantName
                    )}
                        </strong>


                        <div class="participant-result-actions">

                            ${routeActionHtml}


                            <span class="${
                        canReturn
                            ? "possible"
                            : "impossible"
                    }">

                                ${
                        canReturn
                            ? "귀가 가능"
                            : "귀가 불가"
                    }

                            </span>

                        </div>

                    </div>


                    <div class="participant-info-grid">

                        <div>

                            <span>
                                귀가시간
                            </span>

                            <strong>
                                ${displayValue(
                        participant.returnMinutes,
                        "분"
                    )}
                            </strong>

                        </div>


                        <div>

                            <span>
                                환승 횟수
                            </span>

                            <strong>
                                ${displayValue(
                        participant.transferCount,
                        "회"
                    )}
                            </strong>

                        </div>


                        <div>

                            <span>
                                안전 출발 마감
                            </span>

                            <strong>
                                ${displayDateTime(
                        participant.lastSafeDepartureAt
                    )}
                            </strong>

                        </div>


                        <div>

                            <span>
                                막차 출발
                            </span>

                            <strong>
                                ${displayDateTime(
                        participant.lastTrainDepartureAt
                    )}
                            </strong>

                        </div>

                    </div>
                    `;


                if (!walking) {

                    const button =
                        div.querySelector(
                            ".route-map-button"
                        );


                    button.addEventListener(
                        "click",
                        () =>
                        {

                            openRouteMap(
                                finalCandidate.candidateId,
                                participant.participantId,
                                participantName,
                                participant.returnMinutes,
                                participant.transferCount
                            );

                        }
                    );
                }


                area.appendChild(
                    div
                );
            }
        );
    }



    /* =========================================================
       참가자 귀가 경로 지도 열기
       ========================================================= */

    async function openRouteMap(
        candidateId,
        participantId,
        participantName,
        returnMinutes,
        transferCount
    ) {

        const modal =
            document.getElementById(
                "routeMapModal"
            );


        const loading =
            document.getElementById(
                "routeMapLoading"
            );


        const mapElement =
            document.getElementById(
                "routeMap"
            );


        const info =
            document.getElementById(
                "routeMapInfo"
            );


        const title =
            document.getElementById(
                "routeMapTitle"
            );


        modal.classList.add(
            "open"
        );


        document.body.classList.add(
            "modal-open"
        );


        title.textContent =
            participantName
            + " 귀가 경로";


        loading.style.display =
            "flex";


        loading.textContent =
            "귀가 경로를 불러오는 중...";


        mapElement.style.display =
            "none";


        info.innerHTML =
            "";


        try {

            const response =
                await MeetBack.authenticatedFetch(
                    "/api/routes/"
                    + encodeURIComponent(
                        candidateId
                    )
                    + "/"
                    + encodeURIComponent(
                        participantId
                    )
                    + "/map"
                );


            if (!response.ok) {

                let message =
                    "귀가 경로를 불러오지 못했습니다.";


                try {

                    const error =
                        await response.json();


                    if (error.message) {

                        message =
                            error.message;
                    }

                } catch (ignore) {
                }


                throw new Error(
                    message
                );
            }


            const data =
                await response.json();


            if (
                !data.lines
                ||
                data.lines.length === 0
            ) {

                throw new Error(
                    "표시할 경로 좌표가 없습니다."
                );
            }


            loading.style.display =
                "none";


            mapElement.style.display =
                "block";


            info.innerHTML =
                `
                <span>
                    예상 귀가시간
                    <strong>
                        ${
                    returnMinutes == null
                        ? "-"
                        : returnMinutes + "분"
                }
                    </strong>
                </span>


                <span>
                    환승
                    <strong>
                        ${
                    transferCount == null
                        ? "-"
                        : transferCount + "회"
                }
                    </strong>
                </span>
                `;


            setTimeout(
                () =>
                {

                    drawRouteMap(
                        data.lines,
                        data.startName,
                        data.endName
                    );

                },
                100
            );

        } catch (error) {

            console.error(
                "[ROUTE MAP ERROR]",
                error
            );


            mapElement.style.display =
                "none";


            loading.style.display =
                "flex";


            loading.textContent =
                error.message
                ||
                "귀가 경로를 불러오지 못했습니다.";
        }
    }



    /* =========================================================
   지하철 호선별 색상
   ========================================================= */

    function getSubwayLineColor(
        type
    ) {

        const colors = {
            1: "#0052A4",   // 1호선
            2: "#00A84D",   // 2호선
            3: "#EF7C1C",   // 3호선
            4: "#00A5DE",   // 4호선
            5: "#996CAC",   // 5호선
            6: "#CD7C2F",   // 6호선
            7: "#747F00",   // 7호선
            8: "#E6186C",   // 8호선
            9: "#BDB092"    // 9호선
        };


        return colors[type]
            || "#6557f6";
    }



    /* =========================================================
       NAVER MAP 경로 출력
       ========================================================= */

    function drawRouteMap(
        lines,
        startName,
        endName
    ) {

        if (
            typeof naver === "undefined"
            ||
            !naver.maps
        ) {

            const loading =
                document.getElementById(
                    "routeMapLoading"
                );


            document.getElementById(
                "routeMap"
            ).style.display =
                "none";


            loading.style.display =
                "flex";


            loading.textContent =
                "네이버 지도를 불러오지 못했습니다.";


            return;
        }


        /*
         * 모든 호선의 좌표를 합쳐서
         * 지도 범위 / 출발 / 도착 위치 계산에 사용
         */
        const allPoints =
            [];


        lines.forEach(
            line =>
            {

                if (
                    !line.points
                    ||
                    line.points.length === 0
                ) {

                    return;
                }


                line.points.forEach(
                    point =>
                    {

                        allPoints.push(
                            new naver.maps.LatLng(
                                Number(
                                    point.latitude
                                ),
                                Number(
                                    point.longitude
                                )
                            )
                        );

                    }
                );

            }
        );


        if (allPoints.length === 0) {

            return;
        }


        /*
         * 지도 최초 생성
         */
        if (!routeMap) {

            routeMap =
                new naver.maps.Map(
                    "routeMap",
                    {
                        center:
                            allPoints[0],

                        zoom:
                            13
                    }
                );
        }


        /*
         * 모달 내부 지도 크기 재계산
         */
        naver.maps.Event.trigger(
            routeMap,
            "resize"
        );


        /*
         * 이전 호선 경로선 제거
         */
        routePolylines.forEach(
            polyline =>
                polyline.setMap(
                    null
                )
        );


        routePolylines =
            [];


        /*
         * 이전 마커 / 라벨 제거
         */
        routeMarkers.forEach(
            marker =>
                marker.setMap(
                    null
                )
        );


        routeMarkers =
            [];


        /*
         * =============================================
         * 호선별 경로선 생성
         * =============================================
         */
        lines.forEach(
            line =>
            {

                if (
                    !line.points
                    ||
                    line.points.length === 0
                ) {

                    return;
                }


                const linePath =
                    line.points.map(
                        point =>
                            new naver.maps.LatLng(
                                Number(
                                    point.latitude
                                ),
                                Number(
                                    point.longitude
                                )
                            )
                    );


                const polyline =
                    new naver.maps.Polyline(
                        {
                            map:
                            routeMap,

                            path:
                            linePath,

                            strokeColor:
                                getSubwayLineColor(
                                    Number(
                                        line.type
                                    )
                                ),

                            strokeWeight:
                                6,

                            strokeOpacity:
                                0.9,

                            strokeLineCap:
                                "round",

                            strokeLineJoin:
                                "round"
                        }
                    );


                routePolylines.push(
                    polyline
                );

            }
        );


        /*
         * 출발 / 도착 이름
         */
        const displayStartName =
            startName
            || "모임 장소";


        const displayEndName =
            endName
            || "귀가 장소";


        const safeStartName =
            MeetBack.escapeHtml(
                displayStartName
            );


        const safeEndName =
            MeetBack.escapeHtml(
                displayEndName
            );


        /*
         * 출발 마커
         */
        const startMarker =
            new naver.maps.Marker(
                {
                    map:
                    routeMap,

                    position:
                        allPoints[0],

                    title:
                        "출발 · "
                        + displayStartName
                }
            );


        /*
         * 출발 장소 고정 라벨
         */
        const startLabel =
            new naver.maps.Marker(
                {
                    map:
                    routeMap,

                    position:
                        allPoints[0],

                    zIndex:
                        100,

                    icon:
                        {
                            content:
                                `
                            <div style="
                                transform: translate(-50%, -58px);
                                padding: 8px 12px;
                                background: #ffffff;
                                border: 1px solid #6557f6;
                                border-radius: 8px;
                                box-shadow: 0 3px 10px rgba(0,0,0,0.18);
                                color: #191924;
                                font-size: 13px;
                                font-weight: 700;
                                white-space: nowrap;
                                pointer-events: none;
                            ">
                                출발 · ${safeStartName}
                            </div>
                            `
                        }
                }
            );


        /*
         * 도착 마커
         */
        const endMarker =
            new naver.maps.Marker(
                {
                    map:
                    routeMap,

                    position:
                        allPoints[
                        allPoints.length - 1
                            ],

                    title:
                        "도착 · "
                        + displayEndName
                }
            );


        /*
         * 도착 장소 고정 라벨
         */
        const endLabel =
            new naver.maps.Marker(
                {
                    map:
                    routeMap,

                    position:
                        allPoints[
                        allPoints.length - 1
                            ],

                    zIndex:
                        100,

                    icon:
                        {
                            content:
                                `
                            <div style="
                                transform: translate(-50%, -58px);
                                padding: 8px 12px;
                                background: #ffffff;
                                border: 1px solid #6557f6;
                                border-radius: 8px;
                                box-shadow: 0 3px 10px rgba(0,0,0,0.18);
                                color: #191924;
                                font-size: 13px;
                                font-weight: 700;
                                white-space: nowrap;
                                pointer-events: none;
                            ">
                                도착 · ${safeEndName}
                            </div>
                            `
                        }
                }
            );


        /*
         * 다음 참가자 지도 열 때 제거하기 위해 저장
         */
        routeMarkers.push(
            startMarker,
            startLabel,
            endMarker,
            endLabel
        );


        /*
         * 전체 경로가 지도 안에 들어오도록 설정
         */
        const bounds =
            new naver.maps.LatLngBounds();


        allPoints.forEach(
            position =>
            {

                bounds.extend(
                    position
                );

            }
        );


        routeMap.fitBounds(
            bounds
        );
    }



    /* =========================================================
       지도 닫기
       ========================================================= */

    function closeRouteMap() {

        const modal =
            document.getElementById(
                "routeMapModal"
            );


        modal.classList.remove(
            "open"
        );


        document.body.classList.remove(
            "modal-open"
        );
    }



    /* =========================================================
       지도 모달 바깥 영역 클릭
       ========================================================= */

    function handleRouteMapBackground(
        event
    ) {

        if (
            event.target.id
            === "routeMapModal"
        ) {

            closeRouteMap();
        }
    }



    /* =========================================================
       ESC로 지도 닫기
       ========================================================= */

    document.addEventListener(
        "keydown",
        event =>
        {

            if (event.key === "Escape") {

                closeRouteMap();
            }
        }
    );



    /* =========================================================
       What-if 귀가 가능 여부
       ========================================================= */

    function calculateWhatIfCanReturn(
        participant
    ) {

        if (
            !participant.lastSafeDepartureAt
        ) {

            return participant.canReturn;
        }


        const desiredEndTime =
            getDesiredEndTime();


        if (!desiredEndTime) {

            return participant.canReturn;
        }


        const whatIfEndTime =
            new Date(
                desiredEndTime.getTime()
                +
                30
                * 60
                * 1000
            );


        const safeDeparture =
            new Date(
                participant.lastSafeDepartureAt
            );


        if (
            Number.isNaN(
                safeDeparture.getTime()
            )
        ) {

            return participant.canReturn;
        }


        return (
            whatIfEndTime
            <=
            safeDeparture
        );
    }



    /* =========================================================
       What-if 토글
       ========================================================= */

    function toggleWhatIf() {

        if (!finalCandidate) {

            return;
        }


        whatIfActive =
            !whatIfActive;


        const button =
            document.getElementById(
                "whatIfButton"
            );


        const description =
            document.getElementById(
                "resultDescription"
            );


        const summaryLabel =
            document.getElementById(
                "summaryLabel"
            );


        const summaryTitle =
            document.getElementById(
                "summaryTitle"
            );


        const participantLabel =
            document.getElementById(
                "participantLabel"
            );


        const participantTitle =
            document.getElementById(
                "participantTitle"
            );


        if (whatIfActive) {

            button.textContent =
                "기본 귀가 시간 보기";


            description.textContent =
                "희망 종료시간을 30분 늦춘 경우의 귀가 결과입니다.";


            summaryLabel.textContent =
                "WHAT IF · +30 MIN";


            summaryTitle.textContent =
                "30분 후 귀가 분석 결과";


            participantLabel.textContent =
                "PARTICIPANTS · +30 MIN";


            participantTitle.textContent =
                "30분 후 참가자별 귀가 결과";
        }

        else {

            button.textContent =
                "What-if · 30분 더 놀기";


            description.textContent =
                "모두의 지하철 막차를 계산한 함께 헤어질 시간입니다.";


            summaryLabel.textContent =
                "SUMMARY";


            summaryTitle.textContent =
                "귀가 분석 결과";


            participantLabel.textContent =
                "PARTICIPANTS";


            participantTitle.textContent =
                "참가자별 귀가 결과";
        }


        renderFinalPlace();

        renderSummary();

        renderParticipants();
    }



    /* =========================================================
       일반 값
       ========================================================= */

    function displayValue(
        value,
        suffix = ""
    ) {

        if (
            value === null
            ||
            value === undefined
        ) {

            return "-";
        }


        return (
            MeetBack.escapeHtml(
                value
            )
            +
            suffix
        );
    }



    /* =========================================================
       분 → 시간 / 분
       ========================================================= */

    function formatMinutes(
        value
    ) {

        if (
            value === null
            ||
            value === undefined
        ) {

            return "-";
        }


        const totalMinutes =
            Number(
                value
            );


        if (
            Number.isNaN(
                totalMinutes
            )
        ) {

            return "-";
        }


        const roundedMinutes =
            Math.round(
                totalMinutes
            );


        const sign =
            roundedMinutes < 0
                ? "-"
                : "";


        const absoluteMinutes =
            Math.abs(
                roundedMinutes
            );


        const hours =
            Math.floor(
                absoluteMinutes / 60
            );


        const minutes =
            absoluteMinutes % 60;


        if (hours === 0) {

            return (
                sign
                +
                minutes
                +
                "분"
            );
        }


        if (minutes === 0) {

            return (
                sign
                +
                hours
                +
                "시간"
            );
        }


        return (
            sign
            +
            hours
            +
            "시간 "
            +
            minutes
            +
            "분"
        );
    }



    /* =========================================================
       서버 날짜값 출력
       ========================================================= */

    function displayDateTime(
        value
    ) {

        if (!value) {

            return "-";
        }


        return MeetBack.escapeHtml(
            MeetBack.formatDateTime(
                value
            )
        );
    }



    /* =========================================================
       Date 객체 출력
       ========================================================= */

    function formatDateObject(
        date
    ) {

        if (
            !date
            ||
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "-";
        }


        return new Intl.DateTimeFormat(
            "ko-KR",
            {
                year:
                    "numeric",

                month:
                    "numeric",

                day:
                    "numeric",

                hour:
                    "numeric",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hour12:
                    true
            }
        ).format(
            date
        );
    }



    /* =========================================================
       모임방으로
       ========================================================= */

    function goRoom() {

        if (!meetingId) {

            window.location.href =
                "/home";

            return;
        }


        window.location.href =
            "/meeting?meetingId="
            +
            encodeURIComponent(
                meetingId
            );
    }



    initialize();

</script>
