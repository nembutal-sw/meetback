<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MeetBack 최종 결과</title>

    <link
            rel="stylesheet"
            href="/css/meeting-result.css">

    <link rel="stylesheet" href="/css/meetback-theme.css">
    <link rel="stylesheet" href="/css/app-pages.css">
    <link rel="stylesheet" href="/css/route-map.css">
    <script
            src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js">
    </script>

    <script src="/js/meeting-common.js"></script>
    <script src="/js/meeting-presence.js"></script>

    <script
            src="/js/auth-session-guard.js"
            defer>
    </script>

    <script
            th:src="|https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${naverMapsClientId}&submodules=gl|">
    </script>
    <script src="/js/naver-map-theme.js"></script>

    <link rel="stylesheet" href="/css/dark-mode.css">
    <link rel="stylesheet" href="/css/mobile-responsive.css">
    <script src="/js/theme-toggle.js"></script>
</head>


<body class="mb-page mb-app-page mb-map-page page-result">


<!-- =========================================================
     상단
     ========================================================= -->

<div class="result-header">

    <div>

        <span class="result-label">
            MEETBACK RESULT
        </span>

        <h1>
            모임 장소 결과
        </h1>

        <p id="resultDescription">
            최종 장소와 참가자별 귀가 정보를 확인해보세요.
        </p>

    </div>


    <div class="header-actions">

        <button
                type="button"
                id="whatIfButton"
                class="primary"
                onclick="toggleWhatIf()">

            +30분 결과 보기

        </button>


        <button
                type="button"
                onclick="goRoom()">

            모임방으로

        </button>

    </div>

</div>



<!-- =========================================================
     최종 장소
     ========================================================= -->

<section class="result-card final-card">

    <div class="section-title">

        <div>

            <span class="section-small">
                FINAL PLACE
            </span>

            <h2>
                최종 선택 장소
            </h2>

        </div>


        <div class="final-header-info">

            <div class="final-desired-end">

                <span>
                    희망 종료시간
                </span>

                <strong id="finalDesiredEndView">
                    -
                </strong>

            </div>


            <span class="final-badge">
                최종 확정
            </span>

        </div>

    </div>


    <div id="finalPlaceArea">
        최종 장소 정보를 불러오는 중...
    </div>

</section>



<!-- =========================================================
     귀가 분석 결과
     ========================================================= -->

<section class="result-card">

    <div class="section-title">

        <div>

            <span
                    id="summaryLabel"
                    class="section-small">

                SUMMARY

            </span>

            <h2 id="summaryTitle">
                귀가 분석 결과
            </h2>

        </div>

    </div>


    <div
            id="summaryArea"
            class="summary-grid">

        분석 결과를 불러오는 중...

    </div>

</section>



<!-- =========================================================
     참가자 결과
     ========================================================= -->

<section class="result-card">

    <div class="section-title">

        <div>

            <span
                    id="participantLabel"
                    class="section-small">

                PARTICIPANTS

            </span>

            <h2 id="participantTitle">
                참가자별 귀가 결과
            </h2>

        </div>

    </div>


    <div id="participantResultArea">
        참가자 결과를 불러오는 중...
    </div>

</section>



<!-- =========================================================
     귀가 경로 지도
     ========================================================= -->

<div
        id="routeMapModal"
        class="route-map-modal"
        onclick="handleRouteMapBackground(event)">

    <div class="route-map-modal-content">

        <div class="route-map-modal-header">

            <div>

                <span class="section-small">
                    RETURN ROUTE
                </span>

                <h2 id="routeMapTitle">
                    귀가 경로
                </h2>

            </div>


            <button
                    type="button"
                    class="route-map-close"
                    onclick="closeRouteMap()">

                ×

            </button>

        </div>


        <div
                id="routeMapLoading"
                class="route-map-loading">

            귀가 경로를 불러오는 중...

        </div>


        <div
                id="routeMap"
                class="route-map">
        </div>


        <div
                id="routeMapInfo"
                class="route-map-info">
        </div>


        <div
                id="routeGuide"
                class="route-guide">
        </div>

    </div>

</div>



<!-- =========================================================
     Toast
     ========================================================= -->

<div class="toast-container">

    <div
            id="toastMessage"
            class="toast">
    </div>

</div>



<script>

    let meetingId = null;
    let currentUser = null;

    let kickRedirecting = false;

    let rankings = [];
    let finalCandidate = null;

    let whatIfActive = false;

    let routeMap = null;
    let routePolylines = [];
    let routeMarkers = [];


    /* =========================================================
       초기화
       ========================================================= */

    async function initialize() {

        currentUser =
            await MeetBack.checkLogin();

        if (!currentUser) {
            return;
        }


        meetingId =
            MeetBack.getMeetingId();

        if (!meetingId) {

            window.location.href =
                "/home";

            return;
        }


        MeetBackPresence.connect(
            meetingId,
            handleMeetingEvent
        );


        await loadResult();
    }


    async function handleMeetingEvent(
        data
    ) {

        if (
            kickRedirecting
            ||
            !data
            ||
            data.messageType !== "EVENT"
            ||
            data.eventType !== "PARTICIPANT_KICKED"
            ||
            Number(data.userId) !== Number(currentUser.userId)
        ) {

            return;
        }


        kickRedirecting =
            true;


        const toast =
            document.getElementById(
                "toastMessage"
            );


        toast.textContent =
            "모임에서 강퇴되었습니다.";

        toast.className =
            "toast toast-error show";


        await MeetBackPresence.disconnect();


        setTimeout(
            () =>
            {
                location.replace(
                    "/home"
                );
            },
            1500
        );
    }


    /* =========================================================
       결과 조회
       ========================================================= */

    async function loadResult() {

        const meetingResponse =
            await MeetBack.authenticatedFetch(
                "/meetings/"
                + meetingId
            );


        if (!meetingResponse.ok) {

            showResultError(
                "모임 정보를 불러오지 못했습니다."
            );

            return;
        }


        const meeting =
            await meetingResponse.json();


        if (
            meeting.status
            !== "CONFIRMED"
        ) {

            showResultError(
                "아직 최종 장소가 확정되지 않았습니다."
            );

            return;
        }


        if (
            meeting.finalCandidateId === null
            ||
            meeting.finalCandidateId === undefined
        ) {

            showResultError(
                "최종 확정된 장소를 찾을 수 없습니다."
            );

            return;
        }


        const rankingResponse =
            await MeetBack.authenticatedFetch(
                "/calculations/meeting/ranking?meetingId="
                + meetingId
            );


        if (!rankingResponse.ok) {

            showResultError(
                "결과를 불러오지 못했습니다."
            );

            return;
        }


        rankings =
            await rankingResponse.json();


        if (
            !rankings
            ||
            rankings.length === 0
        ) {

            showResultError(
                "결과가 없습니다."
            );

            return;
        }


        finalCandidate =
            rankings.find(
                item =>
                    Number(
                        item.candidateId
                    )
                    ===
                    Number(
                        meeting.finalCandidateId
                    )
            );


        if (!finalCandidate) {

            showResultError(
                "최종 장소의 계산 결과를 찾을 수 없습니다."
            );

            return;
        }


        renderFinalPlace();
        renderSummary();
        renderParticipants();
    }


    /* =========================================================
       결과 오류
       ========================================================= */

    function showResultError(
        message
    ) {

        document.getElementById(
            "finalPlaceArea"
        ).textContent =
            message;


        document.getElementById(
            "summaryArea"
        ).textContent =
            message;


        document.getElementById(
            "participantResultArea"
        ).textContent =
            message;
    }


    /* =========================================================
       최종 장소
       ========================================================= */

    function renderFinalPlace() {

        const area =
            document.getElementById(
                "finalPlaceArea"
            );


        area.innerHTML =
            `
            <div class="final-place-name">
                ${
                MeetBack.escapeHtml(
                    finalCandidate.placeName
                    || "장소명 없음"
                )
            }
            </div>

            <div class="final-place-address">
                ${
                MeetBack.escapeHtml(
                    finalCandidate.address
                    || ""
                )
            }
            </div>
            `;


        document.getElementById(
            "finalDesiredEndView"
        ).textContent =
            formatDateObject(
                getDisplayEndTime()
            );
    }


    /* =========================================================
       희망 종료시간
       ========================================================= */

    function getDesiredEndTime() {

        const directValue =
            finalCandidate.desiredEndAt
            ||
            finalCandidate.desiredEndTime;


        if (directValue) {

            const date =
                new Date(
                    directValue
                );


            if (
                !Number.isNaN(
                    date.getTime()
                )
            ) {

                return date;
            }
        }


        if (
            !finalCandidate.deadlineAt
            ||
            finalCandidate.goldenMarginMinutes === null
            ||
            finalCandidate.goldenMarginMinutes === undefined
        ) {

            return null;
        }


        const deadline =
            new Date(
                finalCandidate.deadlineAt
            );


        const goldenMargin =
            Number(
                finalCandidate.goldenMarginMinutes
            );


        if (
            Number.isNaN(
                deadline.getTime()
            )
            ||
            Number.isNaN(
                goldenMargin
            )
        ) {

            return null;
        }


        return new Date(
            deadline.getTime()
            -
            goldenMargin
            * 60
            * 1000
        );
    }


    function getDisplayEndTime() {

        const desiredEndTime =
            getDesiredEndTime();


        if (!desiredEndTime) {

            return null;
        }


        if (!whatIfActive) {

            return new Date(
                desiredEndTime.getTime()
            );
        }


        return new Date(
            desiredEndTime.getTime()
            +
            30
            * 60
            * 1000
        );
    }


    /* =========================================================
       Summary
       ========================================================= */

    function renderSummary() {

        const area =
            document.getElementById(
                "summaryArea"
            );


        const participants =
            finalCandidate.participantResults
            || [];


        let goldenMargin =
            finalCandidate.goldenMarginMinutes;


        let allReturnable =
            finalCandidate.allReturnable;


        if (whatIfActive) {

            if (
                goldenMargin !== null
                &&
                goldenMargin !== undefined
            ) {

                goldenMargin =
                    Number(
                        goldenMargin
                    )
                    - 30;
            }


            if (participants.length > 0) {

                allReturnable =
                    participants.every(
                        participant =>
                            calculateWhatIfCanReturn(
                                participant
                            )
                    );
            }
        }


        const ruleScoreHtml =
            !whatIfActive
                ? `
                <div class="summary-item">
                    <span>
                        Rule Score
                    </span>

                    <strong>
                        ${
                    finalCandidate.ruleScore == null
                        ? "-"
                        : Number(
                            finalCandidate.ruleScore
                        ).toFixed(1)
                }
                    </strong>
                </div>
                `
                : "";


        area.innerHTML =
            `
            <div class="summary-item">
                <span>
                    전체 귀가
                </span>

                <strong>
                    ${
                allReturnable
                    ? "전원 가능"
                    : "일부 불가"
            }
                </strong>
            </div>


            <div class="summary-item">
                <span>
                    Deadline
                </span>

                <strong>
                    ${
                displayDateTime(
                    finalCandidate.deadlineAt
                )
            }
                </strong>
            </div>


            <div class="summary-item">
                <span>
                    Golden Margin
                </span>

                <strong>
                    ${
                formatMinutes(
                    goldenMargin
                )
            }
                </strong>
            </div>


            <div class="summary-item">
                <span>
                    평균 귀가시간
                </span>

                <strong>
                    ${
                finalCandidate.averageReturnMinutes == null
                    ? "-"
                    : Math.round(
                        finalCandidate.averageReturnMinutes
                    )
                    + "분"
            }
                </strong>
            </div>


            <div class="summary-item">
                <span>
                    귀가시간 편차
                </span>

                <strong>
                    ${
                displayValue(
                    finalCandidate.fairnessGapMinutes,
                    "분"
                )
            }
                </strong>
            </div>


            ${ruleScoreHtml}
            `;
    }


    /* =========================================================
       참가자 결과
       ========================================================= */

    function renderParticipants() {

        const area =
            document.getElementById(
                "participantResultArea"
            );


        const participants =
            finalCandidate.participantResults
            || [];


        if (participants.length === 0) {

            area.textContent =
                "참가자별 결과가 없습니다.";

            return;
        }


        area.innerHTML =
            "";


        participants.forEach(
            participant =>
            {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "participant-result";


                const canReturn =
                    whatIfActive
                        ? calculateWhatIfCanReturn(
                            participant
                        )
                        : participant.canReturn;


                const participantName =
                    participant.nickname
                    || (
                        "참가자 "
                        + participant.participantId
                    );


                const walking =
                    !participant.lastTrainDepartureAt;


                const routeActionHtml =
                    walking
                        ? `
                        <span class="walking-route-label">
                            도보 귀가
                        </span>
                        `
                        : `
                        <button
                                type="button"
                                class="route-map-button">
                            지도로 보기
                        </button>
                        `;


                div.innerHTML =
                    `
                    <div class="participant-result-header">

                        <strong>
                            ${
                        MeetBack.escapeHtml(
                            participantName
                        )
                    }
                        </strong>


                        <div class="participant-result-actions">

                            ${routeActionHtml}

                            <span class="${
                        canReturn
                            ? "possible"
                            : "impossible"
                    }">
                                ${
                        canReturn
                            ? "귀가 가능"
                            : "귀가 불가"
                    }
                            </span>

                        </div>

                    </div>


                    <div class="participant-info-grid">

                        <div>
                            <span>
                                귀가시간
                            </span>

                            <strong>
                                ${
                        displayValue(
                            participant.returnMinutes,
                            "분"
                        )
                    }
                            </strong>
                        </div>


                        <div>
                            <span>
                                환승 횟수
                            </span>

                            <strong>
                                ${
                        displayValue(
                            participant.transferCount,
                            "회"
                        )
                    }
                            </strong>
                        </div>


                        <div>
                            <span>
                                안전 출발 마감
                            </span>

                            <strong>
                                ${
                        displayDateTime(
                            participant.lastSafeDepartureAt
                        )
                    }
                            </strong>
                        </div>


                        <div>
                            <span>
                                막차 출발
                            </span>

                            <strong>
                                ${
                        displayDateTime(
                            participant.lastTrainDepartureAt
                        )
                    }
                            </strong>
                        </div>

                    </div>
                    `;


                if (!walking) {

                    const button =
                        div.querySelector(
                            ".route-map-button"
                        );


                    button.addEventListener(
                        "click",
                        () =>
                        {

                            openRouteMap(
                                finalCandidate.candidateId,
                                participant.participantId,
                                participantName,
                                participant.returnMinutes,
                                participant.transferCount,
                                participant.lastTrainDepartureAt
                            );
                        }
                    );
                }


                area.appendChild(
                    div
                );
            }
        );
    }


    /* =========================================================
       지도 열기
       ========================================================= */

    async function openRouteMap(
        candidateId,
        participantId,
        participantName,
        returnMinutes,
        transferCount,
        lastTrainDepartureAt
    ) {

        const modal =
            document.getElementById(
                "routeMapModal"
            );


        const loading =
            document.getElementById(
                "routeMapLoading"
            );


        const mapElement =
            document.getElementById(
                "routeMap"
            );


        const info =
            document.getElementById(
                "routeMapInfo"
            );


        const guide =
            document.getElementById(
                "routeGuide"
            );


        document.getElementById(
            "routeMapTitle"
        ).textContent =
            participantName
            + " 귀가 경로";


        modal.classList.add(
            "open"
        );


        document.body.classList.add(
            "modal-open"
        );


        loading.style.display =
            "flex";


        loading.textContent =
            "귀가 경로를 불러오는 중...";


        mapElement.style.display =
            "none";


        info.innerHTML =
            "";


        guide.innerHTML =
            "";


        guide.style.display =
            "none";


        try {

            const response =
                await MeetBack.authenticatedFetch(
                    "/api/routes/"
                    + encodeURIComponent(
                        candidateId
                    )
                    + "/"
                    + encodeURIComponent(
                        participantId
                    )
                    + "/map"
                );


            if (!response.ok) {

                let message =
                    "귀가 경로를 불러오지 못했습니다.";


                try {

                    const error =
                        await response.json();


                    if (error.message) {

                        message =
                            error.message;
                    }

                } catch (ignore) {
                }


                throw new Error(
                    message
                );
            }


            const data =
                await response.json();


            if (
                !data.lines
                ||
                data.lines.length === 0
            ) {

                throw new Error(
                    "표시할 경로 좌표가 없습니다."
                );
            }


            /*
             * 노선 + 호선 타입을 같이 전달해서
             * 하단 안내 색상도 지도와 동일하게 맞춤
             */
            renderRouteGuide(
                data.steps,
                data.lines
            );


            loading.style.display =
                "none";


            mapElement.style.display =
                "block";


            /*
             * 예상 귀가시간 / 환승 / 막차
             */
            info.innerHTML =
                `
                <span>
                    예상 귀가시간

                    <strong>
                        ${
                    returnMinutes == null
                        ? "-"
                        : returnMinutes + "분"
                }
                    </strong>
                </span>


                <span>
                    환승

                    <strong>
                        ${
                    transferCount == null
                        ? "-"
                        : transferCount + "회"
                }
                    </strong>
                </span>


                <span>
                    막차

                    <strong>
                        ${
                    formatTimeOnly(
                        lastTrainDepartureAt
                    )
                }
                    </strong>
                </span>
                `;


            setTimeout(
                () =>
                {

                    drawRouteMap(
                        data.lines,
                        data.startName,
                        data.endName,
                        data.steps
                    );
                },
                100
            );

        } catch (error) {

            console.error(
                "[ROUTE MAP ERROR]",
                error
            );


            mapElement.style.display =
                "none";


            loading.style.display =
                "flex";


            loading.textContent =
                error.message
                ||
                "귀가 경로를 불러오지 못했습니다.";
        }
    }


    /* =========================================================
       노선명
       ========================================================= */

    function normalizeLineName(
        lineName
    ) {

        if (!lineName) {

            return "노선 정보 없음";
        }


        return String(
            lineName
        )
            .replace(
                /^수도권\s*/,
                ""
            )
            .trim();
    }


    /* =========================================================
       호선 색상
       ========================================================= */

    function getSubwayLineColor(
        type
    ) {

        const colors = {

            1: "#0052A4",
            2: "#00A84D",
            3: "#EF7C1C",
            4: "#00A5DE",
            5: "#996CAC",
            6: "#CD7C2F",
            7: "#747F00",
            8: "#E6186C",
            9: "#BDB092"
        };


        return colors[type]
            || "#6557f6";
    }


    /* =========================================================
       하단 노선 안내
       ========================================================= */

    function renderRouteGuide(
        steps,
        lines
    ) {

        const guide =
            document.getElementById(
                "routeGuide"
            );


        if (
            !steps
            ||
            steps.length === 0
        ) {

            guide.innerHTML =
                "";

            guide.style.display =
                "none";

            return;
        }


        let html =
            `
            <div class="route-guide-content">

                <span class="route-guide-label">
                    이용 노선
                </span>
            `;


        steps.forEach(
            (
                step,
                index
            ) =>
            {

                /*
                 * ODsay loadLane에서 받은
                 * 동일 순서의 line.type 사용
                 */
                const lineType =
                    lines?.[index]?.type;


                const lineColor =
                    getSubwayLineColor(
                        Number(
                            lineType
                        )
                    );


                const lineName =
                    MeetBack.escapeHtml(
                        normalizeLineName(
                            step.lineName
                        )
                    );


                html +=
                    `
                    <span
                            class="route-guide-line-chip"
                            style="
                                color: ${lineColor};
                                border: 1px solid ${lineColor}40;
                                background: ${lineColor}18;
                            ">
                        ${lineName}
                    </span>
                    `;


                if (
                    index
                    <
                    steps.length - 1
                ) {

                    html +=
                        `
                        <span class="route-guide-arrow">
                            →
                        </span>


                        <span class="route-guide-transfer-station">
                            ${
                            MeetBack.escapeHtml(
                                step.endStationName
                                || "환승역"
                            )
                        }
                        </span>


                        <span class="route-guide-transfer-badge">
                            환승
                        </span>


                        <span class="route-guide-arrow">
                            →
                        </span>
                        `;
                }
            }
        );


        html +=
            `
            </div>
            `;


        guide.innerHTML =
            html;


        guide.style.display =
            "block";
    }


    /* =========================================================
       지도 역 마커
       ========================================================= */

    function createRouteStationMarker(
        position,
        type,
        stationName,
        lineText,
        lineType,
        nextLineType = null
    ) {

        if (
            !position
            ||
            !routeMap
        ) {

            return;
        }


        let badgeText =
            "경유";


        if (type === "start") {

            badgeText =
                "출발";
        }


        else if (type === "transfer") {

            badgeText =
                "환승";
        }


        else if (type === "end") {

            badgeText =
                "도착";
        }


        const lineColor =
            getSubwayLineColor(
                Number(
                    lineType
                )
            );


        const nextLineColor =
            nextLineType == null
                ? lineColor
                : getSubwayLineColor(
                    Number(
                        nextLineType
                    )
                );


        const safeStationName =
            MeetBack.escapeHtml(
                stationName
                || "역 정보 없음"
            );


        const safeLineText =
            MeetBack.escapeHtml(
                lineText
                || ""
            );


        const marker =
            new naver.maps.Marker(
                {

                    map:
                    routeMap,


                    position:
                    position,


                    zIndex:
                        type === "transfer"
                            ? 150
                            : 120,


                    icon:
                        {

                            content:
                                `
                                <div
                                        class="route-station-marker ${type}"
                                        style="
                                            --marker-color: ${lineColor};
                                            --marker-next-color: ${nextLineColor};
                                        ">

                                    <div class="route-station-marker-header">

                                        <span class="route-station-marker-badge">
                                            ${badgeText}
                                        </span>


                                        <span class="route-station-marker-name">
                                            ${safeStationName}
                                        </span>

                                    </div>


                                    ${
                                    safeLineText
                                        ? `
                                        <div class="route-station-marker-line">
                                            ${safeLineText}
                                        </div>
                                        `
                                        : ""
                                }

                                </div>
                                `
                        }
                }
            );


        routeMarkers.push(
            marker
        );
    }


    /* =========================================================
       네이버 지도 출력
       ========================================================= */

    function drawRouteMap(
        lines,
        startName,
        endName,
        steps
    ) {

        if (
            typeof naver === "undefined"
            ||
            !naver.maps
        ) {

            return;
        }


        const allPoints =
            [];


        lines.forEach(
            line =>
            {

                if (
                    !line.points
                    ||
                    line.points.length === 0
                ) {

                    return;
                }


                line.points.forEach(
                    point =>
                    {

                        allPoints.push(
                            new naver.maps.LatLng(
                                Number(
                                    point.latitude
                                ),
                                Number(
                                    point.longitude
                                )
                            )
                        );
                    }
                );
            }
        );


        if (allPoints.length === 0) {

            return;
        }


        if (!routeMap) {

            routeMap =
                new naver.maps.Map(
                    "routeMap",
                    {

                        center:
                            allPoints[0],


                        zoom:
                            13
                    }
                );
        }


        naver.maps.Event.trigger(
            routeMap,
            "resize"
        );


        routePolylines.forEach(
            polyline =>
                polyline.setMap(
                    null
                )
        );


        routePolylines =
            [];


        routeMarkers.forEach(
            marker =>
                marker.setMap(
                    null
                )
        );


        routeMarkers =
            [];


        /* =====================================================
           경로선
           ===================================================== */

        lines.forEach(
            line =>
            {

                if (
                    !line.points
                    ||
                    line.points.length === 0
                ) {

                    return;
                }


                const path =
                    line.points.map(
                        point =>
                            new naver.maps.LatLng(
                                Number(
                                    point.latitude
                                ),
                                Number(
                                    point.longitude
                                )
                            )
                    );


                const polyline =
                    new naver.maps.Polyline(
                        {

                            map:
                            routeMap,


                            path:
                            path,


                            strokeColor:
                                getSubwayLineColor(
                                    Number(
                                        line.type
                                    )
                                ),


                            strokeWeight:
                                6,


                            strokeOpacity:
                                0.9,


                            strokeLineCap:
                                "round",


                            strokeLineJoin:
                                "round"
                        }
                    );


                routePolylines.push(
                    polyline
                );
            }
        );


        /* =====================================================
           역 마커
           ===================================================== */

        if (
            steps
            &&
            steps.length > 0
        ) {

            const firstStep =
                steps[0];


            const lastStep =
                steps[
                steps.length - 1
                    ];


            /* =================================================
               출발
               ================================================= */

            let startPosition =
                allPoints[0];


            if (
                firstStep.startLatitude != null
                &&
                firstStep.startLongitude != null
            ) {

                startPosition =
                    new naver.maps.LatLng(
                        Number(
                            firstStep.startLatitude
                        ),
                        Number(
                            firstStep.startLongitude
                        )
                    );
            }


            const startLineType =
                lines[0]?.type;


            createRouteStationMarker(
                startPosition,
                "start",
                firstStep.startStationName
                || startName
                || "출발역",
                normalizeLineName(
                    firstStep.lineName
                ),
                startLineType
            );


            /* =================================================
               환승
               ================================================= */

            for (
                let i = 0;
                i < steps.length - 1;
                i++
            ) {

                const currentStep =
                    steps[i];


                const nextStep =
                    steps[i + 1];


                if (
                    currentStep.endLatitude == null
                    ||
                    currentStep.endLongitude == null
                ) {

                    continue;
                }


                const transferPosition =
                    new naver.maps.LatLng(
                        Number(
                            currentStep.endLatitude
                        ),
                        Number(
                            currentStep.endLongitude
                        )
                    );


                const currentLineType =
                    lines[i]?.type;


                const nextLineType =
                    lines[i + 1]?.type;


                createRouteStationMarker(
                    transferPosition,
                    "transfer",
                    currentStep.endStationName
                    || "환승역",
                    normalizeLineName(
                        currentStep.lineName
                    )
                    +
                    " → "
                    +
                    normalizeLineName(
                        nextStep.lineName
                    ),
                    currentLineType,
                    nextLineType
                );
            }


            /* =================================================
               도착
               ================================================= */

            let endPosition =
                allPoints[
                allPoints.length - 1
                    ];


            if (
                lastStep.endLatitude != null
                &&
                lastStep.endLongitude != null
            ) {

                endPosition =
                    new naver.maps.LatLng(
                        Number(
                            lastStep.endLatitude
                        ),
                        Number(
                            lastStep.endLongitude
                        )
                    );
            }


            const endLineType =
                lines[
                lines.length - 1
                    ]?.type;


            createRouteStationMarker(
                endPosition,
                "end",
                lastStep.endStationName
                || endName
                || "도착역",
                normalizeLineName(
                    lastStep.lineName
                ),
                endLineType
            );
        }


        /*
         * 구버전 데이터
         */
        else {

            createRouteStationMarker(
                allPoints[0],
                "start",
                startName
                || "출발",
                "",
                lines[0]?.type
            );


            createRouteStationMarker(
                allPoints[
                allPoints.length - 1
                    ],
                "end",
                endName
                || "도착",
                "",
                lines[
                lines.length - 1
                    ]?.type
            );
        }


        /* =====================================================
           지도 범위
           ===================================================== */

        const bounds =
            new naver.maps.LatLngBounds();


        allPoints.forEach(
            point =>
                bounds.extend(
                    point
                )
        );


        routeMap.fitBounds(
            bounds
        );
    }


    /* =========================================================
       지도 닫기
       ========================================================= */

    function closeRouteMap() {

        document.getElementById(
            "routeMapModal"
        ).classList.remove(
            "open"
        );


        document.body.classList.remove(
            "modal-open"
        );
    }


    function handleRouteMapBackground(
        event
    ) {

        if (
            event.target.id
            === "routeMapModal"
        ) {

            closeRouteMap();
        }
    }


    document.addEventListener(
        "keydown",
        event =>
        {

            if (
                event.key
                === "Escape"
            ) {

                closeRouteMap();
            }
        }
    );


    /* =========================================================
       What-if
       ========================================================= */

    function calculateWhatIfCanReturn(
        participant
    ) {

        if (
            !participant.lastSafeDepartureAt
        ) {

            return participant.canReturn;
        }


        const desiredEndTime =
            getDesiredEndTime();


        if (!desiredEndTime) {

            return participant.canReturn;
        }


        const whatIfEndTime =
            new Date(
                desiredEndTime.getTime()
                +
                30
                * 60
                * 1000
            );


        const safeDeparture =
            new Date(
                participant.lastSafeDepartureAt
            );


        if (
            Number.isNaN(
                safeDeparture.getTime()
            )
        ) {

            return participant.canReturn;
        }


        return (
            whatIfEndTime
            <=
            safeDeparture
        );
    }


    function toggleWhatIf() {

        if (!finalCandidate) {

            return;
        }


        whatIfActive =
            !whatIfActive;


        const button =
            document.getElementById(
                "whatIfButton"
            );


        const description =
            document.getElementById(
                "resultDescription"
            );


        const summaryLabel =
            document.getElementById(
                "summaryLabel"
            );


        const summaryTitle =
            document.getElementById(
                "summaryTitle"
            );


        const participantLabel =
            document.getElementById(
                "participantLabel"
            );


        const participantTitle =
            document.getElementById(
                "participantTitle"
            );


        if (whatIfActive) {

            button.textContent =
                "현재 결과 보기";


            description.textContent =
                "희망 종료시간을 30분 늦춘 경우의 귀가 결과입니다.";


            summaryLabel.textContent =
                "WHAT IF · +30 MIN";


            summaryTitle.textContent =
                "30분 후 귀가 분석 결과";


            participantLabel.textContent =
                "PARTICIPANTS · +30 MIN";


            participantTitle.textContent =
                "30분 후 참가자별 귀가 결과";
        }


        else {

            button.textContent =
                "+30분 결과 보기";


            description.textContent =
                "최종 장소와 참가자별 귀가 정보를 확인해보세요.";


            summaryLabel.textContent =
                "SUMMARY";


            summaryTitle.textContent =
                "귀가 분석 결과";


            participantLabel.textContent =
                "PARTICIPANTS";


            participantTitle.textContent =
                "참가자별 귀가 결과";
        }


        renderFinalPlace();
        renderSummary();
        renderParticipants();
    }


    /* =========================================================
       공통
       ========================================================= */

    function displayValue(
        value,
        suffix = ""
    ) {

        if (
            value === null
            ||
            value === undefined
        ) {

            return "-";
        }


        return (
            MeetBack.escapeHtml(
                value
            )
            +
            suffix
        );
    }


    function formatMinutes(
        value
    ) {

        if (
            value === null
            ||
            value === undefined
        ) {

            return "-";
        }


        const total =
            Math.round(
                Number(
                    value
                )
            );


        if (
            Number.isNaN(
                total
            )
        ) {

            return "-";
        }


        const sign =
            total < 0
                ? "-"
                : "";


        const absolute =
            Math.abs(
                total
            );


        const hours =
            Math.floor(
                absolute / 60
            );


        const minutes =
            absolute % 60;


        if (hours === 0) {

            return sign
                + minutes
                + "분";
        }


        if (minutes === 0) {

            return sign
                + hours
                + "시간";
        }


        return sign
            + hours
            + "시간 "
            + minutes
            + "분";
    }


    function displayDateTime(
        value
    ) {

        if (!value) {

            return "-";
        }


        return MeetBack.escapeHtml(
            MeetBack.formatDateTime(
                value
            )
        );
    }


    /* =========================================================
       막차 시간만 표시
       ========================================================= */

    function formatTimeOnly(
        value
    ) {

        if (!value) {

            return "-";
        }


        const date =
            new Date(
                value
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "-";
        }


        return new Intl.DateTimeFormat(
            "ko-KR",
            {
                hour:
                    "2-digit",

                minute:
                    "2-digit",

                hour12:
                    false
            }
        ).format(
            date
        );
    }


    function formatDateObject(
        date
    ) {

        if (
            !date
            ||
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "-";
        }


        return new Intl.DateTimeFormat(
            "ko-KR",
            {
                year:
                    "numeric",

                month:
                    "numeric",

                day:
                    "numeric",

                hour:
                    "numeric",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hour12:
                    true
            }
        ).format(
            date
        );
    }


    /* =========================================================
       모임방으로
       ========================================================= */

    function goRoom() {

        if (!meetingId) {

            window.location.href =
                "/home";

            return;
        }


        window.location.href =
            "/meeting?meetingId="
            +
            encodeURIComponent(
                meetingId
            );
    }


    initialize();
