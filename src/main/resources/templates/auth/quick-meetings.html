<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>MeetBack 번개 모임</title>

    <link rel="stylesheet" href="/css/home.css">
</head>

<body>

<div class="home-container">

    <section class="section">

        <div class="quick-title-row">

            <h2>
                번개 모임
            </h2>

            <a
                    href="/home"
                    class="quick-home-link">

                ← 홈으로

            </a>

        </div>

        <p class="section-description">
            현재 참여 가능한 번개 모임을 확인해보세요.
        </p>


        <!-- =====================================================
             제목 검색
             ===================================================== -->

        <div class="quick-search-area">

            <input
                    type="text"
                    id="quickSearchInput"
                    class="quick-search-input"
                    placeholder="번개 모임 제목을 검색해보세요.">

            <button
                    type="button"
                    id="quickSearchButton"
                    class="quick-search-button">

                검색

            </button>

        </div>


        <!-- =====================================================
             번개 모임 목록
             ===================================================== -->

        <div
                id="quickMeetingList"
                class="quick-meeting-grid">
        </div>

    </section>

</div>


<script>

    // ============================================================
    // DOM
    // ============================================================

    const quickSearchInput =
        document.getElementById("quickSearchInput");


    const quickSearchButton =
        document.getElementById("quickSearchButton");


    const quickMeetingList =
        document.getElementById("quickMeetingList");


    // ============================================================
    // Refresh Token
    // ============================================================

    async function refreshTokens()
    {

        const refreshToken =
            localStorage.getItem("refreshToken");


        if (!refreshToken)
        {
            return false;
        }


        try
        {
            const response =
                await fetch(
                    "/auth/refresh",
                    {method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                {
                                    refreshToken:
                                    refreshToken
                                }
                            )
                    }
                );


            if (!response.ok)
            {
                return false;
            }


            const data =
                await response.json();


            localStorage.setItem(
                "accessToken",
                data.accessToken
            );


            localStorage.setItem(
                "refreshToken",
                data.refreshToken
            );


            return true;

        }
        catch (error)
        {

            console.error(
                "[TOKEN REFRESH ERROR]",
                error
            );


            return false;
        }
    }


    // ============================================================
    // JWT 포함 요청
    // ============================================================

    async function authenticatedFetch(
        url,
        options = {}
    )
    {

        let accessToken =
            localStorage.getItem(
                "accessToken"
            );


        options.headers =
            options.headers || {};


        options.headers["Authorization"] =
            "Bearer " + accessToken;


        let response =
            await fetch(
                url,
                options
            );


        if (
            response.status === 401
            ||
            response.status === 403
        )
        {

            const refreshed =
                await refreshTokens();


            if (!refreshed)
            {

                window.location.href =
                    "/login";


                return response;
            }


            accessToken =
                localStorage.getItem(
                    "accessToken"
                );


            options.headers["Authorization"] =
                "Bearer " + accessToken;


            response =
                await fetch(
                    url,
                    options
                );
        }


        return response;
    }


    // ============================================================
    // 번개 모임 목록 조회
    // ============================================================

    async function loadQuickMeetings(
        keyword = ""
    )
    {

        try
        {

            const normalizedKeyword =
                keyword.trim();


            const url =
                normalizedKeyword
                    ?
                    "/meetings/quick?keyword="
                    +
                    encodeURIComponent(
                        normalizedKeyword
                    )
                    :
                    "/meetings/quick";


            const response =
                await authenticatedFetch(
                    url,
                    {
                        method:
                            "GET"
                    }
                );


            if (!response.ok)
            {

                console.error(
                    "[QUICK MEETINGS]",
                    response.status
                );


                throw new Error(
                    "번개 모임을 불러오지 못했습니다."
                );
            }


            const meetings =
                await response.json();


            quickMeetingList.replaceChildren();


            // ====================================================
            // 결과 없음
            // ====================================================

            if (
                !Array.isArray(meetings)
                ||
                meetings.length === 0
            )
            {

                const empty =
                    document.createElement(
                        "div"
                    );


                empty.className =
                    "quick-meeting-empty";


                if (normalizedKeyword)
                {

                    empty.textContent =
                        "검색 결과가 없습니다.";

                }
                else
                {

                    empty.textContent =
                        "현재 참여 가능한 번개 모임이 없습니다.";
                }


                quickMeetingList.appendChild(
                    empty
                );


                return;
            }


            // ====================================================
            // 카드 생성
            // ====================================================

            meetings.forEach(
                meeting =>
                {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "quick-meeting-card";


                    // --------------------------------------------
                    // 제목
                    // --------------------------------------------

                    const title =
                        document.createElement(
                            "div"
                        );


                    title.className =
                        "quick-meeting-title";


                    title.textContent =
                        meeting.title
                        ||
                        "제목 없는 번개";

                    // --------------------------------------------
                    // 방장 nickname
                    // --------------------------------------------


                    const host =
                        document.createElement(
                            "div"
                        );

                    host.className =
                        "quick-meeting-host";

                    host.textContent =
                        "방장 "
                        +
                        (
                            meeting.hostNickname
                            ||
                            "알 수 없음"
                        );


                    // --------------------------------------------
                    // 희망 종료시간
                    // --------------------------------------------

                    const endAt =
                        document.createElement(
                            "div"
                        );


                    endAt.className =
                        "quick-meeting-end";


                    if (meeting.desiredEndAt)
                    {

                        const date =
                            new Date(
                                meeting.desiredEndAt
                            );


                        endAt.textContent =
                            "희망 종료 "
                            +
                            date.toLocaleString(
                                "ko-KR",
                                {
                                    month:
                                        "numeric",

                                    day:
                                        "numeric",

                                    hour:
                                        "2-digit",

                                    minute:
                                        "2-digit"
                                }
                            );

                    }
                    else
                    {

                        endAt.textContent =
                            "종료시간 미정";
                    }


                    // --------------------------------------------
                    // 자세히 보기
                    // --------------------------------------------

                    const detailButton =
                        document.createElement(
                            "button"
                        );


                    detailButton.type =
                        "button";


                    detailButton.className =
                        "quick-meeting-join-button";


                    detailButton.textContent =
                        "자세히 보기";


                    detailButton.addEventListener(
                        "click",
                        function()
                        {

                            window.location.href =
                                "/quick-meeting?meetingId="
                                +
                                encodeURIComponent(
                                    meeting.meetingId
                                );
                        }
                    );


                    card.appendChild(
                        title
                    );

                    card.appendChild(
                        host
                    );


                    card.appendChild(
                        endAt
                    );


                    card.appendChild(
                        detailButton
                    );


                    quickMeetingList.appendChild(
                        card
                    );
                }
            );

        }
        catch (error)
        {

            console.error(
                "[QUICK MEETINGS ERROR]",
                error
            );


            quickMeetingList.textContent =
                "번개 모임을 불러오지 못했습니다.";
        }
    }


    // ============================================================
    // 검색 버튼
    // ============================================================

    quickSearchButton.addEventListener(
        "click",
        function()
        {

            const keyword =
                quickSearchInput
                    .value
                    .trim();


            loadQuickMeetings(
                keyword
            );
        }
    );


    // ============================================================
    // Enter 검색
    // ============================================================

    quickSearchInput.addEventListener(
        "keydown",
        function(event)
        {

            if (event.key !== "Enter")
            {
                return;
            }


            const keyword =
                quickSearchInput
                    .value
                    .trim();


            loadQuickMeetings(
                keyword
            );
        }
    );


    // ============================================================
    // 최초 목록 조회
    // ============================================================

    loadQuickMeetings();

</script>

</body>

</html>
