<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MeetBack 번개 모임</title>

    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/meetback-theme.css">
    <link rel="stylesheet" href="/css/app-pages.css">
    <link rel="stylesheet" href="/css/dark-mode.css">

    <script src="/js/theme-toggle.js"></script>
</head>

<body class="mb-page mb-app-page page-quick-meetings">

<div class="home-container">

    <section class="section">

        <div class="quick-title-row">

            <h2>
                번개 모임
            </h2>

            <a
                    href="/home"
                    class="quick-home-link">

                ← 홈으로

            </a>

        </div>


        <p class="section-description">
            현재 참여 가능한 번개 모임을 확인해보세요.
        </p>


        <!-- =====================================================
             제목 검색
             ===================================================== -->

        <div class="quick-search-area">

            <input
                    type="text"
                    id="quickSearchInput"
                    class="quick-search-input"
                    placeholder="번개 모임 제목을 검색해보세요.">

            <button
                    type="button"
                    id="quickSearchButton"
                    class="quick-search-button">

                검색

            </button>

        </div>


        <!-- =====================================================
             번개 모임 목록
             ===================================================== -->

        <div
                id="quickMeetingList"
                class="quick-meeting-grid">
        </div>

    </section>

</div>


<script>

    // ============================================================
    // DOM
    // ============================================================

    const quickSearchInput =
        document.getElementById(
            "quickSearchInput"
        );


    const quickSearchButton =
        document.getElementById(
            "quickSearchButton"
        );


    const quickMeetingList =
        document.getElementById(
            "quickMeetingList"
        );


    // ============================================================
    // Refresh Token
    // ============================================================

    async function refreshTokens()
    {

        const refreshToken =
            localStorage.getItem(
                "refreshToken"
            );


        if (!refreshToken)
        {
            return false;
        }


        try
        {

            const response =
                await fetch(
                    "/auth/refresh",
                    {
                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                {

                                    refreshToken:
                                    refreshToken

                                }
                            )
                    }
                );


            if (!response.ok)
            {
                return false;
            }


            const data =
                await response.json();


            localStorage.setItem(
                "accessToken",
                data.accessToken
            );


            localStorage.setItem(
                "refreshToken",
                data.refreshToken
            );


            if (data.nickname)
            {

                localStorage.setItem(
                    "nickname",
                    data.nickname
                );
            }


            return true;

        }
        catch (error)
        {

            console.error(
                "[TOKEN REFRESH ERROR]",
                error
            );


            return false;
        }
    }


    // ============================================================
    // JWT 포함 요청
    // ============================================================

    async function authenticatedFetch(
        url,
        options = {}
    )
    {

        let accessToken =
            localStorage.getItem(
                "accessToken"
            );


        options.headers =
            options.headers || {};


        options.headers[
            "Authorization"
            ] =
            "Bearer "
            +
            accessToken;


        let response =
            await fetch(
                url,
                options
            );


        if (
            response.status === 401
            ||
            response.status === 403
        )
        {

            const refreshed =
                await refreshTokens();


            if (!refreshed)
            {

                window.location.href =
                    "/login";


                return response;
            }


            accessToken =
                localStorage.getItem(
                    "accessToken"
                );


            options.headers[
                "Authorization"
                ] =
                "Bearer "
                +
                accessToken;


            response =
                await fetch(
                    url,
                    options
                );
        }


        return response;
    }


    // ============================================================
    // 날짜 표시
    // ============================================================

    function formatDateTime(
        dateTime
    )
    {

        if (!dateTime)
        {
            return null;
        }


        const date =
            new Date(
                dateTime
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        )
        {
            return null;
        }


        return date.toLocaleString(
            "ko-KR",
            {
                month:
                    "numeric",

                day:
                    "numeric",

                hour:
                    "2-digit",

                minute:
                    "2-digit"
            }
        );
    }


    // ============================================================
    // 번개 모임 목록 조회
    // ============================================================

    async function loadQuickMeetings(
        keyword = ""
    )
    {

        try
        {

            const normalizedKeyword =
                keyword.trim();


            const url =
                normalizedKeyword
                    ?
                    "/meetings/quick?keyword="
                    +
                    encodeURIComponent(
                        normalizedKeyword
                    )
                    :
                    "/meetings/quick";


            const response =
                await authenticatedFetch(
                    url,
                    {
                        method:
                            "GET"
                    }
                );


            if (!response.ok)
            {

                console.error(
                    "[QUICK MEETINGS]",
                    response.status
                );


                throw new Error(
                    "번개 모임을 불러오지 못했습니다."
                );
            }


            const meetings =
                await response.json();


            quickMeetingList.replaceChildren();


            // ====================================================
            // 결과 없음
            // ====================================================

            if (
                !Array.isArray(
                    meetings
                )
                ||
                meetings.length === 0
            )
            {

                const empty =
                    document.createElement(
                        "div"
                    );


                empty.className =
                    "quick-meeting-empty";


                if (normalizedKeyword)
                {

                    empty.textContent =
                        "검색 결과가 없습니다.";

                }
                else
                {

                    empty.textContent =
                        "현재 참여 가능한 번개 모임이 없습니다.";
                }


                quickMeetingList.appendChild(
                    empty
                );


                return;
            }


            // ====================================================
            // 카드 생성
            // ====================================================

            meetings.forEach(
                meeting =>
                {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "quick-meeting-card";


                    // --------------------------------------------
                    // 제목
                    // --------------------------------------------

                    const title =
                        document.createElement(
                            "div"
                        );


                    title.className =
                        "quick-meeting-title";


                    title.textContent =
                        meeting.title
                        ||
                        "제목 없는 번개";


                    card.appendChild(
                        title
                    );


                    // --------------------------------------------
                    // 고정 번개방 표시
                    // --------------------------------------------

                    if (
                        meeting.meetingType
                        ===
                        "QUICK_FIXED"
                    )
                    {

                        const type =
                            document.createElement(
                                "div"
                            );


                        type.className =
                            "quick-meeting-end";


                        type.textContent =
                            "⚡ 고정 번개방";


                        card.appendChild(
                            type
                        );
                    }


                    // --------------------------------------------
                    // 방장 nickname
                    // --------------------------------------------

                    const host =
                        document.createElement(
                            "div"
                        );


                    host.className =
                        "quick-meeting-host";


                    host.textContent =
                        "방장 "
                        +
                        (
                            meeting.hostNickname
                            ||
                            "알 수 없음"
                        );


                    card.appendChild(
                        host
                    );


                    // --------------------------------------------
                    // 현재 참가 인원
                    // --------------------------------------------

                    if (
                        meeting.maxParticipants
                        !==
                        null
                        &&
                        meeting.maxParticipants
                        !==
                        undefined
                    )
                    {

                        const participants =
                            document.createElement(
                                "div"
                            );


                        participants.className =
                            "quick-meeting-end";


                        participants.textContent =
                            "참가 인원 "
                            +
                            (
                                meeting.currentParticipants
                                ??
                                0
                            )
                            +
                            " / "
                            +
                            meeting.maxParticipants;


                        card.appendChild(
                            participants
                        );
                    }


                    // --------------------------------------------
                    // 고정 번개방 장소
                    // --------------------------------------------

                    if (
                        meeting.meetingType
                        ===
                        "QUICK_FIXED"
                    )
                    {

                        const place =
                            document.createElement(
                                "div"
                            );


                        place.className =
                            "quick-meeting-end";


                        place.textContent =
                            "장소 "
                            +
                            (
                                meeting.fixedPlaceName
                                ||
                                "미등록"
                            );


                        card.appendChild(
                            place
                        );
                    }


                    // --------------------------------------------
                    // 고정 번개방 시작시간
                    // --------------------------------------------

                    if (
                        meeting.meetingType
                        ===
                        "QUICK_FIXED"
                    )
                    {

                        const startAt =
                            document.createElement(
                                "div"
                            );


                        startAt.className =
                            "quick-meeting-end";


                        const formattedStartAt =
                            formatDateTime(
                                meeting.meetingStartAt
                            );


                        startAt.textContent =
                            formattedStartAt
                                ?
                                "모임 시작 "
                                +
                                formattedStartAt
                                :
                                "모임 시작시간 미등록";


                        card.appendChild(
                            startAt
                        );
                    }


                    // --------------------------------------------
                    // 희망 종료시간
                    // --------------------------------------------

                    const endAt =
                        document.createElement(
                            "div"
                        );


                    endAt.className =
                        "quick-meeting-end";


                    const formattedEndAt =
                        formatDateTime(
                            meeting.desiredEndAt
                        );


                    if (formattedEndAt)
                    {

                        endAt.textContent =
                            "희망 종료 "
                            +
                            formattedEndAt;

                    }
                    else
                    {

                        endAt.textContent =
                            "종료시간 미정";
                    }


                    card.appendChild(
                        endAt
                    );


                    // --------------------------------------------
                    // 참여하기 / 방 입장
                    // --------------------------------------------

                    const joinButton =
                        document.createElement(
                            "button"
                        );


                    joinButton.type =
                        "button";


                    joinButton.className =
                        "quick-meeting-join-button";


                    const isFull =
                        meeting.maxParticipants
                        !==
                        null
                        &&
                        meeting.maxParticipants
                        !==
                        undefined
                        &&
                        (
                            meeting.currentParticipants
                            ??
                            0
                        )
                        >=
                        meeting.maxParticipants;


                    // 이미 참가한 사용자는
                    // 정원이 꽉 차도 입장 가능
                    if (meeting.isParticipant)
                    {

                        joinButton.textContent =
                            "방 입장";

                        joinButton.disabled =
                            false;

                    }
                    else if (isFull)
                    {

                        joinButton.textContent =
                            "정원 마감";

                        joinButton.disabled =
                            true;

                    }
                    else
                    {

                        joinButton.textContent =
                            "참여하기";

                        joinButton.disabled =
                            false;
                    }


                    joinButton.addEventListener(
                        "click",
                        async function()
                        {

                            const meetingId =
                                encodeURIComponent(
                                    meeting.meetingId
                                );


                            // ====================================
                            // 1. 이미 참가 중인 사용자
                            // ====================================

                            if (meeting.isParticipant)
                            {

                                localStorage.setItem(
                                    "chatMeetingId",
                                    meeting.meetingId
                                );


                                // 고정 번개방
                                if (
                                    meeting.meetingType
                                    ===
                                    "QUICK_FIXED"
                                )
                                {

                                    window.location.href =
                                        "/quick-fixed?meetingId="
                                        +
                                        meetingId;


                                    return;
                                }


                                // 투표형 번개방
                                window.location.href =
                                    "/meeting?meetingId="
                                    +
                                    meetingId;


                                return;
                            }


                            // ====================================
                            // 2. 미참가 + 고정 번개
                            // → 참여 전 확인 화면
                            // ====================================

                            if (
                                meeting.meetingType
                                ===
                                "QUICK_FIXED"
                            )
                            {

                                window.location.href =
                                    "/quick-fixed-check?meetingId="
                                    +
                                    meetingId;


                                return;
                            }


                            // ====================================
                            // 3. 미참가 + 투표형 번개
                            // → 참가 처리 후 모임방 입장
                            // ====================================

                            try
                            {

                                joinButton.disabled =
                                    true;


                                joinButton.textContent =
                                    "참가 중...";


                                const joinResponse =
                                    await authenticatedFetch(
                                        "/meetings/join",
                                        {
                                            method:
                                                "POST",

                                            headers: {

                                                "Content-Type":
                                                    "application/json"

                                            },

                                            body:
                                                JSON.stringify(
                                                    {

                                                        inviteCode:
                                                        meeting.inviteCode

                                                    }
                                                )
                                        }
                                    );


                                if (!joinResponse.ok)
                                {

                                    let message =
                                        "모임 참가에 실패했습니다.";


                                    try
                                    {

                                        const text =
                                            await joinResponse.text();


                                        if (text)
                                        {
                                            message =
                                                text;
                                        }

                                    }
                                    catch (ignore)
                                    {
                                    }


                                    throw new Error(
                                        message
                                    );
                                }


                                const data =
                                    await joinResponse.json();


                                localStorage.setItem(
                                    "chatMeetingId",
                                    data.meetingId
                                );


                                window.location.href =
                                    "/meeting?meetingId="
                                    +
                                    encodeURIComponent(
                                        data.meetingId
                                    );

                            }
                            catch (error)
                            {

                                console.error(
                                    "[QUICK JOIN ERROR]",
                                    error
                                );


                                alert(
                                    error.message
                                    ||
                                    "모임 참가에 실패했습니다."
                                );


                                joinButton.disabled =
                                    false;


                                joinButton.textContent =
                                    "참여하기";
                            }
                        }
                    );


                    card.appendChild(
                        joinButton
                    );


                    quickMeetingList.appendChild(
                        card
                    );
                }
            );

        }
        catch (error)
        {

            console.error(
                "[QUICK MEETINGS ERROR]",
                error
            );


            quickMeetingList.textContent =
                "번개 모임을 불러오지 못했습니다.";
        }
    }


    // ============================================================
    // 검색 버튼
    // ============================================================

    quickSearchButton.addEventListener(
        "click",
        function()
        {

            const keyword =
                quickSearchInput
                    .value
                    .trim();


            loadQuickMeetings(
                keyword
            );
        }
    );


    // ============================================================
    // Enter 검색
    // ============================================================

    quickSearchInput.addEventListener(
        "keydown",
        function(event)
        {

            if (
                event.key
                !==
                "Enter"
            )
            {
                return;
            }


            const keyword =
                quickSearchInput
                    .value
                    .trim();


            loadQuickMeetings(
                keyword
            );
        }
    );


    // ============================================================
    // 최초 목록 조회
    // ============================================================

    loadQuickMeetings();

</script>

</body>

</html>
