<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetBack 비밀번호 찾기</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body class="auth-page">

<div class="forgot-password-container auth-card">

    <a class="mb-brand" th:href="@{/}">
        <img th:src="@{/images/favicon.svg}" alt="">
        <span>MeetBack</span>
    </a>

    <div class="auth-heading">
        <div class="mb-eyebrow">Account recovery</div>
        <h1>비밀번호 찾기</h1>
        <p>가입한 이메일로 비밀번호 재설정 링크를 보내드립니다.</p>
    </div>


    <form id="forgotPasswordForm">

        <div>

            <label for="email">
                이메일
            </label>

            <input
                    type="email"
                    id="email"
                    placeholder="이메일을 입력하세요"
                    required
            >

        </div>


        <br>


        <button
                type="submit"
                id="passwordResetRequestButton"
        >
            재설정 이메일 보내기
        </button>

    </form>


    <br>


    <div id="forgotPasswordMessage" role="status" aria-live="polite"></div>


    <br>


    <div class="auth-back-link">

        <a th:href="@{/login}">
            로그인으로 돌아가기
        </a>

    </div>

</div>


<script>

    const forgotPasswordForm =
        document.getElementById(
            "forgotPasswordForm"
        );


    const forgotPasswordMessage =
        document.getElementById(
            "forgotPasswordMessage"
        );


    const passwordResetRequestButton =
        document.getElementById(
            "passwordResetRequestButton"
        );


    forgotPasswordForm.addEventListener(
        "submit",
        async function(event)
        {

            event.preventDefault();


            forgotPasswordMessage.innerText =
                "";


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            if (!email)
            {

                forgotPasswordMessage.innerText =
                    "이메일을 입력해주세요.";

                return;
            }


            try
            {

                passwordResetRequestButton.disabled =
                    true;


                const response =
                    await fetch(
                        "/auth/password/reset/request",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify(
                                {

                                    email:
                                    email

                                }
                            )

                        }
                    );


                if (!response.ok)
                {

                    forgotPasswordMessage.innerText =
                        "비밀번호 재설정 요청 처리 중 오류가 발생했습니다.";

                    return;
                }


                forgotPasswordMessage.innerText =
                    "입력한 이메일이 가입된 계정이라면 비밀번호 재설정 메일이 전송됩니다.";

            }
            catch (error)
            {

                console.error(
                    "비밀번호 재설정 이메일 요청 오류:",
                    error
                );


                forgotPasswordMessage.innerText =
                    "비밀번호 재설정 요청 처리 중 오류가 발생했습니다.";
            }
            finally
            {

                passwordResetRequestButton.disabled =
                    false;
            }

        }
    );

</script>

</body>

</html>
