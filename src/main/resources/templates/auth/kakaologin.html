<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetBack 카카오 로그인</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body class="auth-page">

<div class="kakao-login-container auth-card">

    <a class="mb-brand" th:href="@{/}">
        <img th:src="@{/images/favicon.svg}" alt="">
        <span>MeetBack</span>
    </a>

    <div class="auth-heading">
        <div class="mb-eyebrow">Social account</div>
        <h1>카카오 로그인</h1>
        <p>계정 확인 후 MeetBack으로 안전하게 이동합니다.</p>
    </div>

    <div id="kakaoLoginMessage" role="status" aria-live="polite">
        카카오 로그인 처리 중입니다.
    </div>


    <div
            id="kakaoLoginData"
            th:data-status="${status}"
            th:data-signup-token="${signupToken}"
            th:data-access-token="${accessToken}"
            th:data-refresh-token="${refreshToken}"
            th:data-user-id="${userId}"
            th:data-role="${role}"
            style="display: none;"
    >
    </div>


    <!-- 신규 카카오 회원 가입 -->
    <div
            id="kakaoSignupContainer"
            style="display: none;"
    >

        <h3>
            닉네임 설정
        </h3>

        <p>
            MeetBack에서 사용할 닉네임을 입력해주세요.
        </p>


        <div>

            <label for="kakaoNickname">
                닉네임
            </label>

            <input
                    type="text"
                    id="kakaoNickname"
                    placeholder="닉네임을 입력하세요"
            >

            <button
                    type="button"
                    id="nicknameCheckButton"
            >
                중복 확인
            </button>

        </div>


        <br>


        <div id="nicknameCheckMessage" role="status" aria-live="polite"></div>


        <br>


        <h3>
            약관 동의
        </h3>


        <div id="kakaoTermsContainer"></div>


        <div id="kakaoTermsMessage" role="status" aria-live="polite"></div>


        <br>


        <button
                type="button"
                id="kakaoSignupButton"
                disabled
        >
            가입 완료
        </button>


        <br>
        <br>


        <div id="kakaoSignupMessage" role="status" aria-live="polite"></div>

    </div>

</div>


<script>

    const kakaoLoginData =
        document.getElementById(
            "kakaoLoginData"
        );


    const kakaoLoginMessage =
        document.getElementById(
            "kakaoLoginMessage"
        );


    const kakaoSignupContainer =
        document.getElementById(
            "kakaoSignupContainer"
        );


    const kakaoNickname =
        document.getElementById(
            "kakaoNickname"
        );


    const nicknameCheckButton =
        document.getElementById(
            "nicknameCheckButton"
        );


    const nicknameCheckMessage =
        document.getElementById(
            "nicknameCheckMessage"
        );


    const kakaoSignupButton =
        document.getElementById(
            "kakaoSignupButton"
        );


    const kakaoSignupMessage =
        document.getElementById(
            "kakaoSignupMessage"
        );


    const kakaoTermsContainer =
        document.getElementById(
            "kakaoTermsContainer"
        );


    const kakaoTermsMessage =
        document.getElementById(
            "kakaoTermsMessage"
        );


    const status =
        kakaoLoginData.dataset.status;


    const signupToken =
        kakaoLoginData.dataset.signupToken;


    const accessToken =
        kakaoLoginData.dataset.accessToken;


    const refreshToken =
        kakaoLoginData.dataset.refreshToken;


    const userId =
        kakaoLoginData.dataset.userId;


    const role =
        kakaoLoginData.dataset.role;


    let checkedNickname =
        null;


    // 닉네임 정책
    const nicknamePattern =
        /^[가-힣A-Za-z0-9_]{2,12}$/;


    const blockedNicknameWords =
        [
            "시발",
            "씨발",
            "시팔",
            "씨팔",
            "미친",
            "미친놈",
            "미친년",
            "병신",
            "븅신",
            "개새끼",
            "개새",
            "새끼",
            "좆",
            "존나",
            "졸라",
            "지랄",
            "염병",
            "꺼져",
            "닥쳐",
            "fuck",
            "fucking",
            "shit",
            "bitch"
        ];


    const reservedNicknames =
        [
            "admin",
            "administrator",
            "manager",
            "master",
            "root",
            "meetback",
            "관리자",
            "운영자",
            "매니저",
            "마스터"
        ];


    // 닉네임 필터용 정규화
    function normalizeNicknameForFilter(
        nickname
    )
    {

        return nickname
            .toLowerCase()
            .replaceAll(
                "_",
                ""
            );
    }


    // 닉네임 사용 가능 형식 검사
    function isValidNickname(
        nickname
    )
    {

        if (!nickname)
        {
            return false;
        }


        if (
            !nicknamePattern.test(
                nickname
            )
        )
        {
            return false;
        }


        const normalizedNickname =
            normalizeNicknameForFilter(
                nickname
            );


        for (const blockedWord of blockedNicknameWords)
        {

            const normalizedBlockedWord =
                normalizeNicknameForFilter(
                    blockedWord
                );


            if (
                normalizedNickname.includes(
                    normalizedBlockedWord
                )
            )
            {
                return false;
            }
        }


        for (const reservedNickname of reservedNicknames)
        {

            const normalizedReservedNickname =
                normalizeNicknameForFilter(
                    reservedNickname
                );


            if (
                normalizedNickname ===
                normalizedReservedNickname
            )
            {
                return false;
            }
        }


        return true;
    }


    // 로그인 정보 저장
    function saveLoginData(
        data
    )
    {

        localStorage.setItem(
            "accessToken",
            data.accessToken
        );


        localStorage.setItem(
            "refreshToken",
            data.refreshToken
        );


        localStorage.setItem(
            "userId",
            data.userId
        );


        localStorage.setItem(
            "role",
            data.role
        );
    }


    // 카카오 신규 회원가입용 약관 조회
    async function loadKakaoTerms()
    {

        kakaoTermsContainer.innerHTML =
            "";


        kakaoTermsMessage.innerText =
            "";


        kakaoSignupButton.disabled =
            true;


        try
        {

            const response =
                await fetch(
                    "/terms",
                    {
                        method: "GET"
                    }
                );


            if (!response.ok)
            {

                kakaoTermsMessage.innerText =
                    "약관 정보를 불러오지 못했습니다.";

                return false;
            }


            const terms =
                await response.json();


            if (
                !Array.isArray(
                    terms
                )
                ||
                terms.length === 0
            )
            {

                kakaoTermsMessage.innerText =
                    "현재 적용 중인 약관을 확인할 수 없습니다.";

                return false;
            }


            for (const term of terms)
            {

                const wrapper =
                    document.createElement(
                        "div"
                    );


                const label =
                    document.createElement(
                        "label"
                    );


                const checkbox =
                    document.createElement(
                        "input"
                    );


                checkbox.type =
                    "checkbox";


                checkbox.dataset.termId =
                    String(
                        term.termId
                    );


                checkbox.dataset.required =
                    String(
                        term.required === true
                    );


                label.appendChild(
                    checkbox
                );


                const title =
                    document.createElement(
                        "span"
                    );


                title.textContent =
                    (term.required
                        ? "[필수] "
                        : "[선택] ")
                    + term.termName
                    + " "
                    + "(v"
                    + term.version
                    + ")";


                label.appendChild(
                    title
                );


                wrapper.appendChild(
                    label
                );


                const details =
                    document.createElement(
                        "details"
                    );


                const summary =
                    document.createElement(
                        "summary"
                    );


                summary.textContent =
                    "약관 내용 보기";


                const content =
                    document.createElement(
                        "div"
                    );


                content.style.whiteSpace =
                    "pre-wrap";


                content.textContent =
                    term.content
                    ||
                    "약관 내용이 없습니다.";


                details.appendChild(
                    summary
                );


                details.appendChild(
                    content
                );


                wrapper.appendChild(
                    details
                );


                wrapper.appendChild(
                    document.createElement(
                        "br"
                    )
                );


                kakaoTermsContainer.appendChild(
                    wrapper
                );
            }


            kakaoSignupButton.disabled =
                false;


            return true;

        }
        catch (error)
        {

            console.error(
                "약관 조회 오류:",
                error
            );


            kakaoTermsMessage.innerText =
                "약관 조회 중 오류가 발생했습니다.";


            return false;
        }
    }


    // 동의한 약관 ID 조회
    function getAgreedTermIds()
    {

        const checkedTerms =
            kakaoTermsContainer.querySelectorAll(
                'input[data-term-id]:checked'
            );


        return Array.from(
            checkedTerms
        ).map(
            checkbox =>
                Number(
                    checkbox.dataset.termId
                )
        );
    }


    // 필수 약관 모두 동의했는지 검사
    function areRequiredTermsAgreed()
    {

        const requiredTerms =
            kakaoTermsContainer.querySelectorAll(
                'input[data-required="true"]'
            );


        if (
            requiredTerms.length === 0
        )
        {
            return false;
        }


        for (const checkbox of requiredTerms)
        {

            if (!checkbox.checked)
            {
                return false;
            }
        }


        return true;
    }


    // 카카오 로그인 결과 처리
    async function handleKakaoLoginResult()
    {

        // 기존 카카오 회원 로그인
        if (
            status ===
            "LOGIN_SUCCESS"
        )
        {

            if (
                accessToken
                &&
                refreshToken
                &&
                userId
            )
            {

                saveLoginData(
                    {
                        accessToken: accessToken,
                        refreshToken: refreshToken,
                        userId: userId,
                        role: role
                    }
                );


                kakaoLoginMessage.innerText =
                    "카카오 로그인에 성공했습니다.";


                window.location.href =
                    "/home";

            }
            else
            {

                kakaoLoginMessage.innerText =
                    "카카오 로그인 정보를 확인할 수 없습니다.";
            }


            return;
        }


        // 신규 카카오 회원
        if (
            status ===
            "NICKNAME_REQUIRED"
        )
        {

            if (!signupToken)
            {

                kakaoLoginMessage.innerText =
                    "카카오 회원가입 정보를 확인할 수 없습니다.";

                return;
            }


            kakaoSignupContainer.style.display =
                "block";


            const termsLoaded =
                await loadKakaoTerms();


            if (!termsLoaded)
            {

                kakaoLoginMessage.innerText =
                    "카카오 인증은 완료되었지만 약관 정보를 불러오지 못했습니다.";

                return;
            }


            kakaoLoginMessage.innerText =
                "카카오 인증이 완료되었습니다. 닉네임과 필수 약관 동의를 완료해주세요.";


            return;
        }


        kakaoLoginMessage.innerText =
            "카카오 로그인에 실패했습니다.";
    }


    handleKakaoLoginResult();


    // 닉네임 변경 시 중복 확인 초기화
    kakaoNickname.addEventListener(
        "input",
        function()
        {

            checkedNickname =
                null;


            nicknameCheckMessage.innerText =
                "";


            kakaoSignupMessage.innerText =
                "";
        }
    );


    // 닉네임 중복 검사
    nicknameCheckButton.addEventListener(
        "click",
        async function()
        {

            const nickname =
                kakaoNickname.value;


            nicknameCheckMessage.innerText =
                "";


            kakaoSignupMessage.innerText =
                "";


            checkedNickname =
                null;


            if (!nickname)
            {

                nicknameCheckMessage.innerText =
                    "닉네임을 입력해주세요.";

                return;
            }


            if (
                !isValidNickname(
                    nickname
                )
            )
            {

                nicknameCheckMessage.innerText =
                    "사용할 수 없는 닉네임입니다. 2~12자의 한글, 영문, 숫자, 밑줄(_)만 사용할 수 있습니다.";

                return;
            }


            try
            {

                const response =
                    await fetch(
                        "/auth/nickname/check?nickname="
                        + encodeURIComponent(
                            nickname
                        ),
                        {
                            method: "GET"
                        }
                    );


                if (!response.ok)
                {

                    nicknameCheckMessage.innerText =
                        "닉네임 중복 확인에 실패했습니다.";

                    return;
                }


                const data =
                    await response.json();


                if (data.available)
                {

                    checkedNickname =
                        nickname;


                    nicknameCheckMessage.innerText =
                        "사용 가능한 닉네임입니다.";

                }
                else
                {

                    checkedNickname =
                        null;


                    nicknameCheckMessage.innerText =
                        "이미 사용 중이거나 사용할 수 없는 닉네임입니다.";
                }

            }
            catch (error)
            {

                checkedNickname =
                    null;


                console.error(
                    "닉네임 중복 확인 오류:",
                    error
                );


                nicknameCheckMessage.innerText =
                    "닉네임 확인 중 오류가 발생했습니다.";
            }

        }
    );


    // 카카오 신규 회원가입 완료
    kakaoSignupButton.addEventListener(
        "click",
        async function()
        {

            kakaoSignupMessage.innerText =
                "";


            kakaoTermsMessage.innerText =
                "";


            const nickname =
                kakaoNickname.value;


            if (!signupToken)
            {

                kakaoSignupMessage.innerText =
                    "카카오 회원가입 정보가 없습니다.";

                return;
            }


            if (!nickname)
            {

                kakaoSignupMessage.innerText =
                    "닉네임을 입력해주세요.";

                return;
            }


            if (
                !isValidNickname(
                    nickname
                )
            )
            {

                kakaoSignupMessage.innerText =
                    "사용할 수 없는 닉네임입니다.";

                return;
            }


            if (
                checkedNickname !==
                nickname
            )
            {

                kakaoSignupMessage.innerText =
                    "닉네임 중복 확인을 해주세요.";

                return;
            }


            if (
                !areRequiredTermsAgreed()
            )
            {

                kakaoTermsMessage.innerText =
                    "필수 약관에 모두 동의해주세요.";

                return;
            }


            const agreedTermIds =
                getAgreedTermIds();


            try
            {

                const response =
                    await fetch(
                        "/auth/social/complete",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify(
                                {

                                    signupToken:
                                    signupToken,

                                    nickname:
                                    nickname,

                                    agreedTermIds:
                                    agreedTermIds

                                }
                            )

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok)
                {

                    kakaoSignupMessage.innerText =
                        data.message
                        ||
                        "카카오 회원가입에 실패했습니다.";

                    return;
                }


                if (
                    data.status !==
                    "LOGIN_SUCCESS"
                )
                {

                    kakaoSignupMessage.innerText =
                        "카카오 회원가입 결과를 확인할 수 없습니다.";

                    return;
                }


                saveLoginData(
                    data
                );


                checkedNickname =
                    null;


                kakaoSignupMessage.innerText =
                    "회원가입 및 로그인에 성공했습니다.";


                window.location.href =
                    "/home";

            }
            catch (error)
            {

                console.error(
                    "카카오 회원가입 요청 오류:",
                    error
                );


                kakaoSignupMessage.innerText =
                    "카카오 회원가입 처리 중 오류가 발생했습니다.";
            }

        }
    );

</script>

</body>

</html>
