<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>MeetBack 회원가입</title>
</head>

<body>

<div class="signup-container">

    <h1>MeetBack 회원가입</h1>


    <form id="signupForm">

        <!-- 이메일 -->
        <div>

            <label for="email">
                이메일
            </label>

            <input
                    type="email"
                    id="email"
                    placeholder="이메일을 입력하세요"
                    autocomplete="email"
                    required
            >

            <button
                    type="button"
                    id="emailCheckButton"
            >
                중복 확인
            </button>

        </div>


        <br>


        <div id="emailCheckMessage"></div>


        <br>


        <!-- 닉네임 -->
        <div>

            <label for="nickname">
                닉네임
            </label>

            <input
                    type="text"
                    id="nickname"
                    placeholder="닉네임을 입력하세요"
                    required
            >

            <button
                    type="button"
                    id="nicknameCheckButton"
            >
                중복 확인
            </button>

        </div>


        <br>


        <div id="nicknameCheckMessage"></div>


        <br>


        <!-- 비밀번호 -->
        <div>

            <label for="password">
                비밀번호
            </label>

            <input
                    type="password"
                    id="password"
                    placeholder="비밀번호를 입력하세요"
                    autocomplete="new-password"
                    required
            >

        </div>


        <br>


        <!-- 비밀번호 입력창 클릭 시 표시 -->
        <div
                id="passwordMessage"
                style="display: none;"
        ></div>


        <br>


        <!-- 비밀번호 확인 -->
        <div>

            <label for="passwordConfirm">
                비밀번호 확인
            </label>

            <input
                    type="password"
                    id="passwordConfirm"
                    placeholder="비밀번호를 다시 입력하세요"
                    autocomplete="new-password"
                    required
            >

        </div>


        <br>


        <div id="passwordConfirmMessage"></div>


        <br>


        <div id="signupMessage"></div>


        <br>


        <button type="submit">
            회원가입
        </button>

    </form>


    <br>


    <div>

        <a th:href="@{/login}">
            로그인으로 돌아가기
        </a>

    </div>

</div>


<script>

    const signupForm =
        document.getElementById(
            "signupForm"
        );


    const signupMessage =
        document.getElementById(
            "signupMessage"
        );


    const emailInput =
        document.getElementById(
            "email"
        );


    const emailCheckButton =
        document.getElementById(
            "emailCheckButton"
        );


    const emailCheckMessage =
        document.getElementById(
            "emailCheckMessage"
        );


    const nicknameInput =
        document.getElementById(
            "nickname"
        );


    const nicknameCheckButton =
        document.getElementById(
            "nicknameCheckButton"
        );


    const nicknameCheckMessage =
        document.getElementById(
            "nicknameCheckMessage"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const passwordConfirmInput =
        document.getElementById(
            "passwordConfirm"
        );


    const passwordMessage =
        document.getElementById(
            "passwordMessage"
        );


    const passwordConfirmMessage =
        document.getElementById(
            "passwordConfirmMessage"
        );


    let checkedEmail = null;

    let checkedNickname = null;


    // 비밀번호 정책
    const passwordPattern =
        /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9\s])\S{8,20}$/;


    // 이메일 변경 시 중복 확인 초기화
    emailInput.addEventListener(
        "input",
        function()
        {

            checkedEmail =
                null;


            emailCheckMessage.innerText =
                "";


            signupMessage.innerText =
                "";
        }
    );


    // 이메일 중복 검사
    emailCheckButton.addEventListener(
        "click",
        async function()
        {

            const email =
                emailInput.value.trim();


            checkedEmail =
                null;


            emailCheckMessage.innerText =
                "";


            signupMessage.innerText =
                "";


            if (!email)
            {

                emailCheckMessage.innerText =
                    "이메일을 입력해주세요.";

                return;
            }


            if (!emailInput.checkValidity())
            {

                emailCheckMessage.innerText =
                    "올바른 이메일 형식을 입력해주세요.";

                return;
            }


            try
            {

                const response =
                    await fetch(
                        "/auth/email/check?email="
                        + encodeURIComponent(
                            email
                        ),
                        {
                            method: "GET"
                        }
                    );


                if (!response.ok)
                {

                    emailCheckMessage.innerText =
                        "이메일 중복 확인에 실패했습니다.";

                    return;
                }


                const data =
                    await response.json();


                if (data.available)
                {

                    checkedEmail =
                        email;


                    emailCheckMessage.innerText =
                        "사용 가능한 이메일입니다.";

                }
                else
                {

                    checkedEmail =
                        null;


                    emailCheckMessage.innerText =
                        "이미 사용 중인 이메일입니다.";
                }

            }
            catch (error)
            {

                checkedEmail =
                    null;


                console.error(
                    "이메일 중복 확인 오류:",
                    error
                );


                emailCheckMessage.innerText =
                    "이메일 확인 중 오류가 발생했습니다.";
            }

        }
    );


    // 닉네임 변경 시 중복 확인 초기화
    nicknameInput.addEventListener(
        "input",
        function()
        {

            checkedNickname =
                null;


            nicknameCheckMessage.innerText =
                "";


            signupMessage.innerText =
                "";
        }
    );


    // 닉네임 중복 검사
    nicknameCheckButton.addEventListener(
        "click",
        async function()
        {

            const nickname =
                nicknameInput.value.trim();


            checkedNickname =
                null;


            nicknameCheckMessage.innerText =
                "";


            signupMessage.innerText =
                "";


            if (!nickname)
            {

                nicknameCheckMessage.innerText =
                    "닉네임을 입력해주세요.";

                return;
            }


            try
            {

                const response =
                    await fetch(
                        "/auth/nickname/check?nickname="
                        + encodeURIComponent(
                            nickname
                        ),
                        {
                            method: "GET"
                        }
                    );


                if (!response.ok)
                {

                    nicknameCheckMessage.innerText =
                        "닉네임 중복 확인에 실패했습니다.";

                    return;
                }


                const data =
                    await response.json();


                if (data.available)
                {

                    checkedNickname =
                        nickname;


                    nicknameCheckMessage.innerText =
                        "사용 가능한 닉네임입니다.";

                }
                else
                {

                    checkedNickname =
                        null;


                    nicknameCheckMessage.innerText =
                        "이미 사용 중인 닉네임입니다.";
                }

            }
            catch (error)
            {

                checkedNickname =
                    null;


                console.error(
                    "닉네임 중복 확인 오류:",
                    error
                );


                nicknameCheckMessage.innerText =
                    "닉네임 확인 중 오류가 발생했습니다.";
            }

        }
    );


    // 비밀번호 입력창 클릭 시 정책 안내
    passwordInput.addEventListener(
        "focus",
        function()
        {

            passwordMessage.style.display =
                "block";


            if (!passwordInput.value)
            {

                passwordMessage.innerText =
                    "8~20자, 영문 대/소문자·숫자·특수문자를 포함해 주세요.";
            }

        }
    );


    // 비밀번호 입력 검사
    passwordInput.addEventListener(
        "input",
        function()
        {

            const password =
                passwordInput.value;


            signupMessage.innerText =
                "";


            passwordMessage.style.display =
                "block";


            if (!password)
            {

                passwordMessage.innerText =
                    "8~20자, 영문 대/소문자·숫자·특수문자를 포함해 주세요.";


                checkPasswordConfirm();


                return;
            }


            if (
                passwordPattern.test(
                    password
                )
            )
            {

                passwordMessage.innerText =
                    "사용 가능한 비밀번호입니다.";

            }
            else
            {

                passwordMessage.innerText =
                    "비밀번호 조건을 확인해 주세요.";
            }


            checkPasswordConfirm();

        }
    );


    // 비밀번호 입력창에서 벗어났을 때
    passwordInput.addEventListener(
        "blur",
        function()
        {

            if (!passwordInput.value)
            {

                passwordMessage.style.display =
                    "none";
            }

        }
    );


    // 비밀번호 확인 입력 검사
    passwordConfirmInput.addEventListener(
        "input",
        function()
        {

            signupMessage.innerText =
                "";


            checkPasswordConfirm();

        }
    );


    // 비밀번호 일치 검사
    function checkPasswordConfirm()
    {

        const password =
            passwordInput.value;


        const passwordConfirm =
            passwordConfirmInput.value;


        if (!passwordConfirm)
        {

            passwordConfirmMessage.innerText =
                "";

            return;
        }


        if (
            password ===
            passwordConfirm
        )
        {

            passwordConfirmMessage.innerText =
                "비밀번호가 일치합니다.";

        }
        else
        {

            passwordConfirmMessage.innerText =
                "비밀번호가 일치하지 않습니다.";
        }

    }


    // 회원가입
    signupForm.addEventListener(
        "submit",
        async function(event)
        {

            event.preventDefault();


            signupMessage.innerText =
                "";


            const email =
                emailInput.value.trim();


            const nickname =
                nicknameInput.value.trim();


            const password =
                passwordInput.value;


            const passwordConfirm =
                passwordConfirmInput.value;


            if (!email)
            {

                signupMessage.innerText =
                    "이메일을 입력해주세요.";

                return;
            }


            if (!emailInput.checkValidity())
            {

                signupMessage.innerText =
                    "올바른 이메일 형식을 입력해주세요.";

                return;
            }


            if (
                checkedEmail !==
                email
            )
            {

                signupMessage.innerText =
                    "이메일 중복 확인을 해주세요.";

                return;
            }


            if (!nickname)
            {

                signupMessage.innerText =
                    "닉네임을 입력해주세요.";

                return;
            }


            if (
                checkedNickname !==
                nickname
            )
            {

                signupMessage.innerText =
                    "닉네임 중복 확인을 해주세요.";

                return;
            }


            if (!password)
            {

                signupMessage.innerText =
                    "비밀번호를 입력해주세요.";

                return;
            }


            if (
                !passwordPattern.test(
                    password
                )
            )
            {

                signupMessage.innerText =
                    "비밀번호 조건을 확인해 주세요.";


                passwordMessage.style.display =
                    "block";


                passwordMessage.innerText =
                    "8~20자, 영문 대/소문자·숫자·특수문자를 포함해 주세요.";

                return;
            }


            if (!passwordConfirm)
            {

                signupMessage.innerText =
                    "비밀번호 확인을 입력해주세요.";

                return;
            }


            if (
                password !==
                passwordConfirm
            )
            {

                signupMessage.innerText =
                    "비밀번호가 일치하지 않습니다.";

                return;
            }


            try
            {

                const response =
                    await fetch(
                        "/auth/signup",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify(
                                {

                                    email:
                                    email,

                                    nickname:
                                    nickname,

                                    password:
                                    password

                                }
                            )

                        }
                    );


                if (!response.ok)
                {

                    let message =
                        "회원가입에 실패했습니다.";


                    try
                    {

                        const data =
                            await response.json();


                        if (data.message)
                        {

                            message =
                                data.message;
                        }

                    }
                    catch (error)
                    {

                        console.error(
                            "회원가입 오류 응답 처리:",
                            error
                        );
                    }


                    signupMessage.innerText =
                        message;


                    return;
                }


                signupMessage.innerText =
                    "회원가입이 완료되었습니다.";


                setTimeout(
                    function()
                    {

                        window.location.href =
                            "/login";

                    },
                    500
                );

            }
            catch (error)
            {

                console.error(
                    "회원가입 요청 오류:",
                    error
                );


                signupMessage.innerText =
                    "회원가입 처리 중 오류가 발생했습니다.";
            }

        }
    );

</script>

</body>

</html>
