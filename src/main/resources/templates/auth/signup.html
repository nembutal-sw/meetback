<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetBack 회원가입</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>

<body class="auth-page">

<div class="signup-container auth-card">

    <a class="mb-brand" th:href="@{/}">
        <img th:src="@{/images/favicon.svg}" alt="">
        <span>MeetBack</span>
    </a>

    <div class="auth-heading">
        <div class="mb-eyebrow">Account gate · 02</div>
        <h1>회원가입</h1>
        <p>참가자별 지하철 막차와 귀가 가능 시간을 확인할 계정을 만드세요.</p>
    </div>


    <form id="signupForm">

        <!-- 이메일 -->
        <div>

            <label for="email">
                이메일
            </label>

            <input
                    type="email"
                    id="email"
                    placeholder="이메일을 입력하세요"
                    autocomplete="email"
                    required
            >

            <button
                    type="button"
                    id="emailCheckButton"
            >
                중복 확인
            </button>

        </div>


        <br>


        <div id="emailCheckMessage" role="status" aria-live="polite"></div>


        <br>


        <!-- 닉네임 -->
        <div>

            <label for="nickname">
                닉네임
            </label>

            <input
                    type="text"
                    id="nickname"
                    placeholder="닉네임을 입력하세요"
                    required
            >

            <button
                    type="button"
                    id="nicknameCheckButton"
            >
                중복 확인
            </button>

        </div>


        <br>


        <div id="nicknameCheckMessage" role="status" aria-live="polite"></div>


        <br>


        <!-- 비밀번호 -->
        <div>

            <label for="password">
                비밀번호
            </label>

            <input
                    type="password"
                    id="password"
                    placeholder="비밀번호를 입력하세요"
                    autocomplete="new-password"
                    required
            >

        </div>


        <br>


        <div
                id="passwordMessage"
                role="status"
                aria-live="polite"
                style="display: none;"
        ></div>


        <br>


        <!-- 비밀번호 확인 -->
        <div>

            <label for="passwordConfirm">
                비밀번호 확인
            </label>

            <input
                    type="password"
                    id="passwordConfirm"
                    placeholder="비밀번호를 다시 입력하세요"
                    autocomplete="new-password"
                    required
            >

        </div>


        <br>


        <div id="passwordConfirmMessage" role="status" aria-live="polite"></div>


        <br>


        <!-- 약관 -->
        <div>

            <h3>
                약관 동의
            </h3>

            <div id="termsContainer"></div>

            <div id="termsMessage" role="status" aria-live="polite"></div>

        </div>


        <br>


        <div id="signupMessage" role="status" aria-live="polite"></div>


        <br>


        <button
                type="submit"
                id="signupButton"
                disabled
        >
            회원가입
        </button>

    </form>


    <br>


    <div class="auth-back-link">

        <a th:href="@{/login}">
            로그인으로 돌아가기
        </a>

    </div>

</div>


<script>

    const signupForm =
        document.getElementById(
            "signupForm"
        );


    const signupMessage =
        document.getElementById(
            "signupMessage"
        );


    const signupButton =
        document.getElementById(
            "signupButton"
        );


    const emailInput =
        document.getElementById(
            "email"
        );


    const emailCheckButton =
        document.getElementById(
            "emailCheckButton"
        );


    const emailCheckMessage =
        document.getElementById(
            "emailCheckMessage"
        );


    const nicknameInput =
        document.getElementById(
            "nickname"
        );


    const nicknameCheckButton =
        document.getElementById(
            "nicknameCheckButton"
        );


    const nicknameCheckMessage =
        document.getElementById(
            "nicknameCheckMessage"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const passwordConfirmInput =
        document.getElementById(
            "passwordConfirm"
        );


    const passwordMessage =
        document.getElementById(
            "passwordMessage"
        );


    const passwordConfirmMessage =
        document.getElementById(
            "passwordConfirmMessage"
        );


    const termsContainer =
        document.getElementById(
            "termsContainer"
        );


    const termsMessage =
        document.getElementById(
            "termsMessage"
        );


    let checkedEmail =
        null;


    let checkedNickname =
        null;


    // 비밀번호 정책
    const passwordPattern =
        /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9\s])\S{8,20}$/;


    // 닉네임 정책
    const nicknamePattern =
        /^[가-힣A-Za-z0-9_]{2,12}$/;


    const blockedNicknameWords =
        [
            "시발",
            "씨발",
            "시팔",
            "씨팔",
            "병신",
            "븅신",
            "개새끼",
            "개새",
            "새끼",
            "미친",
            "미친놈",
            "미친년",
            "좆",
            "존나",
            "졸라",
            "지랄",
            "염병",
            "꺼져",
            "닥쳐",
            "fuck",
            "fucking",
            "shit",
            "bitch"
        ];


    const reservedNicknames =
        [
            "admin",
            "administrator",
            "manager",
            "master",
            "root",
            "meetback",
            "관리자",
            "운영자",
            "매니저",
            "마스터"
        ];


    // 닉네임 필터용 정규화
    function normalizeNicknameForFilter(
        nickname
    )
    {

        return nickname
            .toLowerCase()
            .replaceAll(
                "_",
                ""
            );
    }


    // 닉네임 사용 가능 형식 검사
    function isValidNickname(
        nickname
    )
    {

        if (!nickname)
        {
            return false;
        }


        if (
            !nicknamePattern.test(
                nickname
            )
        )
        {
            return false;
        }


        const normalizedNickname =
            normalizeNicknameForFilter(
                nickname
            );


        for (const blockedWord of blockedNicknameWords)
        {

            const normalizedBlockedWord =
                normalizeNicknameForFilter(
                    blockedWord
                );


            if (
                normalizedNickname.includes(
                    normalizedBlockedWord
                )
            )
            {
                return false;
            }
        }


        for (const reservedNickname of reservedNicknames)
        {

            const normalizedReservedNickname =
                normalizeNicknameForFilter(
                    reservedNickname
                );


            if (
                normalizedNickname ===
                normalizedReservedNickname
            )
            {
                return false;
            }
        }


        return true;
    }


    // 현재 활성 약관 조회
    async function loadTerms()
    {

        termsContainer.innerHTML =
            "";


        termsMessage.innerText =
            "";


        signupButton.disabled =
            true;


        try
        {

            const response =
                await fetch(
                    "/terms",
                    {
                        method: "GET"
                    }
                );


            if (!response.ok)
            {

                termsMessage.innerText =
                    "약관 정보를 불러오지 못했습니다.";

                return;
            }


            const terms =
                await response.json();


            if (
                !Array.isArray(
                    terms
                )
                ||
                terms.length === 0
            )
            {

                termsMessage.innerText =
                    "현재 적용 중인 약관을 확인할 수 없습니다.";

                return;
            }


            for (const term of terms)
            {

                const wrapper =
                    document.createElement(
                        "div"
                    );


                const label =
                    document.createElement(
                        "label"
                    );


                const checkbox =
                    document.createElement(
                        "input"
                    );


                checkbox.type =
                    "checkbox";


                checkbox.dataset.termId =
                    String(
                        term.termId
                    );


                checkbox.dataset.required =
                    String(
                        term.required === true
                    );


                label.appendChild(
                    checkbox
                );


                const title =
                    document.createElement(
                        "span"
                    );


                title.textContent =
                    (term.required
                        ? "[필수] "
                        : "[선택] ")
                    + term.termName
                    + " "
                    + "(v"
                    + term.version
                    + ")";


                label.appendChild(
                    title
                );


                wrapper.appendChild(
                    label
                );


                const details =
                    document.createElement(
                        "details"
                    );


                const summary =
                    document.createElement(
                        "summary"
                    );


                summary.textContent =
                    "약관 내용 보기";


                const content =
                    document.createElement(
                        "div"
                    );


                content.style.whiteSpace =
                    "pre-wrap";


                content.textContent =
                    term.content
                    ||
                    "약관 내용이 없습니다.";


                details.appendChild(
                    summary
                );


                details.appendChild(
                    content
                );


                wrapper.appendChild(
                    details
                );


                wrapper.appendChild(
                    document.createElement(
                        "br"
                    )
                );


                termsContainer.appendChild(
                    wrapper
                );
            }


            signupButton.disabled =
                false;

        }
        catch (error)
        {

            console.error(
                "약관 조회 오류:",
                error
            );


            termsMessage.innerText =
                "약관 조회 중 오류가 발생했습니다.";
        }
    }


    // 체크된 약관 ID
    function getAgreedTermIds()
    {

        const checkedTerms =
            termsContainer.querySelectorAll(
                'input[data-term-id]:checked'
            );


        return Array.from(
            checkedTerms
        ).map(
            checkbox =>
                Number(
                    checkbox.dataset.termId
                )
        );
    }


    // 필수 약관 동의 검사
    function areRequiredTermsAgreed()
    {

        const requiredTerms =
            termsContainer.querySelectorAll(
                'input[data-required="true"]'
            );


        if (
            requiredTerms.length === 0
        )
        {
            return false;
        }


        for (const checkbox of requiredTerms)
        {

            if (!checkbox.checked)
            {
                return false;
            }
        }


        return true;
    }


    // 페이지 로딩 시 약관 조회
    loadTerms();


    // 이메일 변경 시 중복 확인 초기화
    emailInput.addEventListener(
        "input",
        function()
        {

            checkedEmail =
                null;


            emailCheckMessage.innerText =
                "";


            signupMessage.innerText =
                "";
        }
    );


    // 이메일 중복 검사
    emailCheckButton.addEventListener(
        "click",
        async function()
        {

            const email =
                emailInput.value.trim();


            checkedEmail =
                null;


            emailCheckMessage.innerText =
                "";


            signupMessage.innerText =
                "";


            if (!email)
            {

                emailCheckMessage.innerText =
                    "이메일을 입력해주세요.";

                return;
            }


            if (!emailInput.checkValidity())
            {

                emailCheckMessage.innerText =
                    "올바른 이메일 형식을 입력해주세요.";

                return;
            }


            try
            {

                const response =
                    await fetch(
                        "/auth/email/check?email="
                        + encodeURIComponent(
                            email
                        ),
                        {
                            method: "GET"
                        }
                    );


                if (!response.ok)
                {

                    emailCheckMessage.innerText =
                        "이메일 중복 확인에 실패했습니다.";

                    return;
                }


                const data =
                    await response.json();


                if (data.available)
                {

                    checkedEmail =
                        email;


                    emailCheckMessage.innerText =
                        "사용 가능한 이메일입니다.";

                }
                else
                {

                    checkedEmail =
                        null;


                    emailCheckMessage.innerText =
                        "이미 사용 중인 이메일입니다.";
                }

            }
            catch (error)
            {

                checkedEmail =
                    null;


                console.error(
                    "이메일 중복 확인 오류:",
                    error
                );


                emailCheckMessage.innerText =
                    "이메일 확인 중 오류가 발생했습니다.";
            }

        }
    );


    // 닉네임 변경 시 중복 확인 초기화
    nicknameInput.addEventListener(
        "input",
        function()
        {

            checkedNickname =
                null;


            nicknameCheckMessage.innerText =
                "";


            signupMessage.innerText =
                "";
        }
    );


    // 닉네임 중복 검사
    nicknameCheckButton.addEventListener(
        "click",
        async function()
        {

            const nickname =
                nicknameInput.value;


            checkedNickname =
                null;


            nicknameCheckMessage.innerText =
                "";


            signupMessage.innerText =
                "";


            if (!nickname)
            {

                nicknameCheckMessage.innerText =
                    "닉네임을 입력해주세요.";

                return;
            }


            if (
                !isValidNickname(
                    nickname
                )
            )
            {

                nicknameCheckMessage.innerText =
                    "사용할 수 없는 닉네임입니다. 2~12자의 한글, 영문, 숫자, 밑줄(_)만 사용할 수 있습니다.";

                return;
            }


            try
            {

                const response =
                    await fetch(
                        "/auth/nickname/check?nickname="
                        + encodeURIComponent(
                            nickname
                        ),
                        {
                            method: "GET"
                        }
                    );


                if (!response.ok)
                {

                    nicknameCheckMessage.innerText =
                        "닉네임 중복 확인에 실패했습니다.";

                    return;
                }


                const data =
                    await response.json();


                if (data.available)
                {

                    checkedNickname =
                        nickname;


                    nicknameCheckMessage.innerText =
                        "사용 가능한 닉네임입니다.";

                }
                else
                {

                    checkedNickname =
                        null;


                    nicknameCheckMessage.innerText =
                        "이미 사용 중이거나 사용할 수 없는 닉네임입니다.";
                }

            }
            catch (error)
            {

                checkedNickname =
                    null;


                console.error(
                    "닉네임 중복 확인 오류:",
                    error
                );


                nicknameCheckMessage.innerText =
                    "닉네임 확인 중 오류가 발생했습니다.";
            }

        }
    );


    // 비밀번호 입력창 클릭 시 정책 안내
    passwordInput.addEventListener(
        "focus",
        function()
        {

            passwordMessage.style.display =
                "block";


            if (!passwordInput.value)
            {

                passwordMessage.innerText =
                    "8~20자, 영문 대/소문자·숫자·특수문자를 포함해 주세요.";
            }

        }
    );


    // 비밀번호 입력 검사
    passwordInput.addEventListener(
        "input",
        function()
        {

            const password =
                passwordInput.value;


            signupMessage.innerText =
                "";


            passwordMessage.style.display =
                "block";


            if (!password)
            {

                passwordMessage.innerText =
                    "8~20자, 영문 대/소문자·숫자·특수문자를 포함해 주세요.";


                checkPasswordConfirm();


                return;
            }


            if (
                passwordPattern.test(
                    password
                )
            )
            {

                passwordMessage.innerText =
                    "사용 가능한 비밀번호입니다.";

            }
            else
            {

                passwordMessage.innerText =
                    "비밀번호 조건을 확인해 주세요.";
            }


            checkPasswordConfirm();

        }
    );


    // 비밀번호 입력창에서 벗어났을 때
    passwordInput.addEventListener(
        "blur",
        function()
        {

            if (!passwordInput.value)
            {

                passwordMessage.style.display =
                    "none";
            }

        }
    );


    // 비밀번호 확인 입력 검사
    passwordConfirmInput.addEventListener(
        "input",
        function()
        {

            signupMessage.innerText =
                "";


            checkPasswordConfirm();

        }
    );


    // 비밀번호 일치 검사
    function checkPasswordConfirm()
    {

        const password =
            passwordInput.value;


        const passwordConfirm =
            passwordConfirmInput.value;


        if (!passwordConfirm)
        {

            passwordConfirmMessage.innerText =
                "";

            return;
        }


        if (
            password ===
            passwordConfirm
        )
        {

            passwordConfirmMessage.innerText =
                "비밀번호가 일치합니다.";

        }
        else
        {

            passwordConfirmMessage.innerText =
                "비밀번호가 일치하지 않습니다.";
        }

    }


    // 회원가입
    signupForm.addEventListener(
        "submit",
        async function(event)
        {

            event.preventDefault();


            signupMessage.innerText =
                "";


            termsMessage.innerText =
                "";


            const email =
                emailInput.value.trim();


            const nickname =
                nicknameInput.value;


            const password =
                passwordInput.value;


            const passwordConfirm =
                passwordConfirmInput.value;


            if (!email)
            {

                signupMessage.innerText =
                    "이메일을 입력해주세요.";

                return;
            }


            if (!emailInput.checkValidity())
            {

                signupMessage.innerText =
                    "올바른 이메일 형식을 입력해주세요.";

                return;
            }


            if (
                checkedEmail !==
                email
            )
            {

                signupMessage.innerText =
                    "이메일 중복 확인을 해주세요.";

                return;
            }


            if (!nickname)
            {

                signupMessage.innerText =
                    "닉네임을 입력해주세요.";

                return;
            }


            if (
                !isValidNickname(
                    nickname
                )
            )
            {

                signupMessage.innerText =
                    "사용할 수 없는 닉네임입니다.";

                return;
            }


            if (
                checkedNickname !==
                nickname
            )
            {

                signupMessage.innerText =
                    "닉네임 중복 확인을 해주세요.";

                return;
            }


            if (!password)
            {

                signupMessage.innerText =
                    "비밀번호를 입력해주세요.";

                return;
            }


            if (
                !passwordPattern.test(
                    password
                )
            )
            {

                signupMessage.innerText =
                    "비밀번호 조건을 확인해 주세요.";


                passwordMessage.style.display =
                    "block";


                passwordMessage.innerText =
                    "8~20자, 영문 대/소문자·숫자·특수문자를 포함해 주세요.";

                return;
            }


            if (!passwordConfirm)
            {

                signupMessage.innerText =
                    "비밀번호 확인을 입력해주세요.";

                return;
            }


            if (
                password !==
                passwordConfirm
            )
            {

                signupMessage.innerText =
                    "비밀번호가 일치하지 않습니다.";

                return;
            }


            if (
                !areRequiredTermsAgreed()
            )
            {

                termsMessage.innerText =
                    "필수 약관에 모두 동의해주세요.";

                return;
            }


            const agreedTermIds =
                getAgreedTermIds();


            try
            {

                const response =
                    await fetch(
                        "/auth/signup",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify(
                                {

                                    email:
                                    email,

                                    nickname:
                                    nickname,

                                    password:
                                    password,

                                    passwordConfirm:
                                    passwordConfirm,

                                    agreedTermIds:
                                    agreedTermIds

                                }
                            )

                        }
                    );


                if (!response.ok)
                {

                    let message =
                        "회원가입에 실패했습니다.";


                    try
                    {

                        const data =
                            await response.json();


                        if (data.message)
                        {

                            message =
                                data.message;
                        }

                    }
                    catch (error)
                    {

                        console.error(
                            "회원가입 오류 응답 처리:",
                            error
                        );
                    }


                    signupMessage.innerText =
                        message;


                    return;
                }


                signupMessage.innerText =
                    "회원가입이 완료되었습니다.";


                setTimeout(
                    function()
                    {

                        window.location.href =
                            "/login";

                    },
                    500
                );

            }
            catch (error)
            {

                console.error(
                    "회원가입 요청 오류:",
                    error
                );


                signupMessage.innerText =
                    "회원가입 처리 중 오류가 발생했습니다.";
            }

        }
    );

</script>

</body>

</html>
