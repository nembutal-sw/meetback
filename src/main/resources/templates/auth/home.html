    const createMeetingButton =

    // ============================================================
    // 생성된 모임 초대 링크 복사
    // ============================================================

    async function copyCreatedInviteUrl()
    {

        const button =
            document.getElementById(
                "createdInviteCodeButton"
            );


        const inviteCode =
            button.dataset.inviteCode;


        if (!inviteCode)
        {

            showHomeMessage(
                "초대코드를 확인할 수 없습니다.",
                "error"
            );


            return;
        }


        // =========================================================
        // 초대 링크 생성
        //
        // 예:
        //
        // http://localhost:8080/home?inviteCode=97B390F1
        // =========================================================

        const inviteUrl =
            window.location.origin
            + "/home?inviteCode="
            + encodeURIComponent(
                inviteCode
            );


        const originalText =
            "🔗 초대코드 "
            + inviteCode;


        try
        {

            await navigator.clipboard.writeText(
                inviteUrl
            );


            button.textContent =
                "✓ 초대 링크 복사 완료";


            showHomeMessage(
                "초대 링크가 복사되었습니다.",
                "success"
            );


            setTimeout(
                () =>
                {

                    button.innerHTML =
                        `
                    🔗 초대코드
                    <span id="createdInviteCode">
                        ${inviteCode}
                    </span>
                    `;

                },
                1500
            );

        }
        catch (error)
        {

            console.error(
                "[INVITE COPY ERROR]",
                error
            );


            // =====================================================
            // clipboard API가 동작하지 않을 경우 fallback
            // =====================================================

            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                inviteUrl;


            textarea.style.position =
                "fixed";


            textarea.style.opacity =
                "0";


            document.body.appendChild(
                textarea
            );


            textarea.select();


            document.execCommand(
                "copy"
            );


            textarea.remove();


            button.textContent =
                "✓ 초대 링크 복사 완료";


            showHomeMessage(
                "초대 링크가 복사되었습니다.",
                "success"
            );


            setTimeout(
                () =>
                {

                    button.innerHTML =
                        `
                    🔗 초대코드
                    <span id="createdInviteCode">
                        ${inviteCode}
                    </span>
                    `;

                },
                1500
            );
        }
    }


    // ============================================================
    // ★ 초대 URL에서 inviteCode 보관
    //
    // /home?inviteCode=ABC123
    //
    // 로그인하지 않은 상태라면 잠시 뒤 /login 으로 이동하므로
    // 그 전에 sessionStorage에 초대코드를 저장한다.
    // ============================================================

    function preserveInviteCode()
    {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const inviteCode =
            params.get(
                "inviteCode"
            );


        if (!inviteCode)
        {
            return;
        }


        const normalizedInviteCode =
            inviteCode
                .trim()
                .toUpperCase();


        if (!normalizedInviteCode)
        {
            return;
        }


        sessionStorage.setItem(
            "pendingInviteCode",
            normalizedInviteCode
        );


        console.log(
            "[INVITE] pendingInviteCode 저장:",
            normalizedInviteCode
        );
    }



    // ============================================================
    // 메시지 출력
    // ============================================================

    function showHomeMessage(
        message,
        type = "info"
    )
    {

        homeMessage.innerText =
            message;


        homeMessage.className =
            "message show";


        if (type === "success")
        {

            homeMessage.classList.add(
                "message-success"
            );

        }
        else if (type === "error")
        {

            homeMessage.classList.add(
                "message-error"
            );

        }
        else
        {

            homeMessage.classList.add(
                "message-info"
            );

        }

    }



    // ============================================================
    // 로그인 정보 삭제
    // ============================================================

    function clearLoginStorage()
    {

        localStorage.removeItem(
            "accessToken"
        );


        localStorage.removeItem(
            "refreshToken"
        );


        localStorage.removeItem(
            "userId"
        );


        localStorage.removeItem(
            "role"
        );


        /*
         * 이전 채팅방 정보도 로그인 종료 시 제거
         */
        localStorage.removeItem(
            "chatMeetingId"
        );


        accessToken =
            null;

    }

    // ============================================================
    // 초대코드 또는 초대 URL에서 inviteCode 추출
    //
    // 가능:
    // A9E60F5C
    //
    // http://localhost:8080/home?inviteCode=A9E60F5C
    // ============================================================

    function extractInviteCode(
        value
    )
    {

        if (!value)
        {
            return "";
        }


        const text =
            value.trim();


        /*
         * URL 안에 ?inviteCode= 또는 &inviteCode=가 있다면
         * 코드 부분만 꺼낸다.
         */
        const match =
            text.match(
                /[?&]inviteCode=([^&#]+)/i
            );


        if (match)
        {

            return decodeURIComponent(
                match[1]
            ).trim();
        }


        /*
         * URL이 아니라 그냥 초대코드를 입력한 경우
         */
        return text;
    }



    // ============================================================
    // 초대코드 또는 초대 URL에서 inviteCode 추출
    //
    // 가능:
    // A9E60F5C
    //
    // http://localhost:8080/home?inviteCode=A9E60F5C
    // ============================================================

    function extractInviteCode(
        value
    )
    {

        if (!value)
        {
            return "";
        }


        const text =
            value.trim();


        /*
         * URL 안에 ?inviteCode= 또는 &inviteCode=가 있다면
         * 코드 부분만 꺼낸다.
         */
        const match =
            text.match(
                /[?&]inviteCode=([^&#]+)/i
            );


        if (match)
        {

            return decodeURIComponent(
                match[1]
            ).trim();
        }


        /*
         * URL이 아니라 그냥 초대코드를 입력한 경우
         */
        return text;
    }



    // ============================================================
    // Refresh Token 재발급
    // ============================================================

    async function refreshTokens()
    {

        const refreshToken =
            localStorage.getItem(
                "refreshToken"
            );


        if (!refreshToken)
        {

            return false;

        }


        try
        {

            const response =
                await fetch(
                    refreshUrl,
                    {

                        method:
                            "POST",


                        headers: {

                            "Content-Type":
                                "application/json"

                        },


                        body:
                            JSON.stringify(
                                {

                                    refreshToken:
                                    refreshToken

                                }
                            )

                    }
                );


            if (!response.ok)
            {

                return false;

            }


            const data =
                await response.json();

            localStorage.setItem(
                "userId",
                data.userId
            );

            localStorage.setItem(
                "role",
                data.role
            );

            localStorage.setItem(
                "nickname",
                data.nickname
            );


            localStorage.setItem(
                "accessToken",
                data.accessToken
            );


            localStorage.setItem(
                "refreshToken",
                data.refreshToken
            );


            accessToken =
                data.accessToken;


            return true;

        }
        catch (error)
        {

            console.error(
                "토큰 재발급 오류:",
                error
            );


            return false;

        }

    }



    // ============================================================
    // JWT 포함 요청 공통 함수
    //
    // 모임 생성/참가 중 Access Token이 만료됐을 때도
    // Refresh Token으로 한 번 재발급 후 다시 요청
    // ============================================================

    async function authenticatedFetch(
        url,
        options = {}
    )
    {

        options.headers =
            options.headers || {};


        options.headers[
            "Authorization"
            ] =
            "Bearer "
            + accessToken;


        let response =
            await fetch(
                url,
                options
            );


        /*
         * 현재 프로젝트 Security 설정에 따라
         * 만료 Token이 401 또는 403으로 올 수 있으므로
         * 두 경우 모두 재발급 시도
         */
        if (
            response.status === 401
            ||
            response.status === 403
        )
        {

            const refreshed =
                await refreshTokens();


            if (!refreshed)
            {

                return response;

            }


            options.headers[
                "Authorization"
                ] =
                "Bearer "
                + accessToken;


            response =
                await fetch(
                    url,
                    options
                );

        }


        return response;

    }



    // ============================================================
    // Access Token 로그인 확인
    // ============================================================

    async function requestLoginCheck()
    {

        return await fetch(
            checkUrl,
            {

                method:
                    "GET",


                headers: {

                    "Authorization":
                        "Bearer "
                        + accessToken

                }

            }
        );

    }



    // ============================================================
    // 로그인 상태 확인
    // ============================================================

    async function checkLogin()
    {

        if (!accessToken)
        {

            const refreshed =
                await refreshTokens();


            if (!refreshed)
            {

                clearLoginStorage();


                window.location.href =
                    loginUrl;


                return false;

            }

        }


        try
        {

            let response =
                await requestLoginCheck();


            if (!response.ok)
            {

                const refreshed =
                    await refreshTokens();


                if (!refreshed)
                {

                    clearLoginStorage();


                    window.location.href =
                        loginUrl;


                    return false;

                }


                response =
                    await requestLoginCheck();


                if (!response.ok)
                {

                    clearLoginStorage();


                    window.location.href =
                        loginUrl;


                    return false;

                }

            }


            const data =
                await response.json();


            userIdDiv.innerText =
                "사용자 ID : "
                + data.userId;


            roleDiv.innerText =
                "권한 : "
                + data.role;

            currentNickname =
                data.nickname;


            /*
             * 서버에서 검증된 사용자 정보로
             * localStorage 값도 맞춰줌
             */
            localStorage.setItem(
                "userId",
                data.userId
            );


            localStorage.setItem(
                "role",
                data.role
            );


            return true;

        }
        catch (error)
        {

            console.error(
                "로그인 상태 확인 오류:",
                error
            );


            clearLoginStorage();


            window.location.href =
                loginUrl;


            return false;

        }

    }



    // ============================================================
    // ★ 초대코드로 참가 공통 함수
    //
    // autoEnter
    // false : 기존처럼 참가 완료 화면 표시
    // true  : 초대 링크로 온 경우 바로 모임방으로 이동
    // ============================================================

    async function joinMeetingByInviteCode(
        inviteCode,
        autoEnter = false
    )
    {

        const normalizedInviteCode =
            inviteCode
                .trim()
                .toUpperCase();


        if (!normalizedInviteCode)
        {

            throw new Error(
                "초대코드를 입력해주세요."
            );
        }


        const response =
            await authenticatedFetch(
                joinMeetingUrl,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            {

                                inviteCode:
                                normalizedInviteCode

                            }
                        )
                }
            );


        if (!response.ok)
        {

            const errorText =
                await response.text();


            throw new Error(
                errorText
                || "모임 참가에 실패했습니다."
            );
        }


        /*
         * MeetingJoinResponse
         *
         * {
         *     meetingId,
         *     newlyJoined
         * }
         */
        const data =
            await response.json();


        console.log(
            "[MEETING JOIN]",
            data
        );


        const meetingId =
            data.meetingId;


        const newlyJoined =
            data.newlyJoined;


        if (!meetingId)
        {

            throw new Error(
                "모임 ID를 확인할 수 없습니다."
            );
        }


        /*
         * 참가 성공했으므로 pending 코드 제거.
         */
        sessionStorage.removeItem(
            "pendingInviteCode"
        );


        localStorage.setItem(
            "chatMeetingId",
            meetingId
        );


        /*
         * 초대 링크를 타고 온 경우
         * 참가 성공 즉시 모임방 이동.
         */
        if (autoEnter)
        {

            window.location.href =
                meetingPageUrl
                + "?meetingId="

    logoutButton.addEventListener(
        "click",
        async function()
        {

            if (logoutButton.disabled)
            {

                return;

            }


            logoutButton.disabled =
                true;


            try
            {

                /*
                 * Access Token이 정상이라면 바로 로그아웃.
                 *
                 * Access Token만 만료된 경우에는
                 * authenticatedFetch()에서 Refresh Token으로
                 * 한 번 재발급한 뒤 다시 로그아웃 요청한다.
                 */
                const response =
                    await fetch(
                        logoutUrl,
                        {

                            method:

                                "POST",

                            headers: {

                                "Authorization":
                                    "Bearer "
                                    + accessToken

                            }
                        }
                    );


                if (response.ok)
                {

                    /*
                     * 서버에서
                     * refresh_tokens 삭제
                     * token_version 증가가 완료된 상태
                     */
                    clearLoginStorage();


                    window.location.href =
                        loginUrl;


                    return;

                }


                /*
                 * 다른 기기에서 같은 계정으로 로그인한 경우
                 *
                 * 현재 기기의 Access Token은 tokenVersion 불일치,
                 * Refresh Token도 DB의 새 Token과 불일치하므로
                 * 재발급에 실패한다.
                 *
                 * 이 경우 다른 기기의 Refresh Token을
                 * 삭제하면 안 되므로 현재 브라우저 정보만 삭제한다.
                 */
                if (
                    response.status === 401
                    ||
                    response.status === 403
                )
                {

                    clearLoginStorage();


                    window.location.href =
                        loginUrl;


                    return;

                }


                showHomeMessage(
                    "로그아웃 처리 중 오류가 발생했습니다.",
                    "error"
                );


                logoutButton.disabled =
                    false;

            }
            catch (error)
            {

                console.error(
                    "로그아웃 요청 오류:",
                    error
                );


                showHomeMessage(
                    "로그아웃 처리 중 오류가 발생했습니다.",
                    "error"
                );


                logoutButton.disabled =
                    false;

            }

        }
    );

    // ============================================================
    // Spring 백엔드 재시작 감지
    // ============================================================

    async function checkServerRestart()
    {

        try
        {

            const response =
                await fetch(
                    "/auth/server-instance"
                );


            if (!response.ok)
            {

                console.error(
                    "[SERVER INSTANCE] 조회 실패",
                    response.status
                );


                return false;
            }


            const data =
                await response.json();


            const currentServerInstanceId =
                data.serverInstanceId;


            const savedServerInstanceId =
                localStorage.getItem(
                    "serverInstanceId"
                );


            console.log(
                "[SERVER INSTANCE]",
                {
                    current:
                    currentServerInstanceId,

                    saved:
                    savedServerInstanceId
                }
            );


            // =====================================================
            // 최초 접속
            // =====================================================

            if (!savedServerInstanceId)
            {

                localStorage.setItem(
                    "serverInstanceId",
                    currentServerInstanceId
                );


                return false;
            }


            // =====================================================
            // Spring 백엔드 재시작 감지
            // =====================================================

            if (
                savedServerInstanceId
                !== currentServerInstanceId
            )
            {

                console.log(
                    "[SERVER RESTART DETECTED]"
                );


                // 로그인 관련 값 삭제
                localStorage.removeItem(
                    "accessToken"
                );

                localStorage.removeItem(
                    "refreshToken"
                );

                localStorage.removeItem(
                    "userId"
                );

                localStorage.removeItem(
                    "role"
                );

                localStorage.removeItem(
                    "nickname"
                );


                // 새로운 실행 ID 저장
                localStorage.setItem(
                    "serverInstanceId",
                    currentServerInstanceId
                );


                window.location.replace(
                    "/login"
                );

                return true;
            }
            return false;

        }
        catch (error)
        {

            console.error(
                "[SERVER INSTANCE CHECK ERROR]",
                error
            );
            return false;
        }
    }



    // ============================================================
    // ★ Home 초기화
    // ============================================================

    async function initializeHome()
    {
        const serverRestarted =
            await checkServerRestart();

        /*
         * 중요:
         *
         * 로그인 확인보다 먼저 실행해야 한다.
         *
         * /home?inviteCode=ABC
         *      ↓
         * pendingInviteCode 저장
         *      ↓
         * 로그인 필요하면 /login 이동
         */
        if (serverRestarted)
        {
            return;
        }

        preserveInviteCode();

        /*
         * 로그인 확인
         */
        const loggedIn =
            await checkLogin();


        if (!loggedIn)
        {
            return;
        }


        /*
         * 로그인 성공 후
         * 로그인 전에 저장했던 초대코드 확인
         */
        const pendingInviteCode =
            sessionStorage.getItem(
                "pendingInviteCode"
            );


        if (!pendingInviteCode)
        {
            return;
        }


        /*
         * 사용자에게도 현재 처리 중인
         * 초대코드가 보이게 한다.
         */
        inviteCodeInput.value =
            pendingInviteCode;


        showHomeMessage(
            "초대받은 모임에 참가하고 있습니다.",
            "info"
        );


        joinMeetingButton.disabled =
            true;


        try
        {

            /*
             * true
             * =
             * 성공하면 바로 모임방 이동
             */
            await joinMeetingByInviteCode(
                pendingInviteCode,
                true
            );
        }
        catch (error)
        {

            console.error(
                "[INVITE AUTO JOIN ERROR]",
                error
            );


            /*
             * 실패할 경우 pendingInviteCode는 지우지 않는다.
             *
             * 입력창에 코드가 남아 있으므로
             * 사용자가 직접 모임 참가 버튼을 눌러
             * 다시 시도할 수 있다.
             */
            showHomeMessage(
                error.message
                || "초대받은 모임 참가에 실패했습니다.",
                "error"
            );
        }
        finally
        {

            joinMeetingButton.disabled =
                false;
        }
    }



    // ============================================================
    // 실행
    // ============================================================

    initializeHome();
