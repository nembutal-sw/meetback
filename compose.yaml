services:
  db:
    image: mysql:8.4
    environment:
      # 빈 볼륨에서 최초 실행할 때 meet_back 데이터베이스를 생성한다.
      MYSQL_DATABASE: meet_back
      # root와 분리된 애플리케이션 전용 계정을 사용한다.
      MYSQL_USER: meetback
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      # root 비밀번호는 앱용 .env와 분리된 Docker secret으로 주입한다.
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # DATETIME과 애플리케이션의 로컬 시각 기준을 일치시킨다.
      - --default-time-zone=+09:00
    volumes:
      - mysql_data:/var/lib/mysql
    secrets:
      - mysql_root_password
    healthcheck:
      # 생성된 DB와 애플리케이션 계정으로 실제 쿼리가 가능한지 확인한다.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" --execute='SELECT 1' --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 호스트 .env의 0600 권한을 유지하면서 읽을 수 있게 UID를 맞춘다.
        APP_UID: ${APP_UID:-1000}
    environment:
      # 컨테이너 내부에서는 서비스 이름으로 MySQL에 연결한다.
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: meet_back
      DB_USERNAME: meetback
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      TZ: Asia/Seoul
      # MySQL 8 기본 인증을 내부 비TLS 네트워크에서 사용할 수 있게 한다.
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/meet_back?allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul"
    volumes:
      # 토큰이 담긴 호스트 파일을 컨테이너에 읽기 전용으로 연결한다.
      - type: bind
        source: ${MEETBACK_ENV_FILE:-./.env}
        target: /app/config/.env
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  # 데이터베이스 데이터는 컨테이너 재생성 후에도 유지한다.
  mysql_data:

secrets:
  mysql_root_password:
    file: ${MYSQL_ROOT_PASSWORD_FILE:-./secrets/mysql_root_password}
