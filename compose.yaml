services:
  db:
    image: mysql:8.4
    environment:
      # 빈 볼륨에서 최초 실행할 때 meet_back 데이터베이스를 생성한다.
      MYSQL_DATABASE: meet_back
      # root와 분리된 애플리케이션 전용 계정을 사용한다.
      MYSQL_USER: meetback
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # DATETIME과 애플리케이션의 로컬 시각 기준을 일치시킨다.
      - --default-time-zone=+09:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 생성된 DB와 애플리케이션 계정으로 실제 쿼리가 가능한지 확인한다.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" --execute='SELECT 1' --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # 컨테이너 내부에서는 서비스 이름으로 MySQL에 연결한다.
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: meet_back
      DB_USERNAME: meetback
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      TZ: Asia/Seoul
      # MySQL 8 기본 인증을 내부 비TLS 네트워크에서 사용할 수 있게 한다.
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/meet_back?allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul"
      # 앱에 필요한 값만 전달해 MySQL root 비밀번호가 노출되지 않게 한다.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:?JWT_ACCESS_TOKEN_EXPIRATION must be set}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:?JWT_REFRESH_TOKEN_EXPIRATION must be set}
      JWT_SOCIAL_SIGNUP_TOKEN_EXPIRATION: ${JWT_SOCIAL_SIGNUP_TOKEN_EXPIRATION:-600000}
      JWT_PASSWORD_RESET_TOKEN_EXPIRATION: ${JWT_PASSWORD_RESET_TOKEN_EXPIRATION:-900000}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?KAKAO_CLIENT_ID must be set}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:?KAKAO_REDIRECT_URI must be set}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?KAKAO_CLIENT_SECRET must be set}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?KAKAO_REST_API_KEY must be set}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ODSAY_API_KEY: ${ODSAY_API_KEY:?ODSAY_API_KEY must be set}
      ODSAY_BASE_URL: ${ODSAY_BASE_URL:?ODSAY_BASE_URL must be set}
      NAVER_MAPS_CLIENT_ID: ${NAVER_MAPS_CLIENT_ID:?NAVER_MAPS_CLIENT_ID must be set}
      NAVER_MAPS_CLIENT_SECRET: ${NAVER_MAPS_CLIENT_SECRET:?NAVER_MAPS_CLIENT_SECRET must be set}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  # 데이터베이스 데이터는 컨테이너 재생성 후에도 유지한다.
  mysql_data:
